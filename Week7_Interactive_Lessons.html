<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 7 · KS2 Level 3 · Interactive Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --gray:#5F5E5A;--gray-light:#F1EFE8;
  --text:#2C2C2A;--white:#FFFFFF;
  --radius:12px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh;font-size:15px}
h1,h2,h3,h4{font-family:'Nunito',sans-serif}
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1;min-width:100px}
.nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:20px;border:2px solid transparent;font-size:12px;font-weight:700;cursor:pointer;transition:.13s;font-family:'Nunito',sans-serif;white-space:nowrap}
.tab.active{color:var(--white)!important}
.print-btn{background:var(--teal);color:var(--white);border:none;border-radius:20px;padding:7px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.subject-tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.stab{padding:9px 18px;border-radius:22px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:var(--white)}
.page{display:none;padding:14px 18px 50px}
.page.active{display:block}
.ws-header{background:linear-gradient(130deg,var(--amber-light),var(--teal-light));border:2px solid var(--amber-mid);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ws-badge{background:var(--amber);color:var(--white);font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:3px 10px;border-radius:20px;letter-spacing:.4px;display:inline-block;margin-bottom:4px}
.ws-title{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--teal);margin:2px 0}
.ws-sub{font-size:12px;color:var(--gray);font-weight:600}
.name-line{border:none;border-bottom:1.5px solid var(--amber);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:12px;padding:2px 4px;outline:none;width:130px}
.section{margin-bottom:18px}
.sec-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-num{background:var(--teal);color:var(--white);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.q-block{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65;color:var(--text)}
.ans-line{width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;color:var(--text);margin-top:6px;display:block}
.ans-box{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;color:var(--text);margin-top:6px;resize:none}
.inline-ans{display:inline-block;min-width:60px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;color:var(--text);padding:2px 4px}
.tip-box{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-box{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.6}
.l1-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.vocab-card{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px;border-left:4px solid var(--teal)}
.vocab-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:var(--teal)}
.vocab-meaning{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.vocab-l1{font-size:12px;color:var(--blue);font-style:italic}
.vocab-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.circle-opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.opt{border:2px solid var(--amber);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;color:var(--amber);transition:.12s;background:var(--white)}
.opt:hover{opacity:.8}
.opt.correct{background:#3B6D11!important;color:var(--white)!important;border-color:#3B6D11!important}
.opt.wrong{background:#B71C1C!important;color:var(--white)!important;border-color:#B71C1C!important}
.tbl-wrap{overflow-x:auto}
table.ws-table{width:100%;border-collapse:collapse;font-size:13px}
table.ws-table th{background:var(--teal);color:var(--white);padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.ws-table td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.ws-table tr:nth-child(even) td{background:var(--amber-light)}
table.ws-table input[type=text]{width:100%;border:none;background:transparent;font-family:'Nunito Sans',sans-serif;font-size:13px;outline:none;border-bottom:1px dashed var(--teal-mid);padding:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.story-box{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.highlight-box{background:var(--orange-light);border:2px solid var(--orange);border-radius:var(--rsm);padding:12px 14px;font-size:13px;line-height:1.8;margin:8px 0}
.remember-box{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--white);text-align:center;margin-top:12px}
.step-box{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px;margin-bottom:8px}
.step-num{background:var(--teal);color:var(--white);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-text{font-size:13px;line-height:1.6}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.info-card{border-radius:var(--rsm);padding:12px;text-align:center;border:2px solid}
.card-icon{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--amber-light);font-size:13px;line-height:1.5}
.check-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:2px solid var(--teal);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chk.done{background:var(--teal);color:var(--white)}
.frac-shape{display:inline-flex;flex-wrap:wrap;gap:3px;margin:6px 4px}
.frac-cell{width:32px;height:32px;border:2px solid var(--teal);border-radius:4px;cursor:pointer;transition:.12s}
.frac-cell.filled{background:var(--teal)}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.rock-card{border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px;border:2px solid}
.passage-box{background:#F0F9FF;border:2px solid #0EA5E9;border-radius:var(--radius);padding:14px 16px;font-size:14px;line-height:1.85;margin:8px 0}
.passage-heading{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#185FA5;margin-bottom:8px;border-bottom:2px solid #0EA5E9;padding-bottom:6px}
.passage-subhead{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#185FA5;margin:10px 0 5px}
@media(max-width:600px){.two-col,.three-col{grid-template-columns:1fr}}
@media print{.nav,.subject-tabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">📚 HOS · KS2 Level 3 · Week 7</div>
  <div class="nav-tabs" id="navTabs"></div>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
</div>
<div class="subject-tabs" id="subjectTabs"></div>
<div id="pages"></div>

<script>
const SUBJECTS=[
  {id:'eng',   label:'📖 English',    col:'#185FA5'},
  {id:'maths', label:'🔢 Maths',      col:'#0F6E56'},
  {id:'sci',   label:'🪨 Science',    col:'#C2410C'},
  {id:'hum',   label:'🌍 Humanities', col:'#534AB7'},
  {id:'bib',   label:'✝️ Bible',      col:'#B71C1C'},
];

const WS={
/* ══════════════════════════════════════════════════════
   ENGLISH — Reading Non-Fiction
══════════════════════════════════════════════════════ */
eng:[
  {num:1,badge:'Reading Non-Fiction',title:'What is Non-Fiction?',
   secs:[{t:'Learn the key words',c:'eng_nf_vocab'},{t:'Non-fiction features',c:'eng_nf_features'},{t:'Spot the difference!',c:'eng_nf_spot'}]},
  {num:2,badge:'Reading Non-Fiction',title:'Finding the Main Idea',
   secs:[{t:'Read the passage',c:'eng_nf_passage'},{t:'Main idea questions',c:'eng_nf_main'},{t:'Key detail questions',c:'eng_nf_detail'}]},
  {num:3,badge:'Reading Non-Fiction',title:'Headings and Subheadings',
   secs:[{t:'What are headings and subheadings?',c:'eng_nf_heads'},{t:'Practise with a real text',c:'eng_nf_practise'},{t:'Write your own fact paragraph',c:'eng_nf_write'}]},
],
/* ══════════════════════════════════════════════════════
   MATHS — Fractions
══════════════════════════════════════════════════════ */
maths:[
  {num:1,badge:'Fractions — Equal Parts',title:'What is a Fraction?',
   secs:[{t:'Learn the key words',c:'maths_fr_vocab'},{t:'Equal and unequal parts',c:'maths_fr_equal'},{t:'Colour the fraction!',c:'maths_fr_colour'}]},
  {num:2,badge:'Fractions — Equal Parts',title:'Fractions of Shapes and Sets',
   secs:[{t:'Fractions of shapes',c:'maths_fr_shapes'},{t:'Fractions of a set (objects)',c:'maths_fr_sets'},{t:'Find the fraction!',c:'maths_fr_find'}]},
  {num:3,badge:'Fractions — Equal Parts',title:'Comparing Fractions',
   secs:[{t:'Which fraction is bigger?',c:'maths_fr_compare'},{t:'Fractions on a number line',c:'maths_fr_numline'},{t:'Fraction challenge',c:'maths_fr_challenge'}]},
],
/* ══════════════════════════════════════════════════════
   SCIENCE — Rocks
══════════════════════════════════════════════════════ */
sci:[
  {num:1,badge:'Rocks — Types and Properties',title:'The Three Types of Rock',
   secs:[{t:'Learn the key words',c:'sci_rock_vocab'},{t:'The 3 rock types',c:'sci_rock_types'},{t:'Match the rock!',c:'sci_rock_match'}]},
  {num:2,badge:'Rocks — Types and Properties',title:'Rock Properties',
   secs:[{t:'How we describe rocks',c:'sci_rock_props'},{t:'Comparing rocks',c:'sci_rock_compare'},{t:'True or False?',c:'sci_rock_tf'}]},
  {num:3,badge:'Rocks — Types and Properties',title:'Rocks in Everyday Life',
   secs:[{t:'Where do we use rocks?',c:'sci_rock_uses'},{t:'Comprehension questions',c:'sci_rock_comp'},{t:'Rock quiz!',c:'sci_rock_quiz'}]},
],
/* ══════════════════════════════════════════════════════
   HUMANITIES — Stone Age to Iron Age
══════════════════════════════════════════════════════ */
hum:[
  {num:1,badge:'Stone Age to Iron Age — Britain',title:'The Stone Age',
   secs:[{t:'Learn the key words',c:'hum_sa_vocab'},{t:'Who were the Stone Age people?',c:'hum_sa_who'},{t:'Stone Age vs today',c:'hum_sa_compare'}]},
  {num:2,badge:'Stone Age to Iron Age — Britain',title:'Bronze Age and Iron Age',
   secs:[{t:'The Bronze Age',c:'hum_ba_bronze'},{t:'The Iron Age',c:'hum_ba_iron'},{t:'Comprehension questions',c:'hum_ba_questions'}]},
  {num:3,badge:'Stone Age to Iron Age — Britain',title:'How Tools Changed Everything',
   secs:[{t:'Tools and technology through the ages',c:'hum_tools_tech'},{t:'True or False?',c:'hum_tools_tf'},{t:'My prehistoric fact file',c:'hum_tools_factfile'}]},
],
/* ══════════════════════════════════════════════════════
   BIBLE — Moses
══════════════════════════════════════════════════════ */
bib:[
  {num:1,badge:'Moses — Speaking Up for Others',title:'The Story of Moses',
   secs:[{t:'Learn the key words',c:'bib_mos_vocab'},{t:'Read the story',c:'bib_mos_story'},{t:'Put the story in order',c:'bib_mos_sequence'}]},
  {num:2,badge:'Moses — Speaking Up for Others',title:'The Burning Bush',
   secs:[{t:'Comprehension questions',c:'bib_mos_questions'},{t:'I AM WHO I AM — Exodus 3:14',c:'bib_mos_iam'},{t:'The memory verse',c:'bib_mos_verse'}]},
  {num:3,badge:'Moses — Speaking Up for Others',title:'Speaking Up — My Life Application',
   secs:[{t:'What does it mean to speak up?',c:'bib_mos_speakup'},{t:'When should I speak up?',c:'bib_mos_apply'},{t:'Draw and write',c:'bib_mos_draw'}]},
],
};

function vc(word,meaning,l1,eg,col){
  col=col||'teal';
  return `<div class="vocab-card" style="border-left-color:var(--${col})">
  <div class="vocab-word" style="color:var(--${col})">${word}</div>
  <div class="vocab-meaning">${meaning}</div>
  <div class="vocab-l1">🌍 ${l1}</div>
  <div class="vocab-eg">✏️ e.g. ${eg}</div>
</div>`;
}

function C(key){switch(key){

/* ─── ENGLISH ───────────────────────────────────────── */
case 'eng_nf_vocab': return `
<div class="l1-box"><strong>🌍 In your language:</strong> Non-fiction = غیر افسانوی (Urdu) · غير خيالي (Arabic). Non-fiction texts are REAL — they contain true facts and information, not made-up stories!</div>
${vc('📰 Non-fiction','Writing that is about REAL things — facts, true events, real people.','غیر افسانوی / غير خيالي','\"An encyclopaedia article about elephants is non-fiction.\"','blue')}
${vc('💡 Main idea','The MOST important point a text is talking about.','مرکزی خیال / الفكرة الرئيسية','\"The main idea of the paragraph is that volcanoes are dangerous.\"','blue')}
${vc('🔍 Key detail','An important fact that SUPPORTS the main idea.','اہم تفصیل / التفاصيل الرئيسية','\"A key detail is that lava can reach 1,200°C.\"','blue')}
${vc('📋 Heading','A title for a whole text or section. Tells you the topic.','سرخی / العنوان','\"Heading: All About Volcanoes\"','blue')}
${vc('🔖 Subheading','A smaller title inside a text. Tells you what one section is about.','ذیلی سرخی / العنوان الفرعي','\"Subheading: What Makes a Volcano Erupt?\"','blue')}
<div class="q-block"><div class="q-text">A text about real facts is called <input class="inline-ans" style="width:90px" placeholder="?"/>. The most important point is called the <input class="inline-ans" style="width:80px" placeholder="?"/> idea.</div></div>`;

case 'eng_nf_features': return `
<div class="tip-box"><strong>Non-fiction texts look different from stories!</strong> They have special features to help the reader find information quickly.</div>
<div class="card-grid">
${[
  ['📋','Heading','A big title at the top. Tells you what the WHOLE text is about.'],
  ['🔖','Subheading','A smaller title inside. Tells you what ONE section is about.'],
  ['💡','Main idea sentence','Usually the FIRST sentence of a paragraph. The most important point.'],
  ['🔍','Key details','Facts and information that support and explain the main idea.'],
  ['📷','Photos/diagrams','Pictures that help explain the information.'],
  ['📝','Captions','Writing under a photo that explains what you can see.'],
  ['📌','Bold words','Important words printed in BOLD so they are easy to spot.'],
  ['📚','Contents page','A list showing what topics are covered and which page they are on.'],
].map(([i,t,d])=>`<div class="info-card" style="background:var(--blue-light);border-color:var(--blue)">
  <div class="card-icon">${i}</div>
  <div class="card-title" style="color:var(--blue)">${t}</div>
  <div class="card-desc">${d}</div>
</div>`).join('')}
</div>`;

case 'eng_nf_spot': return `
<div class="tip-box"><strong>Can you spot whether each text is FICTION (made-up story) or NON-FICTION (real facts)?</strong> Click your answer!</div>
${[
  ['"Once upon a time, a dragon lived in a tall mountain..."','Fiction','Fiction','Non-fiction'],
  ['"The blue whale is the largest animal on Earth. It can grow up to 30 metres long."','Non-fiction','Fiction','Non-fiction'],
  ['"Sarah ran through the enchanted forest, looking for the golden key."','Fiction','Fiction','Non-fiction'],
  ['"The River Nile flows through Egypt and is 6,650 km long."','Non-fiction','Fiction','Non-fiction'],
  ['"Volcanoes are openings in the Earth\'s crust where hot lava erupts."','Non-fiction','Fiction','Non-fiction'],
  ['"Tom and his magic bicycle flew over the rainbow."','Fiction','Fiction','Non-fiction'],
].map(([text,ans,o1,o2],i)=>`
<div class="q-block"><div class="q-num">Text ${i+1}</div>
<div class="q-text" style="font-style:italic;background:var(--gray-light);padding:8px;border-radius:6px;margin-bottom:6px">${text}</div>
<div class="circle-opts">
  <div class="opt" onclick="chk(this,'nfs${i}','Fiction','${ans}')">📖 Fiction</div>
  <div class="opt" onclick="chk(this,'nfs${i}','Non-fiction','${ans}')">📰 Non-fiction</div>
</div></div>`).join('')}`;

case 'eng_nf_passage': return `
<div class="tip-box"><strong>Read this non-fiction passage carefully.</strong> Look for the heading, subheadings, main idea, and key details.</div>
<div class="passage-box">
  <div class="passage-heading">🦋 BUTTERFLIES</div>
  <div class="passage-subhead">What is a butterfly?</div>
  A butterfly is an insect. It has six legs, two antennae, and four wings covered in tiny, colourful scales. Butterflies can be found on every continent except Antarctica.
  <div class="passage-subhead">The life cycle of a butterfly</div>
  Butterflies go through four stages of life. First, a butterfly lays an <strong>egg</strong> on a leaf. Then, a tiny caterpillar (called a <strong>larva</strong>) hatches from the egg and eats leaves to grow. Next, the caterpillar forms a hard shell called a <strong>chrysalis</strong>. Finally, a beautiful butterfly breaks out of the chrysalis. This process is called <strong>metamorphosis</strong>.
  <div class="passage-subhead">What do butterflies eat?</div>
  Adult butterflies drink a sweet liquid called <strong>nectar</strong> from flowers. They use a long, tube-shaped tongue called a <strong>proboscis</strong> to suck up the nectar — like drinking with a straw!
  <div class="passage-subhead">Why are butterflies important?</div>
  Butterflies are important <strong>pollinators</strong>. When they visit flowers to drink nectar, they carry tiny grains of pollen from flower to flower. This helps plants to make seeds and grow new plants.
</div>`;

case 'eng_nf_main': return `
<div class="tip-box"><strong>The main idea</strong> is the most important point. It tells us WHAT the whole paragraph is about — not just one small detail.</div>
${[
  ['What is the MAIN IDEA of the whole text?','The main idea of the whole text is ...','Butterflies are insects that go through metamorphosis and play an important role in nature.'],
  ['What is the main idea of the section "The life cycle of a butterfly"?','The main idea of this section is ...','Butterflies go through four stages of life — egg, caterpillar, chrysalis, and butterfly.'],
  ['What is the main idea of the section "Why are butterflies important"?','The main idea of this section is ...','Butterflies are important because they help plants make seeds by carrying pollen.'],
].map(([q,frame,hint],i)=>`
<div class="q-block">
  <div class="q-num">Main Idea Question ${i+1}</div>
  <div class="q-text">${q}</div>
  <div style="font-size:11px;color:var(--blue);font-style:italic;margin:4px 0">Frame: ${frame}</div>
  <input class="ans-line" placeholder="Write your answer here..."/>
  <div style="font-size:11px;color:var(--green);margin-top:4px">💡 Hint: ${hint}</div>
</div>`).join('')}`;

case 'eng_nf_detail': return `
<div class="tip-box"><strong>Key details</strong> are facts that support and explain the main idea. They answer questions like Who? What? When? Where? How many?</div>
${[
  ['How many legs does a butterfly have?','A butterfly has ______ legs.','six / 6'],
  ['What does a caterpillar do when it hatches from the egg?','When it hatches, the caterpillar ...','eats leaves to grow'],

/* ══ RENDER ════════════════════════════════════════════ */
let curSubj='eng',curLesson=1;
function chk(el,group,val,ans){
  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  if(val===ans){el.classList.add('correct');}
  else{el.classList.add('wrong');el.parentElement.querySelectorAll('.opt').forEach(o=>{if(o.textContent.trim()===ans)o.classList.add('correct');});}
}
function toggleChk(el){el.classList.toggle('done');el.textContent=el.classList.contains('done')?'✓':'';}
function toggleFrac(el){el.classList.toggle('filled');}
function render(){
  const subjectTabs=document.getElementById('subjectTabs');
  const navTabs=document.getElementById('navTabs');
  const pages=document.getElementById('pages');
  subjectTabs.innerHTML='';
  SUBJECTS.forEach(s=>{
    const el=document.createElement('div');
    el.className='stab'+(s.id===curSubj?' active':'');
    el.textContent=s.label;
    el.style.borderColor=s.col;
    el.style.color=s.id===curSubj?'#fff':s.col;
    if(s.id===curSubj)el.style.background=s.col;
    el.onclick=()=>{curSubj=s.id;curLesson=1;render();};
    subjectTabs.appendChild(el);
  });
  const subj=SUBJECTS.find(s=>s.id===curSubj);
  const lessons=WS[curSubj];
  navTabs.innerHTML='';
  lessons.forEach(l=>{
    const el=document.createElement('div');
    el.className='tab'+(l.num===curLesson?' active':'');
    el.textContent='Lesson '+l.num;
    el.style.borderColor=subj.col;
    el.style.color=l.num===curLesson?'#fff':subj.col;
    if(l.num===curLesson)el.style.background=subj.col;
    el.onclick=()=>{curLesson=l.num;render();};
    navTabs.appendChild(el);
  });
  const lesson=lessons.find(l=>l.num===curLesson);
  pages.innerHTML=`<div class="page active">
    <div class="ws-header">
      <div>
        <div class="ws-badge">${lesson.badge}</div>
        <div class="ws-title">${lesson.title}</div>
        <div class="ws-sub">Lesson ${lesson.num} of ${lessons.length} · ${subj.label} · Week 7</div>
      </div>
      <div>Name: <input class="name-line"/></div>
    </div>
    ${lesson.secs.map((sec,i)=>`<div class="section">
      <div class="sec-title"><span class="sec-num">${i+1}</span>${sec.t}</div>
      ${C(sec.c)}
    </div>`).join('')}
  </div>`;
}
render();
</script>
