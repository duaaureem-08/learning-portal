<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 10 · KS2 Level 3 · Interactive Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --pink:#BE185D;--pink-light:#FCE7F3;
  --gray:#5F5E5A;--text:#2C2C2A;--white:#FFFFFF;
  --radius:12px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Nunito',sans-serif}
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1}
.nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;transition:.13s}
.tab.active{color:#fff!important}
.print-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.subject-tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.stab{padding:9px 18px;border-radius:22px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:#fff}
.page{display:none;padding:14px 18px 50px}
.page.active{display:block}
.ws-header{background:linear-gradient(130deg,var(--amber-light),var(--teal-light));border:2px solid var(--amber-mid);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ws-badge{background:var(--amber);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:3px 10px;border-radius:20px;letter-spacing:.4px;display:inline-block;margin-bottom:4px}
.ws-title{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--teal);margin:2px 0}
.ws-sub{font-size:12px;color:var(--gray);font-weight:600}
.name-line{border:none;border-bottom:1.5px solid var(--amber);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:12px;padding:2px 4px;outline:none;width:130px}
.section{margin-bottom:18px}
.sec-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-num{background:var(--teal);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.q-block{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65}
.ans-line{width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;margin-top:6px;display:block}
.ans-box{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;margin-top:6px;resize:none}
.inline-ans{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;padding:2px 4px}
.tip-box{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-box{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.6}
.l1-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.vocab-card{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px;border-left:4px solid var(--teal)}
.v-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
.v-mean{font-size:13px;line-height:1.5;margin:3px 0}
.v-l1{font-size:12px;color:var(--blue);font-style:italic}
.v-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.wbank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:12px}
.wbank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.wtag{display:inline-block;background:var(--purple);color:#fff;border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
.opt{border:2px solid var(--amber);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;color:var(--amber);transition:.12s;background:#fff;display:inline-block;margin:3px}
.opt.correct{background:#3B6D11!important;color:#fff!important;border-color:#3B6D11!important}
.opt.wrong{background:#B71C1C!important;color:#fff!important;border-color:#B71C1C!important}
.circle-opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
table.t th{background:var(--teal);color:#fff;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.t td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.t tr:nth-child(even) td{background:var(--amber-light)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card{border-radius:var(--rsm);padding:12px;border:2px solid;text-align:center}
.card-ico{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.story{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.highlight{background:var(--amber-light);border:2px solid var(--amber);border-radius:var(--rsm);padding:12px 14px;font-size:14px;line-height:1.8;margin:8px 0}
.step{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:10px;margin-bottom:8px}
.step-n{background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-t{font-size:13px;line-height:1.6}
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--amber-light);font-size:13px;line-height:1.5}
.check-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:2px solid var(--teal);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chk.done{background:var(--teal);color:#fff}
.poem-box{background:#FFF0F6;border:2px solid var(--pink);border-radius:var(--radius);padding:18px;font-family:'Nunito',sans-serif;font-size:15px;line-height:2.2;margin:10px 0;text-align:center}
.rhyme-box{display:inline-block;background:var(--pink-light);border:2px solid var(--pink);border-radius:6px;padding:1px 8px;font-weight:800;color:var(--pink);font-size:13px}
.remember{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#fff;text-align:center;margin:14px 0}
@media(max-width:600px){.two,.three,.four{grid-template-columns:1fr}}
@media print{.nav,.subject-tabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">📚 HOS · KS2 Level 3 · Week 10 · Interactive Lessons</div>
  <div class="nav-tabs" id="navTabs"></div>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
</div>
<div class="subject-tabs" id="subjectTabs"></div>
<div id="pages"></div>

<script>
const SUBJECTS=[
  {id:'eng',  label:'📖 English',    col:'#BE185D', lt:'#FCE7F3'},
  {id:'maths',label:'🔢 Maths',      col:'#0F6E56', lt:'#E1F5EE'},
  {id:'sci',  label:'🪞 Science',    col:'#C2410C', lt:'#FFF0E6'},
  {id:'hum',  label:'🌍 Humanities', col:'#534AB7', lt:'#EEEDFE'},
  {id:'bib',  label:'✝️ Bible',      col:'#B71C1C', lt:'#FFEBEE'},
];

const WS={
eng:[
  {num:1,badge:'Poetry — Rhyme, Rhythm & Pattern',title:'What is a Poem?',
   secs:[
     {t:'Key vocabulary',          c:'eng_po_vocab'},
     {t:'Rhyme and rhyme schemes',  c:'eng_po_rhyme'},
     {t:'Find the rhymes!',         c:'eng_po_find'},
   ]},
  {num:2,badge:'Poetry — Rhyme, Rhythm & Pattern',title:'Rhythm and Repetition',
   secs:[
     {t:'What is rhythm?',          c:'eng_po_rhythm'},
     {t:'Repetition in poems',      c:'eng_po_repetition'},
     {t:'Read and respond',         c:'eng_po_read'},
   ]},
  {num:3,badge:'Poetry — Rhyme, Rhythm & Pattern',title:'Write Your Own Poem',
   secs:[
     {t:'Poem planning',            c:'eng_po_plan'},
     {t:'Write your poem',          c:'eng_po_write'},
     {t:'Check your poem',          c:'eng_po_check'},
   ]},
],
maths:[
  {num:1,badge:'Measurement — Mass & Volume',title:'Mass: Grams & Kilograms',
   secs:[
     {t:'Key vocabulary',              c:'maths_mv_vocab'},
     {t:'Grams and kilograms',         c:'maths_mv_mass'},
     {t:'Comparing mass',              c:'maths_mv_compare'},
   ]},
  {num:2,badge:'Measurement — Mass & Volume',title:'Volume: ml & Litres',
   secs:[
     {t:'Millilitres and litres',      c:'maths_mv_vol'},
     {t:'Reading measuring containers',c:'maths_mv_read'},
     {t:'Comparing volume',            c:'maths_mv_vol_compare'},
   ]},
  {num:3,badge:'Measurement — Mass & Volume',title:'Word Problems & Conversions',
   secs:[
     {t:'Converting units',            c:'maths_mv_convert'},
     {t:'Word problems',               c:'maths_mv_word'},
     {t:'Mixed challenge',             c:'maths_mv_mixed'},
   ]},
],
sci:[
  {num:1,badge:'Light — Reflection',title:'What is Reflection?',
   secs:[
     {t:'Key vocabulary',              c:'sci_lr_vocab'},
     {t:'How mirrors reflect light',   c:'sci_lr_mirrors'},
     {t:'Where do we see reflection?', c:'sci_lr_examples'},
   ]},
  {num:2,badge:'Light — Reflection',title:'Why Can We See Objects?',
   secs:[
     {t:'Light and our eyes',          c:'sci_lr_eyes'},
     {t:'Shiny vs dull surfaces',      c:'sci_lr_surfaces'},
     {t:'True or False?',              c:'sci_lr_tf'},
   ]},
  {num:3,badge:'Light — Reflection',title:'Reflection in Real Life',
   secs:[
     {t:'Reflection quiz',             c:'sci_lr_quiz'},
     {t:'Safety and reflection',       c:'sci_lr_safety'},
     {t:'Design a periscope',          c:'sci_lr_periscope'},
   ]},
],
hum:[
  {num:1,badge:'Local & National Government',title:'What is Government?',
   secs:[
     {t:'Key vocabulary',              c:'hum_gov_vocab'},
     {t:'Why do we need government?',  c:'hum_gov_why'},
     {t:'Local vs national government',c:'hum_gov_levels'},
   ]},
  {num:2,badge:'Local & National Government',title:'Who Makes Decisions?',
   secs:[
     {t:'What governments do',         c:'hum_gov_does'},
     {t:'Voting — how it works',       c:'hum_gov_vote'},
     {t:'True or False?',              c:'hum_gov_tf'},
   ]},
  {num:3,badge:'Local & National Government',title:'Government in My Life',
   secs:[
     {t:'Government quiz',             c:'hum_gov_quiz'},
     {t:'My opinion: what matters?',   c:'hum_gov_opinion'},
     {t:'Design a campaign poster',    c:'hum_gov_poster'},
   ]},
],
bib:[
  {num:1,badge:'Gideon — Brave When You Feel Small',title:'The Story of Gideon',
   secs:[
     {t:'Key vocabulary',              c:'bib_gi_vocab'},
     {t:'Read the story',              c:'bib_gi_story'},
     {t:'Story in order',              c:'bib_gi_sequence'},
   ]},
  {num:2,badge:'Gideon — Brave When You Feel Small',title:'God Chooses the Unlikely',
   secs:[
     {t:'Comprehension questions',     c:'bib_gi_questions'},
     {t:'The memory verse',            c:'bib_gi_verse'},
     {t:'True or False?',              c:'bib_gi_tf'},
   ]},
  {num:3,badge:'Gideon — Brave When You Feel Small',title:'Being Brave When I Feel Small',
   secs:[
     {t:'What does "feeling small" mean?', c:'bib_gi_small'},
     {t:'God says "I am with you"',        c:'bib_gi_with'},
     {t:'My life application',             c:'bib_gi_apply'},
   ]},
],
};

function vc(w,m,l1,eg,col){
  col=col||'teal';
  return `<div class="vocab-card" style="border-left-color:var(--${col})">
  <div class="v-word" style="color:var(--${col})">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ ${eg}</div>
</div>`;
}

function C(key){switch(key){

/* ══════════════════════════════════════════
   ENGLISH — Poetry: Rhyme, Rhythm & Pattern
   ══════════════════════════════════════════ */

case 'eng_po_vocab': return `
<div class="l1-box"><strong>🌍 In your language:</strong>
Poetry = <strong>شاعری (shaa'iri)</strong> — Urdu · <strong>شعر</strong> — Arabic<br/>
Rhyme = <strong>قافیہ (qafia)</strong> — Urdu · <strong>قافية</strong> — Arabic<br/>
Rhythm = <strong>لے (lai)</strong> — Urdu · <strong>إيقاع</strong> — Arabic
</div>
${vc('📜 Poem','A piece of writing arranged in lines, often with rhyme and rhythm.','نظم / قصيدة','"I wrote a poem about the sea."','pink')}
${vc('🎵 Rhyme','When two words end with the same sound. Example: cat/hat, moon/tune.','قافیہ / قافية','"Cat rhymes with hat — they both end in -at."','pink')}
${vc('🥁 Rhythm','The beat or pattern of sounds when you read a poem aloud.','لے / إيقاع','"This poem has a fast, exciting rhythm."','pink')}
${vc('🔁 Repetition','When a word, phrase or line is repeated on purpose for effect.','تکرار / تكرار','"Rain, rain, go away — repetition makes it memorable."','pink')}
${vc('📐 Pattern','The way rhymes, rhythm or lines are arranged in a poem.','نمونہ / نمط','"The poem has a pattern: every second line rhymes."','pink')}
<div class="q-block"><div class="q-text">Fill in: Words that end with the same sound are called <input class="inline-ans" style="width:80px" placeholder="?"/>. The beat of a poem is called its <input class="inline-ans" style="width:80px" placeholder="?"/>.</div></div>`;

case 'eng_po_rhyme': return `
<div class="tip-box"><strong>🎵 Rhyme</strong> is when words end with the same sound.<br/>
<strong>Rhyme scheme</strong> is the pattern of rhymes at the ends of lines. We use letters (A, B, C…) to show the pattern.</div>
<div class="poem-box">
  The sun is <span class="rhyme-box">bright</span>,<br/>
  It fills the <span class="rhyme-box">day</span> with <span class="rhyme-box">light</span>,<br/>
  The children laugh and <span class="rhyme-box">play</span>,<br/>
  Until the fading <span class="rhyme-box">night</span>.
</div>
<div class="q-block"><div class="q-text" style="font-size:13px">In the poem above:<br/>
• "bright" and "light" and "night" all rhyme → they are the <strong>A</strong> rhyme.<br/>
• "day" and "play" rhyme → they are the <strong>B</strong> rhyme.<br/>
• So the rhyme scheme is: <strong>A B A B A</strong>  ← this is a very common pattern!</div></div>
<p style="font-size:14px;margin-bottom:8px">Find the rhyme pairs in this poem:</p>
<div class="poem-box">
  I saw a cat upon the mat,<br/>
  She wore a little yellow hat,<br/>
  She sat and sat and sat and sat,<br/>
  And that, my friends, was simply that.
</div>
${[
  ['Which words rhyme in this poem? List them all.'],
  ['What is the rhyme scheme? (Write A for matching rhymes)'],
].map(([q],i)=>`<div class="q-block"><div class="q-num">Question ${i+1}</div><div class="q-text">${q}</div><input class="ans-line" placeholder="My answer..."/></div>`).join('')}`;

case 'eng_po_find': return `
<p style="font-size:14px;margin-bottom:10px">Click the word that rhymes with the first word!</p>
${[
  ['moon',  ['spoon','table','happy','green'], 'spoon'],
  ['bright',['black','night','soft','loud'],   'night'],
  ['song',  ['dance','short','long','noise'],  'long'],
  ['rain',  ['sun','train','flower','cold'],   'train'],
  ['tree',  ['log','sea','blue','sky'],        'sea'],
  ['star',  ['moon','car','light','far'],      'car'],
].map(([word,opts,ans],i)=>`
<div class="q-block"><div class="q-num">Rhymes with: <strong style="font-size:16px;color:var(--pink)">${word}</strong></div>
<div class="circle-opts">${opts.map(o=>`<div class="opt" onclick="chk(this,'rf${i}','${o}','${ans}')">${o}</div>`).join('')}</div></div>`).join('')}
<div class="q-block" style="margin-top:10px"><div class="q-text">Write your own rhyming pair: <input class="inline-ans" style="width:90px" placeholder="word 1"/> rhymes with <input class="inline-ans" style="width:90px" placeholder="word 2"/></div></div>`;

case 'eng_po_rhythm': return `
<div class="tip-box"><strong>🥁 Rhythm</strong> is the BEAT of a poem — like music! Clap or tap as you read. Stressed syllables (beats) are in bold.</div>
<div class="poem-box" style="font-size:14px;text-align:left;line-height:2.5">
  <strong>HUM</strong>-pty <strong>DUMP</strong>-ty <strong>SAT</strong> on a <strong>WALL</strong>,<br/>
  <strong>HUM</strong>-pty <strong>DUMP</strong>-ty <strong>HAD</strong> a great <strong>FALL</strong>.<br/>
  <span style="font-size:11px;color:var(--gray);font-style:italic">↑ Clap on the BOLD syllables — that is the RHYTHM!</span>
</div>
<div class="q-block"><div class="q-text">Try it yourself! Read this poem aloud and clap on the beat:</div>
<div class="poem-box" style="margin-top:8px;font-size:14px;text-align:left;line-height:2.5">
  Twinkle, twinkle, little star,<br/>
  How I wonder what you are!<br/>
  Up above the world so high,<br/>
  Like a diamond in the sky.
</div>
<div class="q-text" style="margin-top:8px">How many beats does each line have? <input class="inline-ans" style="width:60px" placeholder="?"/></div>
</div>
<div class="q-block"><div class="q-text">Which word describes the feeling of the rhythm in "Twinkle Twinkle"?</div>
<div class="circle-opts">
  <div class="opt" onclick="chk(this,'rh0','steady and calm','steady and calm')">steady and calm</div>
  <div class="opt" onclick="chk(this,'rh0','fast and scary','steady and calm')">fast and scary</div>
  <div class="opt" onclick="chk(this,'rh0','no rhythm at all','steady and calm')">no rhythm at all</div>
</div></div>`;

case 'eng_po_repetition': return `
<div class="tip-box"><strong>🔁 Repetition</strong> means a word, phrase or line is used more than once ON PURPOSE. It creates effect — emphasis, mood, or a musical feel.</div>
<div class="poem-box" style="text-align:left;line-height:2.5;font-size:14px">
  <strong>Rain, rain,</strong> go away,<br/>
  Come again another day.<br/>
  <strong>Rain, rain,</strong> go away,<br/>
  Little children want to play.<br/>
  <span style="font-size:11px;color:var(--gray);font-style:italic">↑ "Rain, rain" is repeated — it gives emphasis and sounds like a plea!</span>
</div>
${[
  ['Why do poets use repetition?','Repetition creates...'],
  ['Find a repeated word or phrase in the poem above. Write it:','The repeated phrase is...'],
  ['How does the repetition of "Rain, rain" make the poem feel?','It makes the poem feel...'],
].map(([q,frame],i)=>`
<div class="q-block"><div class="q-num">Question ${i+1}</div><div class="q-text">${q}</div>
<div style="font-size:12px;color:var(--pink);font-style:italic;margin:3px 0">Frame: ${frame}</div>

  ['😟','Not smart enough','Gideon said "my clan is the weakest."'],
  ['😢','Not brave enough','Gideon was HIDING when God found him.'],
  ['😶','Not important enough','Gideon said "I am the LEAST in my family."'],
  ['💭','Not capable enough','Gideon said "How can I save Israel?"'],
].map(([ico,t,d])=>`
<div class="card" style="background:var(--red-light);border-color:var(--red)">

</div>
<div class="q-block"><div class="q-text">Can you think of a time you "felt small" — not good enough or too scared to try something? Write a few words about how it felt.</div>
<textarea class="ans-box" style="min-height:44px" placeholder="I felt small when..."></textarea></div>
<div class="q-block"><div class="q-text">What or who helped you feel more confident?</div>
<input class="ans-line" placeholder="I felt more confident when..."/></div>`;

case 'bib_gi_with': return `
<div class="tip-box"><strong>The most important thing God said to Gideon was NOT "you are strong" or "you are perfect." It was:</strong></div>
<div class="verse-box">
  <div class="verse-text" style="font-size:20px">"I will be with you."</div>
  <div style="font-size:12px;color:var(--gray);margin-top:6px">— Judges 6:16</div>
</div>
<div class="tip-box"><strong>This is the KEY idea:</strong> God does not always choose the most powerful, the most talented, or the most confident person. God chooses people and then GOES WITH THEM — giving them what they need when they need it.</div>
${[
  ['💛','When you feel weak…','God says: "My power is made perfect in weakness." (2 Corinthians 12:9)'],
  ['💙','When you feel scared…','God says: "Do not fear, for I am with you." (Isaiah 41:10)'],
  ['💜','When you feel too small…','God says: "I know the plans I have for you — plans to give you hope." (Jeremiah 29:11)'],
  ['❤️','When you feel alone…','God says: "I will never leave you nor forsake you." (Hebrews 13:5)'],
].map(([col,feeling,verse])=>`
<div style="display:flex;gap:10px;background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:10px 14px;margin-bottom:8px;align-items:flex-start">
  <span style="font-size:20px">${col}</span>
  <div>

${[
  ['❤️','A challenge in my life where I feel "too small":'],
  ['🧡','What God\'s promise "I am with you" means to ME:'],

  ['💙','How Gideon\'s story makes me feel about my own challenges:'],
  ['💜','My prayer or thought after learning about Gideon:'],
].map(([col,label])=>`
<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">

<div class="remember" style="background:#B71C1C">⭐ REMEMBER: God chose Gideon because of God's STRENGTH, not Gideon's. "The Lord is with you, mighty warrior." — Judges 6:12. God uses unlikely people! 🦁</div>`;

default: return '<p style="padding:10px;color:var(--gray)">Content loading…</p>';
}}

let curSubj='eng', curLesson=1;

function chk(el,group,val,ans){
  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  if(val===ans){el.classList.add('correct');}
  else{el.classList.add('wrong');el.parentElement.querySelectorAll('.opt').forEach(o=>{if(o.textContent.trim()===ans)o.classList.add('correct');});}
}
function toggleChk(el){el.classList.toggle('done');el.textContent=el.classList.contains('done')?'✓':'';}

function render(){
  const subjectTabs=document.getElementById('subjectTabs');
  const navTabs=document.getElementById('navTabs');
  const pages=document.getElementById('pages');
  subjectTabs.innerHTML='';
  SUBJECTS.forEach(s=>{
    const el=document.createElement('div');
    el.className='stab'+(s.id===curSubj?' active':'');
    el.textContent=s.label; el.style.borderColor=s.col;
    el.style.color=s.id===curSubj?'#fff':s.col;
    if(s.id===curSubj)el.style.background=s.col;
    el.onclick=()=>{curSubj=s.id;curLesson=1;render();};
    subjectTabs.appendChild(el);
  });
  const subj=SUBJECTS.find(s=>s.id===curSubj);
  const lessons=WS[curSubj];
  navTabs.innerHTML='';
  lessons.forEach(l=>{
    const el=document.createElement('div');
    el.className='tab'+(l.num===curLesson?' active':'');
    el.textContent='Lesson '+l.num; el.style.borderColor=subj.col;
    el.style.color=l.num===curLesson?'#fff':subj.col;
    if(l.num===curLesson)el.style.background=subj.col;
    el.onclick=()=>{curLesson=l.num;render();};
    navTabs.appendChild(el);
  });
  const lesson=lessons.find(l=>l.num===curLesson);
  pages.innerHTML=`<div class="page active">
    <div class="ws-header">
      <div>
        <div class="ws-badge">${lesson.badge}</div>
        <div class="ws-title">${lesson.title}</div>
        <div class="ws-sub">Lesson ${lesson.num} of ${lessons.length} · ${subj.label} · Week 10</div>
      </div>
      <div>Name: <input class="name-line" placeholder="________________"/></div>
    </div>
    ${lesson.secs.map((sec,i)=>`
    <div class="section">
      <div class="sec-title"><span class="sec-num">${i+1}</span>${sec.t}</div>
      ${C(sec.c)}
    </div>`).join('')}
  </div>`;
}
render();
</script>
