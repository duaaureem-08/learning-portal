<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 9 · KS2 Level 3 · Interactive Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --gray:#5F5E5A;--gray-light:#F1EFE8;
  --text:#2C2C2A;--white:#FFFFFF;
  --radius:12px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh;font-size:15px}
h1,h2,h3,h4{font-family:'Nunito',sans-serif}
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1;min-width:100px}
.nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;transition:.13s;font-family:'Nunito',sans-serif;white-space:nowrap}
.tab.active{color:var(--white)!important}
.print-btn{background:var(--teal);color:var(--white);border:none;border-radius:20px;padding:7px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.subject-tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.stab{padding:9px 18px;border-radius:22px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:var(--white)}
.page{display:none;padding:14px 18px 50px}
.page.active{display:block}
.ws-header{background:linear-gradient(130deg,var(--amber-light),var(--teal-light));border:2px solid var(--amber-mid);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ws-badge{background:var(--amber);color:var(--white);font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:3px 10px;border-radius:20px;letter-spacing:.4px;display:inline-block;margin-bottom:4px}
.ws-title{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--teal);margin:2px 0}
.ws-sub{font-size:12px;color:var(--gray);font-weight:600}
.name-line{border:none;border-bottom:1.5px solid var(--amber);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:12px;padding:2px 4px;outline:none;width:130px}
.section{margin-bottom:18px}
.sec-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-num{background:var(--teal);color:var(--white);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.q-block{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65;color:var(--text)}
.ans-line{width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;color:var(--text);margin-top:6px;display:block}
.ans-box{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;color:var(--text);margin-top:6px;resize:none}
.inline-ans{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;color:var(--text);padding:2px 4px}
.tip-box{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-box{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.6}
.l1-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.vocab-card{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px;border-left:4px solid var(--teal)}
.vocab-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:var(--teal)}
.vocab-meaning{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.vocab-l1{font-size:12px;color:var(--blue);font-style:italic}
.vocab-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.word-bank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:14px}
.word-bank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.word-tag{display:inline-block;background:var(--purple);color:var(--white);border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
.circle-opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.opt{border:2px solid var(--amber);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;color:var(--amber);transition:.12s;background:var(--white)}
.opt.correct{background:#3B6D11!important;color:var(--white)!important;border-color:#3B6D11!important}
.opt.wrong{background:#B71C1C!important;color:var(--white)!important;border-color:#B71C1C!important}
.tbl-wrap{overflow-x:auto}
table.ws-table{width:100%;border-collapse:collapse;font-size:13px}
table.ws-table th{background:var(--teal);color:var(--white);padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.ws-table td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top}
table.ws-table tr:nth-child(even) td{background:var(--amber-light)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four-col{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.story-box{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.highlight-box{background:var(--orange-light);border:2px solid var(--orange);border-radius:var(--rsm);padding:12px 14px;font-size:14px;line-height:1.8;margin:8px 0}
.remember-box{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--white);text-align:center;margin-top:12px}
.step-box{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px;margin-bottom:8px}
.step-num{background:var(--teal);color:var(--white);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-text{font-size:13px;line-height:1.6}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0}
.info-card{border-radius:var(--rsm);padding:12px;text-align:center;border:2px solid}
.card-icon{font-size:30px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--amber-light);font-size:13px;line-height:1.5}
.check-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:2px solid var(--teal);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chk.done{background:var(--teal);color:var(--white)}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
@media(max-width:600px){.two-col,.three-col,.four-col{grid-template-columns:1fr}}
@media print{.nav,.subject-tabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>

eng:[
  {num:1,badge:'Descriptive Writing — Settings',title:'What is Descriptive Writing?',

function vc(word,meaning,l1,eg,color){
  color=color||'teal';
  return `<div class="vocab-card" style="border-left-color:var(--${color})">
  <div class="vocab-word" style="color:var(--${color})">${word}</div>
  <div class="vocab-meaning">${meaning}</div>
  <div class="vocab-l1">🌍 ${l1}</div>
  <div class="vocab-eg">✏️ e.g. ${eg}</div>
</div>`;
}

function C(key){switch(key){

/* ─── ENGLISH ─────────────────────────────────────────── */
case 'eng_dw_vocab': return `
<div class="l1-box"><strong>🌍 In your language:</strong> Setting = منظر (manzar) · Adjective = صفت · Adverb = متعلق فعل. Descriptive writing helps the reader SEE and FEEL a place using words!</div>
${vc('🏞️ Setting','The place and time where a story happens.','منظر / مشهد','"The ancient forest at midnight is the setting."','blue')}
${vc('🎨 Adjective','A word that describes a noun.','صفت / صفة','"The dark, shadowy cave dripped with water."','blue')}
${vc('⚡ Adverb','A word that describes HOW a verb happens. Often ends in -ly.','متعلق فعل / ظرف','"The rain fell softly on the empty street."','blue')}
${vc('👃 Senses','Sight, sound, smell, touch and taste — use them all!','حواس / حواس','"I used all five senses to describe the market."','blue')}
<div class="q-block"><div class="q-text">Complete: An adjective describes a <input class="inline-ans" style="width:80px" placeholder="?"/>, while an adverb describes a <input class="inline-ans" style="width:80px" placeholder="?"/>.</div></div>`;

case 'eng_dw_adj_adv': return `
<div class="tip-box"><strong>Adjectives describe NOUNS. Adverbs describe VERBS.</strong><br/>
Adjective: The <em>dark</em> cave. &nbsp;|&nbsp; Adverb: She walked <em>quietly</em>.</div>
${[
  ['The ___ forest was full of shadows.','gloomy','adjective'],
  ['The wind blew ___ through the trees.','eerily','adverb'],
  ['A ___ river twisted through the valley.','silvery','adjective'],
  ['The leaves rustled ___ in the breeze.','softly','adverb'],
  ['The ___ market smelled of spices.','bustling','adjective'],
  ['She tiptoed ___ across the old floorboards.','carefully','adverb'],
].map(([q,ans,type],i)=>`
<div class="q-block"><div class="q-num">Sentence ${i+1} — Add an ${type}:</div>
<div class="q-text">${q}</div>
<div class="circle-opts">
  <div class="opt" onclick="chk(this,'dw${i}','${ans}','${ans}')">${ans}</div>
  <div class="opt" onclick="chk(this,'dw${i}','wrong','${ans}')">boring</div>
  <div class="opt" onclick="chk(this,'dw${i}','wrong2','${ans}')">nothing</div>
</div></div>`).join('')}`;

case 'eng_dw_senses': return `
<div class="tip-box"><strong>Use your 5 senses to make writing come alive!</strong> Don't just describe what you SEE — also what you hear, smell, feel and even taste.</div>
<div class="card-grid">
${[['👀','Sight','What can you see? Colours, shapes, light, movement.'],
   ['👂','Sound','What can you hear? Loud, quiet, near, far.'],
   ['👃','Smell','What does it smell like? Fresh, musty, sweet, sharp.'],
   ['✋','Touch/Feel','Is it hot, cold, rough, smooth, wet, dry?'],
   ['👅','Taste','Can you taste anything in the air? Sweet, salty, bitter?'],
].map(([ico,t,d])=>`
<div class="info-card" style="background:var(--blue-light);border-color:var(--blue)">
  <div class="card-icon">${ico}</div>
  <div class="card-title" style="color:var(--blue)">${t}</div>
  <div class="card-desc">${d}</div>
</div>`).join('')}
</div>
<div class="q-block"><div class="q-num">Quick practice: Setting = a rainy beach</div>
  <div style="line-height:2.8;font-size:14px;margin-top:6px">
    👀 I can see: <input class="inline-ans" style="width:200px" placeholder="..."/><br/>
    👂 I can hear: <input class="inline-ans" style="width:200px" placeholder="..."/><br/>
    👃 I can smell: <input class="inline-ans" style="width:200px" placeholder="..."/>
  </div>
</div>`;

case 'eng_dw_words': return `

<div class="tbl-wrap"><table class="ws-table"><thead><tr><th>Boring word</th><th>Powerful words to try instead</th></tr></thead><tbody>

<tr><td>dark</td><td>shadowy, gloomy, pitch-black, murky, dim</td></tr>

case 'eng_dw_frames': return `

${['ancient','glistening','crumbling','vast','misty','golden','shadowy','towering'].map(w=>`<span class="word-tag">${w}</span>`).join('')}

</div>
<div class="tip-box"><strong>Sentence frames to get you started:</strong></div>
${[

<div class="q-block" style="margin-top:8px"><div class="q-text">Choose ONE frame and complete it:</div>
<input class="ans-line" placeholder="Write your sentence..."/></div>`;

case 'eng_dw_plan': return `
<div class="tip-box"><strong>Choose your setting</strong> and plan using your five senses before you write.</div>
<div class="q-block">
<div class="q-num">My setting is:</div>
<div class="circle-opts">
${['🏖️ A busy beach','🌲 A dark forest','🕌 An ancient city','🛒 A noisy market','⛰️ A mountain top'].map(s=>`<div class="opt" onclick="selectSetting(this,'${s}')">${s}</div>`).join('')}
</div></div>

let curSubj='eng';let curLesson=1;

function chk(el,group,val,ans){
  const opts=el.parentElement.querySelectorAll('.opt');opts.forEach(o=>o.classList.remove('correct','wrong'));
  if(val===ans){el.classList.add('correct');}
  else{el.classList.add('wrong');opts.forEach(o=>{if(o.textContent.trim()===ans)o.classList.add('correct');});}
}
function toggleChk(el){el.classList.toggle('done');el.textContent=el.classList.contains('done')?'✓':'';}
function selectSetting(el,s){document.querySelectorAll('#sensePlan').forEach(x=>x.style.display='block');el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct'));el.classList.add('correct');}

function render(){
  const subjectTabs=document.getElementById('subjectTabs');
  const navTabs=document.getElementById('navTabs');
  const pages=document.getElementById('pages');
  subjectTabs.innerHTML='';SUBJECTS.forEach(s=>{
    const el=document.createElement('div');
    el.className='stab'+(s.id===curSubj?' active':'');
    el.textContent=s.label;el.style.borderColor=s.col;el.style.color=s.id===curSubj?'#fff':s.col;
    if(s.id===curSubj)el.style.background=s.col;
    el.onclick=()=>{curSubj=s.id;curLesson=1;render();};
    subjectTabs.appendChild(el);
  });
  const subj=SUBJECTS.find(s=>s.id===curSubj);
  const lessons=WS[curSubj];
  navTabs.innerHTML='';lessons.forEach(l=>{
    const el=document.createElement('div');
    el.className='tab'+(l.num===curLesson?' active':'');
    el.textContent='Lesson '+l.num;el.style.borderColor=subj.col;
    el.style.color=l.num===curLesson?'#fff':subj.col;
    if(l.num===curLesson)el.style.background=subj.col;
    el.onclick=()=>{curLesson=l.num;render();};
    navTabs.appendChild(el);
  });
  const lesson=lessons.find(l=>l.num===curLesson);
  pages.innerHTML=`<div class="page active">
    <div class="ws-header">
      <div>
        <div class="ws-badge">${lesson.badge}</div>
        <div class="ws-title">${lesson.title}</div>
        <div class="ws-sub">Lesson ${lesson.num} of ${lessons.length} · ${subj.label} · Week 9</div>
      </div>
      <div>Name: <input class="name-line" placeholder="________________"/></div>
    </div>
    ${lesson.secs.map((sec,i)=>`
    <div class="section">
      <div class="sec-title"><span class="sec-num">${i+1}</span>${sec.t}</div>
      ${C(sec.c)}
    </div>`).join('')}
  </div>`;
}
render();
