<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 11 · Student Lesson Notes · KS2 Level 3</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --pink:#BE185D;--pink-light:#FCE7F3;
  --cyan:#0E7490;--cyan-light:#CFFAFE;
  --gray:#5F5E5A;--text:#2C2C2A;--white:#FFFFFF;
  --radius:14px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Nunito',sans-serif}
.nav{background:#fff;border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-logo{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1}
.stabs{display:flex;gap:7px;flex-wrap:wrap}
.stab{padding:7px 14px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:#fff}
.print-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 15px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.page{display:none;padding:16px 18px 50px}
.page.active{display:block}
.banner{border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;color:#fff}
.banner-label{font-size:10px;font-weight:800;letter-spacing:.8px;opacity:.85;margin-bottom:4px}
.banner-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;line-height:1.2}
.banner-sub{font-size:13px;opacity:.85;margin-top:4px}
.name-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;opacity:.9}
.name-input{border:none;border-bottom:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:160px;font-family:'Nunito Sans',sans-serif}
.sec-head{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin:18px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--amber-mid)}
.sec-num{background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.vocab-card{border-left:4px solid var(--teal);background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px}
.v-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
.v-mean{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.v-l1{font-size:12px;color:var(--blue);font-style:italic}
.v-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.tip{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-bridge{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.7}
.l1-bridge strong{font-family:'Nunito',sans-serif;font-weight:800}
.remember{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#fff;text-align:center;margin:14px 0}
.tbl-wrap{overflow-x:auto;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--teal);color:#fff;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.t td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.t tr:nth-child(even) td{background:var(--amber-light)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card{border-radius:var(--rsm);padding:12px;border:2px solid;text-align:center}
.card-ico{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.step{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:10px;margin-bottom:8px}
.step-n{background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-t{font-size:13px;line-height:1.6}
.dline{border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;width:100%;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;display:block;margin-bottom:6px}
.tarea{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;resize:none;margin-top:6px}
.inline{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;padding:2px 4px}
.q-box{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.wbank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:12px}
.wbank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.wtag{display:inline-block;background:var(--purple);color:#fff;border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
.story{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
@media(max-width:600px){.two,.three,.four{grid-template-columns:1fr}}
@media print{.nav,.stabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>

<div class="nav">
  <div class="nav-logo">📒 HOS · KS2 Level 3 · Week 11 · Student Notes</div>

<script>
const SUBJS=[
  {id:'cover', label:'🏠 Cover',       col:'#0F6E56'},
  {id:'eng',   label:'✏️ English',    col:'#BE185D'},
  {id:'maths', label:'🔢 Maths',      col:'#0F6E56'},

  {id:'hum',   label:'🌍 Humanities', col:'#0E7490'},
  {id:'bib',   label:'✝️ Bible',      col:'#B71C1C'},
];

const PAGES={

cover:`
<div style="background:linear-gradient(150deg,#0F6E56,#BE185D);min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center">
  <div style="font-size:52px;margin-bottom:10px">📒</div>
  <div style="font-family:Nunito,sans-serif;font-size:11px;font-weight:800;color:#FDE68A;letter-spacing:1.5px;margin-bottom:8px">HOS INTERNATIONAL · KS2 LEVEL 3</div>
  <div style="font-family:Nunito,sans-serif;font-size:30px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:8px">MY LESSON NOTES</div>
  <div style="font-family:Nunito,sans-serif;font-size:15px;color:#FDE68A;margin-bottom:24px">Week 11 · All 5 Subjects</div>
  <div style="background:rgba(255,255,255,.12);border-radius:12px;padding:18px 24px;margin-bottom:24px;width:100%;max-width:360px">
    <div style="font-size:12px;color:#FDE68A;margin-bottom:10px;font-weight:700">📝 My Details</div>
    <div style="text-align:left;font-size:13px;color:#fff;line-height:2.4">
      Name: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/><br/>
      Class: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/>

      ['🔢','Maths','Time — Telling the Time & Duration','#065F46','#D1FAE5'],
      ['🧲','Science','Forces — Magnets','#9A3412','#FFEDD5'],
      ['🌍','Humanities','Climate Zones & World Environments','#164E63','#CFFAFE'],

eng:`
<div class="banner" style="background:linear-gradient(135deg,#9D174D,#BE185D)">
  <div class="banner-label">SUBJECT 1 OF 5 · WEEK 11</div>
  <div class="banner-title">✏️ English — Adverbs &amp; Time Connectives</div>
  <div class="banner-sub">First · Next · Then · After that · Finally · Adverbs of manner</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Time connective = <strong>وقت کا ربط</strong> — Urdu · <strong>رابط زمني</strong> — Arabic<br/>
Sequence = <strong>ترتیب</strong> — Urdu · <strong>تسلسل</strong> — Arabic<br/>
Adverb of manner = <strong>طریقے کا ظرف</strong> — Urdu · <strong>ظرف الأسلوب</strong> — Arabic</div>

<div class="sec-head"><span class="sec-num">1</span>WORD BANK</div>
${[
  ['⏰ Time connective','A word or phrase showing WHEN something happens or the ORDER of events.','وقت کا ربط / رابط زمني','"First, wash your hands."','#BE185D'],
  ['📋 Sequence','The ORDER in which things happen — first to last.','ترتیب / تسلسل','"Follow the sequence of steps."','#BE185D'],
  ['🏃 Adverb of manner','Describes HOW an action is done. Usually ends in -ly.','طریقے کا ظرف / ظرف الأسلوب','"She carefully mixed the batter."','#BE185D'],
  ['🔗 Connective','Any word that joins ideas, sentences or clauses together.','ربط / رابط','"I went out because it was sunny."','#BE185D'],
].map(([w,m,l1,eg,col])=>`
<div class="vocab-card" style="border-left-color:${col}">
  <div class="v-word" style="color:${col}">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">2</span>THE 5 KEY TIME CONNECTIVES</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Time connective</th><th>When to use it</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>First / To begin with</strong></td><td>The very first step</td><td><em>First,</em> boil the water.</td></tr>
<tr><td><strong>Next / Then</strong></td><td>The following step</td><td><em>Next,</em> add the pasta.</td></tr>
<tr><td><strong>After that</strong></td><td>The step after that</td><td><em>After that,</em> stir well.</td></tr>
<tr><td><strong>Meanwhile</strong></td><td>Two things at the same time</td><td><em>Meanwhile,</em> heat the sauce.</td></tr>
<tr><td><strong>Finally / Lastly</strong></td><td>The very last step</td><td><em>Finally,</em> serve and enjoy.</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">3</span>ADVERBS OF MANNER</div>
<div class="tip"><strong>Adverbs of manner</strong> describe HOW an action is done. Most are made by adding <strong>-ly</strong> to an adjective.</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Adjective</th><th>Adverb of manner</th><th>Example</th></tr></thead><tbody>
<tr><td>careful</td><td><strong>carefully</strong></td><td>She carefully carried the glass.</td></tr>
<tr><td>quick</td><td><strong>quickly</strong></td><td>He quickly packed his bag.</td></tr>
<tr><td>quiet</td><td><strong>quietly</strong></td><td>They quietly entered the hall.</td></tr>
<tr><td>gentle</td><td><strong>gently</strong></td><td>She gently placed the egg down.</td></tr>
<tr><td>brave</td><td><strong>bravely</strong></td><td>He bravely stepped forward.</td></tr>
<tr><td>slow</td><td><strong>slowly</strong></td><td>The tortoise slowly moved on.</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">4</span>MODEL HOW-TO GUIDE</div>
<div style="background:#FCE7F3;border:2px solid #BE185D;border-radius:var(--rsm);padding:14px 18px;font-size:14px;line-height:2.4;font-family:'Nunito',sans-serif">
  <strong>How to make a sandwich:</strong><br/>
  <strong>First,</strong> <em>carefully</em> lay two slices of bread on the plate.<br/>
  <strong>Next,</strong> <em>generously</em> spread butter on each slice.<br/>
  <strong>Then,</strong> <em>neatly</em> place your filling on one slice.<br/>
  <strong>After that,</strong> <em>gently</em> press both slices together.<br/>
  <strong>Finally,</strong> <em>carefully</em> cut the sandwich in half and serve.
</div>

<div class="sec-head"><span class="sec-num">5</span>PRACTICE — FILL IN THE GAPS</div>
<div class="wbank"><strong>Word bank:</strong>
${['First','Next','Then','After that','Finally','carefully','gently','quickly','quietly','bravely'].map(w=>`<span class="wtag">${w}</span>`).join('')}
</div>
${[
  '___, turn on the oven and let it heat up.',
  '___, ___ mix the flour and butter together.',
  '___, pour in the milk and stir well.',
  '___, place the mixture in a baking tin.',
  '___, bake for 30 minutes and enjoy!',
].map((s,i)=>`<div class="q-box"><div class="q-label">Sentence ${i+1}</div><div class="q-text">${s}</div><input class="dline" placeholder="Write the full sentence with correct words…"/></div>`).join('')}

<div class="sec-head"><span class="sec-num">6</span>WRITE YOUR OWN HOW-TO GUIDE</div>
<div class="q-box">
  <div class="q-label">Title: How to ___</div>
  <input class="dline" placeholder="How to…"/>
  ${['First,','Next,','Then,','After that,','Finally,'].map((tc,i)=>`
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
    <strong style="font-family:'Nunito',sans-serif;font-size:13px;color:#BE185D;min-width:90px">${tc}</strong>
    <input class="dline" style="margin-top:0;flex:1" placeholder="…"/>
  </div>`).join('')}
</div>

<div class="remember" style="background:#BE185D">⭐ REMEMBER: First · Next · Then · After that · Finally = TIME CONNECTIVES. Add -ly adverbs (carefully, gently…) for HOW. Together they make excellent how-to guides! ✏️</div>`,

maths:`
<div class="banner" style="background:linear-gradient(135deg,#065F46,#0F6E56)">
  <div class="banner-label">SUBJECT 2 OF 5 · WEEK 11</div>
  <div class="banner-title">🔢 Maths — Time: Telling the Time &amp; Duration</div>
  <div class="banner-sub">Analogue &amp; digital clocks · AM &amp; PM · 24-hour clock · Duration</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Time = <strong>وقت (waqt)</strong> — Urdu · <strong>الوقت</strong> — Arabic<br/>
Hour = <strong>گھنٹہ (ghanta)</strong> — Urdu · <strong>ساعة</strong> — Arabic<br/>
Minute = <strong>منٹ</strong> — Urdu · <strong>دقيقة</strong> — Arabic<br/>
60 minutes = 1 hour &nbsp;·&nbsp; 24 hours = 1 day</div>

<div class="sec-head"><span class="sec-num">1</span>WORD BANK</div>
${[
  ['🕐 Analogue clock','Round face with hour hand (short) and minute hand (long).','اینالاگ گھڑی / ساعة تناظرية','"The short hand points to the hour."'],
  ['🔢 Digital clock','Shows time as numbers, e.g. 07:30.','ڈیجیٹل گھڑی / ساعة رقمية','"The display shows 14:45."'],
  ['🌅 AM','Midnight to midday (morning).','صبح / صباح','"School starts at 8:00 AM."'],
  ['🌇 PM','Midday to midnight (afternoon/evening).','شام / مساء','"Dinner is at 7:00 PM."'],
  ['⏱️ Duration','How long something takes.','مدت / مدة','"The film had a duration of 2 hours."'],
].map(([w,m,l1,eg])=>`
<div class="vocab-card">
  <div class="v-word" style="color:#0F6E56">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">2</span>READING AN ANALOGUE CLOCK</div>
<div class="tip"><strong>Short hand = hour · Long hand = minutes (each number = 5 minutes)</strong><br/>
12 = o'clock (0 min) · 3 = quarter past (15 min) · 6 = half past (30 min) · 9 = quarter to (45 min)</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Minute hand points to</th><th>Minutes</th><th>We say</th></tr></thead><tbody>
<tr><td>12</td><td>0 minutes</td><td>O'clock — e.g. "three o'clock"</td></tr>
<tr><td>3</td><td>15 minutes</td><td>Quarter past — e.g. "quarter past three"</td></tr>
<tr><td>6</td><td>30 minutes</td><td>Half past — e.g. "half past three"</td></tr>
<tr><td>9</td><td>45 minutes</td><td>Quarter to — e.g. "quarter to four"</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">3</span>THE 24-HOUR CLOCK</div>
<div class="tip"><strong>AM → 24-hour:</strong> same number, add leading zero (9:00 AM = 09:00)<br/>
<strong>PM → 24-hour:</strong> add 12 to the hour (3:00 PM → 3+12 = 15:00)<br/>
<strong>24-hour → PM:</strong> subtract 12 from any hour above 12 (17:00 → 17-12 = 5:00 PM)</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>12-hour</th><th>24-hour</th><th>Event</th></tr></thead><tbody>
<tr><td>12:00 AM (midnight)</td><td>00:00</td><td>Start of new day</td></tr>
<tr><td>6:00 AM</td><td>06:00</td><td>Morning</td></tr>
<tr><td>12:00 PM (midday)</td><td>12:00</td><td>Lunch</td></tr>
<tr><td>3:00 PM</td><td>15:00</td><td>Afternoon</td></tr>
<tr><td>9:00 PM</td><td>21:00</td><td>Night</td></tr>
<tr><td>11:59 PM</td><td>23:59</td><td>Just before midnight</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">4</span>CALCULATING DURATION</div>
<div class="tip"><strong>Duration = End time − Start time.</strong> Count the hours first, then the minutes.</div>
<div style="background:#fff;border:2px solid var(--amber-mid);border-radius:var(--rsm);padding:12px;margin-bottom:12px;font-family:'Courier New',monospace;font-size:14px;color:var(--teal)">
  Start: 9:00 AM → End: 11:30 AM<br/>
  Step 1: 9:00 → 11:00 = 2 hours<br/>
  Step 2: 11:00 → 11:30 = 30 minutes<br/>
  <strong>Duration = 2 hours 30 minutes ✅</strong>
</div>

<div class="sec-head"><span class="sec-num">5</span>PRACTICE — CONVERSIONS</div>
<div class="q-box"><div class="q-text" style="line-height:2.8">
  3:00 PM → 24-hour: <input class="inline" style="width:70px" placeholder="?"/><br/>
  8:30 AM → 24-hour: <input class="inline" style="width:70px" placeholder="?"/><br/>
  18:00 → 12-hour: <input class="inline" style="width:80px" placeholder="?"/><br/>
