<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 10 · Student Lesson Notes · KS2 Level 3</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --pink:#BE185D;--pink-light:#FCE7F3;
  --gray:#5F5E5A;--text:#2C2C2A;--white:#FFFFFF;
  --radius:14px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Nunito',sans-serif}
.nav{background:#fff;border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-logo{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1}
.stabs{display:flex;gap:7px;flex-wrap:wrap}
.stab{padding:7px 14px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:#fff}
.print-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 15px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.page{display:none;padding:16px 18px 50px}
.page.active{display:block}
.banner{border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;color:#fff}
.banner-label{font-size:10px;font-weight:800;letter-spacing:.8px;opacity:.85;margin-bottom:4px}
.banner-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;line-height:1.2}
.banner-sub{font-size:13px;opacity:.85;margin-top:4px}
.name-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;opacity:.9}
.name-input{border:none;border-bottom:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:160px;font-family:'Nunito Sans',sans-serif}
.sec-head{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin:18px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--amber-mid)}
.sec-num{background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.vocab-card{border-left:4px solid var(--teal);background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px}
.v-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
.v-mean{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.v-l1{font-size:12px;color:var(--blue);font-style:italic}
.v-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.tip{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-bridge{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.7}
.l1-bridge strong{font-family:'Nunito',sans-serif;font-weight:800}
.remember{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#fff;text-align:center;margin:14px 0}
.tbl-wrap{overflow-x:auto;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--teal);color:#fff;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.t td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.t tr:nth-child(even) td{background:var(--amber-light)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card{border-radius:var(--rsm);padding:12px;border:2px solid;text-align:center}
.card-ico{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.step{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:10px;margin-bottom:8px}
.step-n{background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-t{font-size:13px;line-height:1.6}
.dline{border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;width:100%;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;display:block;margin-bottom:6px}
.tarea{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;resize:none;margin-top:6px}
.inline{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;padding:2px 4px}
.q-box{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65}
.poem-box{background:#FFF0F6;border:2px solid var(--pink);border-radius:var(--radius);padding:18px;font-family:'Nunito',sans-serif;font-size:15px;line-height:2.2;margin:10px 0;text-align:center}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.wbank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:12px}
.wbank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.wtag{display:inline-block;background:var(--purple);color:#fff;border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
@media(max-width:600px){.two,.three,.four{grid-template-columns:1fr}}
@media print{.nav,.stabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>

const PAGES={

cover:`
<div style="background:linear-gradient(150deg,#0F6E56,#BE185D);min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center">

      Class: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/>

eng:`
<div class="banner" style="background:linear-gradient(135deg,#9D174D,#BE185D)">
  <div class="banner-label">SUBJECT 1 OF 5 · WEEK 10</div>
  <div class="banner-title">📖 English — Poetry: Rhyme, Rhythm &amp; Pattern</div>
  <div class="banner-sub">Reading and writing rhyming poems · repetition · rhythm · KS2 Level 3</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Poetry = <strong>شاعری (shaa'iri)</strong> — Urdu · <strong>شعر</strong> — Arabic<br/>
Rhyme = <strong>قافیہ (qafia)</strong> — Urdu · <strong>قافية</strong> — Arabic<br/>
Rhythm = <strong>لے (lai)</strong> — Urdu · <strong>إيقاع</strong> — Arabic · The BEAT you feel when you read a poem!</div>

<div class="sec-head"><span class="sec-num">1</span>WORD BANK</div>
${[
  ['📜 Poem','A piece of writing arranged in lines, often with rhyme and rhythm.','نظم / قصيدة','"I wrote a poem about the sea."','#BE185D'],
  ['🎵 Rhyme','When two words end with the same sound. Example: cat/hat, moon/tune.','قافیہ / قافية','"Cat rhymes with hat — they both end in -at."','#BE185D'],
  ['🥁 Rhythm','The beat or pattern of sounds when you read a poem aloud.','لے / إيقاع','"Tap your hand to feel the rhythm of this poem."','#BE185D'],
  ['🔁 Repetition','When a word, phrase or line is repeated on purpose for effect.','تکرار / تكرار','"Rain, rain, go away — repetition!"','#BE185D'],
  ['📐 Pattern','The way rhymes, rhythm or lines are arranged in a poem.','نمونہ / نمط','"The poem has a rhyme pattern: ABAB."','#BE185D'],
].map(([w,m,l1,eg,col])=>`
<div class="vocab-card" style="border-left-color:${col}">
  <div class="v-word" style="color:${col}">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">2</span>RHYME SCHEMES</div>
<div class="tip"><strong>Rhyme scheme = the PATTERN of rhymes at the ends of lines.</strong> We label each new rhyme sound with a letter (A, B, C…)</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Scheme</th><th>Pattern</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>AABB</strong></td><td>Lines 1&amp;2 rhyme, lines 3&amp;4 rhyme</td><td>I saw a <strong>cat</strong> / Upon the <strong>mat</strong> / She wore a <strong>hat</strong> / And that was <strong>that</strong></td></tr>
<tr><td><strong>ABAB</strong></td><td>Lines 1&amp;3 rhyme, lines 2&amp;4 rhyme</td><td>The sun is <strong>bright</strong> (A) / It fills the <strong>day</strong> (B) / With golden <strong>light</strong> (A) / In every <strong>way</strong> (B)</td></tr>
<tr><td><strong>ABCB</strong></td><td>Only lines 2&amp;4 rhyme</td><td>The wind blows <strong>cold</strong> (A) / The trees all <strong>sway</strong> (B) / The leaves turn <strong>gold</strong> / And drift <strong>away</strong> (B)</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">3</span>EXAMPLE POEM — THE WIND</div>
<div class="poem-box" style="text-align:left;line-height:2.5;font-size:14px">
  The wind is wild, the wind is free, <span style="font-size:11px;color:#BE185D;font-weight:700">(A)</span><br/>
  It shakes the branches of the tree, <span style="font-size:11px;color:#BE185D;font-weight:700">(A)</span><br/>
  It whistles through the chimney tall, <span style="font-size:11px;color:#9D174D;font-weight:700">(B)</span><br/>
  And rattles every door and hall. <span style="font-size:11px;color:#9D174D;font-weight:700">(B)</span><br/><br/>
  Oh, <em>blow, blow, blow!</em> <span style="font-size:11px;color:#BE185D;font-weight:700">(repetition)</span><br/>
  Where the cold winds go, <span style="font-size:11px;color:#BE185D;font-weight:700">(A)</span><br/>
  Across the hill and down below — <span style="font-size:11px;color:#BE185D;font-weight:700">(A)</span><br/>
  <em>Blow, blow, blow!</em> <span style="font-size:11px;color:#BE185D;font-weight:700">(repetition)</span>
</div>

<div class="sec-head"><span class="sec-num">4</span>RHYTHM — THE BEAT</div>
<div class="tip"><strong>Clap or tap as you read aloud.</strong> Stressed (loud) syllables are the BEAT. Every poem has its own rhythm — some fast, some slow, some steady.</div>
<div style="background:#FFF0F6;border:2px solid var(--pink);border-radius:var(--rsm);padding:12px;margin-bottom:10px;font-size:14px;font-family:'Nunito',sans-serif;font-weight:700;line-height:2.4;color:#9D174D">
  <strong>TWIN</strong>-kle, <strong>TWIN</strong>-kle, <strong>LIT</strong>-tle <strong>STAR</strong>, (clap on the CAPITALS!)<br/>
  <strong>HOW</strong> I <strong>WON</strong>-der <strong>WHAT</strong> you <strong>ARE</strong>!
</div>

<div class="sec-head"><span class="sec-num">5</span>RHYMING WORD PAIRS</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Word 1</th><th>Rhymes with</th><th>Word 1</th><th>Rhymes with</th></tr></thead><tbody>
<tr><td>moon</td><td>spoon / tune / soon</td><td>rain</td><td>train / plain / pain</td></tr>
<tr><td>bright</td><td>night / right / light</td><td>tree</td><td>sea / free / me</td></tr>
<tr><td>song</td><td>long / strong / along</td><td>star</td><td>far / car / jar</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">6</span>HOW TO WRITE A POEM — STEP BY STEP</div>
${[
  ['Choose your topic','What is your poem about? Rain? Stars? The sea? Something you love?'],
  ['Choose a rhyme scheme','Will you use AABB, ABAB or ABCB?'],
  ['Collect rhyming pairs','Find 2–3 pairs of words that rhyme with things in your topic.'],
  ['Add repetition','Choose a word or phrase to repeat — it creates mood and music.'],

].map(([t,d],i)=>`
<div class="step"><div class="step-n">${i+1}</div><div class="step-t"><strong>${t}</strong> — ${d}</div></div>`).join('')}

<div class="sec-head"><span class="sec-num">7</span>WRITE YOUR POEM</div>
<div class="q-box">
  <div class="q-label">My poem title:</div><input class="dline" placeholder="..."/>
  <div class="q-label" style="margin-top:8px">Stanza 1:</div>
  ${[1,2,3,4].map(i=>`<input class="dline" placeholder="Line ${i}..."/>`).join('')}
  <div class="q-label" style="margin-top:8px">Stanza 2:</div>
  ${[5,6,7,8].map(i=>`<input class="dline" placeholder="Line ${i}..."/>`).join('')}
</div>

<div class="remember" style="background:#BE185D">⭐ REMEMBER: Rhyme = same ending sounds · Rhythm = the beat · Repetition = repeating for effect. Great poems use ALL THREE! 🎵</div>`,

maths:`
<div class="banner" style="background:linear-gradient(135deg,#065F46,#0F6E56)">
  <div class="banner-label">SUBJECT 2 OF 5 · WEEK 10</div>
  <div class="banner-title">🔢 Maths — Measurement: Mass &amp; Volume</div>

  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Mass/Weight = <strong>وزن (wazan)</strong> — Urdu &amp; Arabic<br/>
Volume = <strong>گنجائش (gunjaaish)</strong> — Urdu · <strong>حجم</strong> — Arabic<br/>
1 kg = 1000 g &nbsp;&nbsp;·&nbsp;&nbsp; 1 litre = 1000 ml</div>

<div class="sec-head"><span class="sec-num">1</span>WORD BANK</div>
${[
  ['⚖️ Mass','How heavy an object is — measured in grams (g) or kilograms (kg).','وزن / كتلة','"The bag of rice has a mass of 5 kg."'],
  ['🧊 Gram (g)','A small unit of mass. 1000 grams = 1 kilogram.','گرام / غرام','"A paperclip weighs about 1 gram."'],
  ['💪 Kilogram (kg)','A bigger unit of mass. 1 kg = 1000 g.','کلو گرام / كيلوغرام','"A bag of flour is about 1 kilogram."'],
  ['💧 Volume','How much liquid a container holds — measured in ml or litres.','گنجائش / حجم','"This bottle holds 500 ml of water."'],
  ['🥛 Millilitre (ml)','A small unit of volume. 1000 ml = 1 litre.','ملی لیٹر / ملليلتر','"A teaspoon holds about 5 ml."'],
  ['🫙 Litre (l)','A bigger unit of volume. 1 litre = 1000 ml.','لیٹر / لتر','"A large bottle of water is 1 litre."'],
].map(([w,m,l1,eg])=>`
<div class="vocab-card">
  <div class="v-word" style="color:#0F6E56">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">2</span>THE KEY RULES</div>
<div class="tip"><strong>1 kg = 1000 g &nbsp;·&nbsp; 1 litre = 1000 ml</strong><br/>
× 1000 to go from big unit → small unit &nbsp;·&nbsp; ÷ 1000 to go from small unit → big unit</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Conversion</th><th>Rule</th><th>Example</th></tr></thead><tbody>
<tr><td>kg → g</td><td>× 1000</td><td>3 kg × 1000 = <strong>3000 g</strong></td></tr>
<tr><td>g → kg</td><td>÷ 1000</td><td>2500 g ÷ 1000 = <strong>2.5 kg</strong></td></tr>
<tr><td>l → ml</td><td>× 1000</td><td>2 l × 1000 = <strong>2000 ml</strong></td></tr>
<tr><td>ml → l</td><td>÷ 1000</td><td>750 ml ÷ 1000 = <strong>0.75 l</strong></td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">3</span>WHEN TO USE WHICH UNIT</div>
<div class="two" style="margin-bottom:14px">
<div class="card" style="background:#D1FAE5;border-color:#0F6E56;text-align:left">
  <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:13px;color:#065F46;margin-bottom:8px">⚖️ MASS — use g or kg</div>
  <div style="font-size:13px;line-height:2">
    <strong>Grams (g):</strong> coins, strawberries, letters<br/>
    <strong>Kilograms (kg):</strong> people, bags of rice, school bags
  </div>
</div>
<div class="card" style="background:#E1F5EE;border-color:#0F6E56;text-align:left">

<div class="sec-head"><span class="sec-num">6</span>MEMORY VERSE — LEARN IT!</div>
<div class="verse-box">
  <div class="verse-text">"The Lord is with you, mighty warrior."</div>
  <div style="font-size:11px;color:var(--gray);margin-top:6px">— Judges 6:12</div>
</div>
<div class="tip"><strong>How to learn:</strong> Read it 3 times → cover 1 word → say it → cover more → say it again until you can say the whole verse without looking!</div>
<div class="q-box">
  <div class="q-label">Write the verse from memory — no peeking! 😊</div>
  <textarea class="tarea" style="min-height:50px" placeholder="The Lord is with you..."></textarea>
</div>

<div class="sec-head"><span class="sec-num">7</span>MY LIFE APPLICATION</div>
${[
  ['❤️','A time I felt "too small" to do something:'],
  ['🧡','One brave step I can take this week:'],
  ['💛','What "God is with you" means to ME:'],
].map(([col,label])=>`
<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">
  <div style="width:5px;height:30px;background:${col};border-radius:4px;margin-top:2px"></div>
  <div style="flex:1"><div style="font-size:12px;font-weight:700;font-family:Nunito,sans-serif;color:${col}">${label}</div>
  <input class="dline" style="border-bottom-color:${col}"/></div>
</div>`).join('')}

<div class="remember" style="background:#B71C1C">⭐ REMEMBER: God chose Gideon because of God's strength, not Gideon's. "The Lord is with you, mighty warrior." — Judges 6:12. God uses unlikely people! 🦁</div>`,

};

let cur='cover';
function render(){
  const stabs=document.getElementById('stabs');
  const pages=document.getElementById('pages');
  stabs.innerHTML='';pages.innerHTML='';
  SUBJS.forEach(s=>{
    const el=document.createElement('div');
    el.className='stab'+(s.id===cur?' active':'');
    el.textContent=s.label;el.style.borderColor=s.col;
    el.style.color=s.id===cur?'#fff':s.col;
    if(s.id===cur)el.style.background=s.col;
    el.onclick=()=>{cur=s.id;render();};
    stabs.appendChild(el);
  });
  const pg=document.createElement('div');
  pg.className='page active';
  pg.innerHTML=PAGES[cur]||'<p style="padding:30px;color:var(--gray)">Loading...</p>';
  pages.appendChild(pg);
}
render();
</script>

<script src="worksheet-submit.js"></script>
<script>WorksheetSubmit.init('KS2_L3_Week10_Notes');</script>
</body>
</html>
