<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 6 · Student Lesson Notes · KS2 Level 3</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --gray:#5F5E5A;--mgray:#CFD8DC;
  --text:#2C2C2A;--white:#FFFFFF;
  --radius:14px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Nunito',sans-serif}
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-logo{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1}
.stabs{display:flex;gap:7px;flex-wrap:wrap}
.stab{padding:7px 14px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:#fff}
.print-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 15px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.page{display:none;padding:16px 18px 50px}
.page.active{display:block}
.banner{border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;color:#fff}
.banner-label{font-size:10px;font-weight:800;letter-spacing:.8px;opacity:.85;margin-bottom:4px}
.banner-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;line-height:1.2}
.banner-sub{font-size:13px;opacity:.85;margin-top:4px}
.name-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;opacity:.9}
.name-input{border:none;border-bottom:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:160px;font-family:'Nunito Sans',sans-serif}
.sec-head{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin:18px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--amber-mid)}
.sec-num{background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.vocab-card{border-left:4px solid var(--teal);background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px}
.v-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
.v-mean{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.v-l1{font-size:12px;color:var(--blue);font-style:italic}
.v-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.tip{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-bridge{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.7}
.l1-bridge strong{font-family:'Nunito',sans-serif;font-weight:800}
.remember{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#fff;text-align:center;margin:14px 0}
.tbl-wrap{overflow-x:auto;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--teal);color:#fff;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.t td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.t tr:nth-child(even) td{background:var(--amber-light)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card{border-radius:var(--rsm);padding:12px;border:2px solid;text-align:center}
.card-ico{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.dline{border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;width:100%;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;display:block;margin-bottom:6px}
.tarea{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;resize:none;margin-top:6px}
.inline{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;padding:2px 4px}
.q-box{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65}
.dt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}
.dt-cell{background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:6px;padding:6px 3px;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;color:var(--teal)}
.dt-cell input{width:100%;border:none;background:transparent;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;color:var(--teal);outline:none}
.story{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.rule-card{border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px;border:2px solid}
.wbank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:14px}
.wtag{display:inline-block;background:var(--purple);color:#fff;border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
.rbow-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.rbow-bar{width:4px;border-radius:4px;min-height:40px;flex-shrink:0}
@media(max-width:600px){.two,.three,.four{grid-template-columns:1fr}.dt{grid-template-columns:repeat(3,1fr)}}
@media print{.nav,.stabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">📒 HOS · KS2 Level 3 · Week 6 · My Lesson Notes</div>
  <div class="stabs" id="stabs"></div>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
</div>
<div id="pages"></div>

<script>
const SUBJS = [
  {id:'cover', label:'🏠 Cover',   col:'#0F6E56'},
  {id:'eng',   label:'📖 English', col:'#185FA5'},
  {id:'maths', label:'🔢 Maths',   col:'#0F6E56'},
  {id:'sci',   label:'🥗 Science', col:'#C2410C'},
  {id:'hum',   label:'🌍 Humanities',col:'#534AB7'},
  {id:'bib',   label:'✝️ Bible',   col:'#B71C1C'},
];

const PAGES = {

/* ══════════════════════════════════════════════════════════
   COVER PAGE
══════════════════════════════════════════════════════════ */
cover:`
<div style="background:linear-gradient(150deg,#0F6E56,#185FA5);min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center">
  <div style="font-size:52px;margin-bottom:10px">📒</div>
  <div style="font-family:Nunito,sans-serif;font-size:11px;font-weight:800;color:#FDE68A;letter-spacing:1.5px;margin-bottom:8px">HOS INTERNATIONAL · KS2 LEVEL 3</div>
  <div style="font-family:Nunito,sans-serif;font-size:30px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:8px">MY LESSON NOTES</div>
  <div style="font-family:Nunito,sans-serif;font-size:15px;color:#FDE68A;margin-bottom:24px">Week 6 · All 5 Subjects</div>
  <div style="background:rgba(255,255,255,.12);border-radius:12px;padding:18px 24px;margin-bottom:24px;width:100%;max-width:360px">
    <div style="font-size:12px;color:#FDE68A;margin-bottom:10px;font-weight:700">📝 My Details</div>
    <div style="text-align:left;font-size:13px;color:#fff;line-height:2.4">
      Name: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/><br/>
      Class: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px">
    ${[
      ['📖','English','Spelling Rules — Year 3/4 Word List','#1E40AF','#DBEAFE'],
      ['🔢','Maths','Division — Sharing and Grouping','#065F46','#D1FAE5'],
      ['🥗','Science','Nutrition — What We Eat and Why','#9A3412','#FFEDD5'],
      ['🌍','Humanities','Ancient Egypt — Achievements','#3730A3','#E0E7FF'],
      ['✝️','Bible','Joseph — Forgiving Those Who Hurt You','#991B1B','#FEE2E2'],
    ].map(([ico,sub,topic,col,bg])=>`
    <div style="background:${bg};border:1.5px solid ${col};border-radius:10px;padding:10px;text-align:left">
      <div style="font-size:18px">${ico}</div>
      <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:12px;color:${col}">${sub}</div>
      <div style="font-size:11px;color:#5F5E5A;margin-top:2px">${topic}</div>
    </div>`).join('')}
  </div>
  <div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,.6)">Use this booklet to read, learn and practise. Every page has words in English, Arabic and Urdu! 🌍</div>
</div>`,

/* ══════════════════════════════════════════════════════════
   ENGLISH — Spelling Rules
══════════════════════════════════════════════════════════ */
eng:`
<div class="banner" style="background:linear-gradient(135deg,#185FA5,#1E40AF)">
  <div class="banner-label">SUBJECT 1 OF 5 · WEEK 6</div>
  <div class="banner-title">📖 English — Spelling Rules</div>
  <div class="banner-sub">Year 3/4 Word List · Suffixes &amp; Exception Words · KS2 Level 3</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Suffix = <strong>لاحقہ (lāhiqa)</strong> — Urdu · <strong>لاحقة</strong> — Arabic<br/>
A suffix is a group of letters added to the END of a word to change its meaning!</div>

<div class="sec-head"><span class="sec-num">1</span>WORD BANK — KEY WORDS</div>
${[
  ['✏️ Suffix','Letters added to the END of a word. E.g. -ing, -ed, -er, -est.','لاحقہ / لاحقة','\"run + ning = running\"'],
  ['📏 Root word','The main word BEFORE you add anything to it.','اصل لفظ / جذر الكلمة','\"The root word of running is run.\"'],
  ['⚡ Exception word','A word that does NOT follow the normal rules — must be learned!','استثنا / استثناء','\"The word \'caught\' is an exception word.\"'],
  ['🔄 Double','Write the last letter TWICE before adding the suffix.','دوہرانا / مضاعفة','\"hop → hopp-ing (double the p!)\"'],
].map(([w,m,l1,eg])=>`
<div class="vocab-card" style="border-left-color:#185FA5">
  <div class="v-word" style="color:#185FA5">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">2</span>THE 4 SPELLING RULES FOR ADDING SUFFIXES</div>

<div class="rule-card" style="border-color:#185FA5;background:#E6F1FB">
  <div style="font-family:Nunito,sans-serif;font-weight:800;color:#185FA5;margin-bottom:6px">📘 RULE 1 — Just ADD the suffix</div>
  <div style="font-size:13px;line-height:1.8">When does it apply? → The word ends in TWO consonants OR has a long vowel sound.<br/>
  ✅ <strong>fast</strong> → fast<u>er</u>, fast<u>est</u> &nbsp;·&nbsp; <strong>play</strong> → play<u>ing</u>, play<u>ed</u> &nbsp;·&nbsp; <strong>kind</strong> → kind<u>er</u>, kind<u>est</u></div>
</div>

<div class="rule-card" style="border-color:#C2410C;background:#FFF0E6">
  <div style="font-family:Nunito,sans-serif;font-weight:800;color:#C2410C;margin-bottom:6px">🔴 RULE 2 — DOUBLE the last consonant</div>
  <div style="font-size:13px;line-height:1.8">When does it apply? → Short vowel sound + ONE consonant at the end.<br/>
  ✅ <strong>hop</strong> → hopp<u>ing</u> &nbsp;·&nbsp; <strong>big</strong> → bigg<u>er</u> &nbsp;·&nbsp; <strong>run</strong> → runn<u>ing</u> &nbsp;·&nbsp; <strong>hot</strong> → hott<u>er</u></div>
</div>

<div class="rule-card" style="border-color:#0F6E56;background:#E1F5EE">
  <div style="font-family:Nunito,sans-serif;font-weight:800;color:#0F6E56;margin-bottom:6px">🟢 RULE 3 — DROP the silent 'e'</div>
  <div style="font-size:13px;line-height:1.8">When does it apply? → The word ends in a silent 'e'.<br/>
  ✅ <strong>bake</strong> → bak<u>ing</u> &nbsp;·&nbsp; <strong>hope</strong> → hop<u>ed</u> &nbsp;·&nbsp; <strong>nice</strong> → nic<u>er</u> &nbsp;·&nbsp; <strong>smile</strong> → smil<u>ing</u></div>
</div>

<div class="rule-card" style="border-color:#534AB7;background:#EEEDFE">
  <div style="font-family:Nunito,sans-serif;font-weight:800;color:#534AB7;margin-bottom:6px">💜 RULE 4 — Change 'y' to 'i'</div>
  <div style="font-size:13px;line-height:1.8">When does it apply? → The word ends in a consonant + 'y'.<br/>
  ✅ <strong>happy</strong> → happ<u>ier</u>, happ<u>iest</u> &nbsp;·&nbsp; <strong>carry</strong> → carr<u>ied</u> &nbsp;·&nbsp; <strong>funny</strong> → funn<u>ier</u></div>
</div>

<div class="sec-head"><span class="sec-num">3</span>SUFFIX PRACTICE TABLE</div>
<div class="tbl-wrap"><table class="t">
<thead><tr><th>Root word</th><th>Rule</th><th>+ -ing</th><th>+ -ed</th><th>+ -er / -est</th></tr></thead>
<tbody>
<tr><td><strong>play</strong></td><td>Rule 1</td><td>playing</td><td>played</td><td>—</td></tr>
<tr><td><strong>hop</strong></td><td>Rule 2</td><td>hopping</td><td>hopped</td><td>—</td></tr>
<tr><td><strong>bake</strong></td><td>Rule 3</td><td>baking</td><td>baked</td><td>baker</td></tr>
<tr><td><strong>happy</strong></td><td>Rule 4</td><td>—</td><td>—</td><td>happier / happiest</td></tr>
<tr><td><strong>run</strong></td><td>Rule 2</td><td>running</td><td>—</td><td>—</td></tr>
<tr><td><strong>nice</strong></td><td>Rule 3</td><td>—</td><td>—</td><td>nicer / nicest</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">4</span>EXCEPTION WORDS — GROUP 1</div>
<div class="tip"><strong>These words do NOT follow normal rules. Learn them by heart!</strong><br/>Read → look carefully → cover → write → check.</div>
<div class="tbl-wrap"><table class="t">
<thead><tr><th>Word</th><th>Simple meaning</th><th>Write it here!</th></tr></thead>
<tbody>
${[
  ['accident','something that happens by mistake'],
  ['address','where you live or work'],
  ['answer','what you say after a question'],
  ['believe','to think something is true'],
  ['bicycle','a vehicle with two wheels you pedal'],
  ['breathe','to take air in and out of the body'],
].map(([w,m])=>`<tr><td><strong>${w}</strong></td><td>${m}</td><td><input style="width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:13px;outline:none;padding:2px" placeholder="write here"/></td></tr>`).join('')}
</tbody></table></div>

<div class="sec-head"><span class="sec-num">5</span>EXCEPTION WORDS — GROUP 2</div>
<div class="tbl-wrap"><table class="t">
<thead><tr><th>Word</th><th>Simple meaning</th><th>Write it here!</th></tr></thead>
<tbody>
${[
  ['build','to make something using materials'],
  ['busy','when you have a lot to do'],
  ['caught','past tense of catch'],
  ['certain','when you are sure about something'],
  ['complete','to finish something fully'],
  ['different','not the same'],
].map(([w,m])=>`<tr><td><strong>${w}</strong></td><td>${m}</td><td><input style="width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:13px;outline:none;padding:2px" placeholder="write here"/></td></tr>`).join('')}
</tbody></table></div>

<div class="sec-head"><span class="sec-num">6</span>FILL IN THE BLANKS — EXCEPTION WORDS</div>
${[
  ['I _______ the ball before it hit the ground.','caught'],
  ['She rode her _______ to school every morning.','bicycle'],
  ['He did not _______ me when I told him the news.','believe'],
  ['The teacher said, "Are you _______ that is correct?"','certain'],
  ['The two sisters look very _______ from each other.','different'],
].map(([q,ans],i)=>`
<div class="q-box">
  <div class="q-label">Sentence ${i+1} — write the missing word</div>
  <div class="q-text">${q}</div>
  <input class="dline" style="margin-top:8px" placeholder="Missing word: _______________"/>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">7</span>MY SPELLING CHECKLIST</div>
<div class="q-box">
${[
  'I know Rule 1: long vowel or 2 consonants — just add the suffix.',
  'I know Rule 2: short vowel + 1 consonant — double the consonant.',
  'I know Rule 3: silent \'e\' — drop the \'e\', then add the suffix.',
  'I know Rule 4: consonant + \'y\' — change \'y\' to \'i\', then add.',
  'I can spell all 12 exception words from Groups 1 and 2.',
].map(item=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px"><span style="width:18px;height:18px;border:2px solid var(--blue);border-radius:4px;flex-shrink:0;display:inline-block"></span>${item}</div>`).join('')}
</div>

<div class="remember" style="background:#185FA5">⭐ REMEMBER: 4 rules for adding suffixes. Exception words — learn them by heart! A great speller practises every day. 📝</div>`,

/* ══════════════════════════════════════════════════════════
   MATHS — Division
══════════════════════════════════════════════════════════ */
maths:`
<div class="banner" style="background:linear-gradient(135deg,#0F6E56,#065F46)">
  <div class="banner-label">SUBJECT 2 OF 5 · WEEK 6</div>
  <div class="banner-title">🔢 Maths — Division</div>
  <div class="banner-sub">Sharing and Grouping · ÷2 ÷3 ÷4 ÷5 ÷8 ÷10 · KS2 Level 3</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Division = <strong>تقسیم (taqseem)</strong> — Urdu &amp; Arabic<br/>
Division means splitting a total into EQUAL parts. If you share equally, everyone gets the SAME amount!</div>

<div class="sec-head"><span class="sec-num">1</span>WORD BANK</div>
${[
  ['➗ Division','Splitting a number into equal groups or equal shares.','تقسیم / قسمة','\"12 ÷ 3 = 4. We divided 12 into 3 equal groups.\"'],
  ['📦 Dividend','The BIG number we are dividing up.','مقسوم / المقسوم','\"In 12 ÷ 3 = 4, the dividend is 12.\"'],
  ['🔢 Divisor','The number we divide BY.','مقسوم علیہ / المقسوم عليه','\"In 12 ÷ 3 = 4, the divisor is 3.\"'],
  ['✅ Quotient','The ANSWER to a division.','حاصل تقسیم / الخارج','\"In 12 ÷ 3 = 4, the quotient is 4.\"'],
  ['🔄 Inverse','The opposite operation — multiplication is the inverse of division.','الٹا عمل / العكس','\"12 ÷ 3 = 4 is the inverse of 4 × 3 = 12.\"'],
].map(([w,m,l1,eg])=>`
<div class="vocab-card" style="border-left-color:#0F6E56">
  <div class="v-word" style="color:#0F6E56">${w}</div>
  <div class="v-mean">${m}</div>

  <div class="v-eg">✏️ ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">2</span>THE STORY OF JOSEPH</div>
<div class="story">
<strong>First,</strong> Jacob had twelve sons. His favourite was Joseph. Jacob gave Joseph a beautiful coat of many colours. His brothers became very <em>jealous</em>.<br/><br/>
<strong>Then,</strong> Joseph's brothers did something very wrong. They sold Joseph to merchants travelling to Egypt. They told their father he was dead. Jacob was heartbroken.<br/><br/>
<strong>In Egypt,</strong> Joseph worked hard but was put in prison for something he did not do. It was very unfair. But God was with Joseph even in prison.<br/><br/>
<strong>After a while,</strong> Pharaoh had two strange dreams nobody could explain. Joseph told Pharaoh the dreams meant 7 years of plenty and then 7 years of famine with no food. Pharaoh was so impressed he made Joseph the second most powerful person in all Egypt!<br/><br/>
<strong>Finally,</strong> when the famine came, Joseph's brothers came to Egypt to buy food — not knowing Joseph was there. Joseph recognised them. Instead of punishing them, he wept and said: <em>"You intended to harm me, but God intended it for good."</em> He forgave them and the whole family was saved!
</div>

<div class="sec-head"><span class="sec-num">4</span>THE MEMORY VERSE — LEARN IT!</div>

  <div style="font-size:11px;color:var(--gray);margin-top:6px">— Genesis 50:20</div>
</div>
<div class="tip"><strong>How to learn it:</strong> Read it 3 times → cover 1 word → say it → cover 2 words → say it → keep going until you can say it all from memory!</div>

/* ── Render engine ──────────────────────────────────────── */
let cur='cover';
function render(){
  const stabs=document.getElementById('stabs');
  const pages=document.getElementById('pages');
  stabs.innerHTML=''; pages.innerHTML='';
  SUBJS.forEach(s=>{
    const el=document.createElement('div');
    el.className='stab'+(s.id===cur?' active':'');
    el.textContent=s.label;
    el.style.borderColor=s.col;
    el.style.color=s.id===cur?'#fff':s.col;
    if(s.id===cur) el.style.background=s.col;
    el.onclick=()=>{cur=s.id;render()};
    stabs.appendChild(el);
  });
  const pg=document.createElement('div');
  pg.className='page active';
  pg.innerHTML=PAGES[cur]||'<p style="padding:30px;color:var(--gray)">Loading...</p>';
  pages.appendChild(pg);
}
render();
</script>
