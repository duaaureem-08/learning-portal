<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --coral:#D85A30;--coral-light:#FAECE7;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --red:#B71C1C;--red-light:#FFEBEE;
  --gray:#5F5E5A;--gray-light:#F1EFE8;
  --text:#2C2C2A;--text-muted:#888780;
  --white:#FFFFFF;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Nunito',sans-serif}

.nav{background:var(--white);border-bottom:2px solid var(--amber-mid);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.nav-title{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);flex:1;min-width:120px}
.nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:20px;border:1.5px solid transparent;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:'Nunito',sans-serif;white-space:nowrap}
.tab:hover{opacity:.85}
.tab.active{color:var(--white)!important}

.subject-tabs{display:flex;gap:8px;padding:16px 20px 0;flex-wrap:wrap}
.stab{padding:8px 16px;border-radius:20px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.15s}
.stab:hover{opacity:.8}
.stab.active{color:var(--white)}

.page{display:none;padding:16px 20px 40px}
.page.active{display:block}

.ws-header{background:linear-gradient(135deg,var(--amber-light),var(--teal-light));border:2px solid var(--amber-mid);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ws-badge{background:var(--amber);color:var(--white);font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.ws-title{font-family:'Nunito',sans-serif;font-size:18px;font-weight:800;color:var(--teal);margin:4px 0}
.ws-sub{font-size:13px;color:var(--gray);font-weight:600}
.name-box{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray)}
.name-line{width:120px;border:none;border-bottom:1.5px solid var(--amber);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:12px;padding:2px 4px;outline:none}

.section{margin-bottom:20px}
.section-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:inline-block;width:4px;height:16px;background:var(--amber);border-radius:2px}
.section-num{background:var(--teal);color:var(--white);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}

.q-block{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px}
.q-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--amber);margin-bottom:6px}
.q-text{font-size:14px;line-height:1.6;color:var(--text)}
.ans-line{width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;color:var(--text);margin-top:6px;display:block}
.ans-box{width:100%;min-height:52px;border:1.5px dashed var(--teal-mid);border-radius:var(--radius-sm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;color:var(--text);margin-top:6px;resize:none}
.inline-ans{display:inline-block;min-width:80px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;color:var(--text);padding:2px 4px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.table-wrap{overflow-x:auto}
table.ws-table{width:100%;border-collapse:collapse;font-size:13px}
table.ws-table th{background:var(--teal);color:var(--white);padding:8px 12px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.ws-table td{border-bottom:1px solid var(--amber-mid);padding:8px 12px;vertical-align:top}
table.ws-table tr:nth-child(even) td{background:var(--amber-light)}
table.ws-table input[type=text]{width:100%;border:none;background:transparent;font-family:'Nunito Sans',sans-serif;font-size:13px;outline:none;border-bottom:1px dashed var(--teal-mid);padding:2px}

.tip-box{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:16px;color:var(--blue)}
.tip-box strong{font-family:'Nunito',sans-serif;font-weight:800}

.urdu-box{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:16px;color:#7B5B00}
.urdu-box strong{font-family:'Nunito',sans-serif;font-weight:800}

.word-bank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;font-size:13px}
.word-bank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px}
.word-tag{display:inline-block;background:var(--purple);color:var(--white);border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}

.vocab-card{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--teal)}
.vocab-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:var(--teal)}
.vocab-meaning{font-size:13px;color:var(--text);margin:3px 0}
.vocab-l1{font-size:12px;color:var(--blue);font-style:italic}
.vocab-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}

.circle-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opt{border:1.5px solid var(--amber);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;color:var(--amber);transition:.12s;background:var(--white)}
.opt.selected{background:var(--amber);color:var(--white)}
.opt.correct{background:#3B6D11!important;color:var(--white)!important;border-color:#3B6D11!important}
.opt.wrong{background:#B71C1C!important;color:var(--white)!important;border-color:#B71C1C!important}

.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--amber-light);font-size:13px}
.check-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:1.5px solid var(--teal);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.chk.done{background:var(--teal);color:var(--white)}

.match-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.match-item{background:var(--amber-light);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:600;font-family:'Nunito',sans-serif}
.match-item.right{background:var(--teal-light);border-color:var(--teal-mid)}

.highlight-box{background:var(--coral-light);border:1.5px solid var(--coral);border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;line-height:1.9;margin:8px 0}

.story-box{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:16px 18px;font-size:14px;line-height:1.9;margin:8px 0}

.step-box{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.step-num{background:var(--teal);color:var(--white);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.step-text{font-size:14px;line-height:1.6}

.worked-ex{background:#F0FFF4;border:2px solid var(--teal-mid);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;font-family:'Courier New',monospace;font-size:16px;text-align:center}
.worked-line{font-size:18px;font-weight:700;letter-spacing:2px;color:var(--teal)}
.borrow{color:var(--coral);font-size:13px;font-weight:800}

.plant-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.plant-card{border-radius:var(--radius-sm);padding:12px;text-align:center;border:2px solid}
.plant-icon{font-size:32px;margin-bottom:6px}
.plant-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.plant-desc{font-size:12px;margin-top:4px;line-height:1.5}

.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.map-card{background:var(--white);border:1.5px solid var(--purple);border-radius:var(--radius-sm);padding:12px}
.map-country{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--purple)}
.map-cap{font-size:13px;color:var(--gray);margin-top:2px}

.rainbow-bar{height:12px;border-radius:6px;margin-bottom:4px}

.seq-item{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:8px}
.seq-num-input{width:36px;height:36px;border:2px solid var(--red);border-radius:50%;text-align:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;color:var(--red);background:var(--red-light);outline:none}

.print-btn{background:var(--teal);color:var(--white);border:none;border-radius:20px;padding:8px 18px;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.print-btn:hover{opacity:.85}

.score-box{background:var(--green-light);border:2px solid var(--green);border-radius:var(--radius);padding:10px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--green);display:none;margin-top:10px}

@media print{.nav,.subject-tabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">HOS International · KS2 Level 3 · Week 3</div>
  <div class="nav-tabs" id="navTabs"></div>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
</div>

<div class="subject-tabs" id="subjectTabs"></div>
<div id="pages"></div>

<script>
const subjects = [
  {id:'eng',   label:'📖 English',    color:'#185FA5', light:'#E6F1FB'},
  {id:'maths', label:'🔢 Maths',      color:'#0F6E56', light:'#E1F5EE'},
  {id:'sci',   label:'🌱 Science',    color:'#D85A30', light:'#FAECE7'},
  {id:'hum',   label:'🌍 Humanities', color:'#534AB7', light:'#EEEDFE'},
  {id:'bib',   label:'✝️ Bible',      color:'#B71C1C', light:'#FFEBEE'},
];

const worksheets = {

  // ══════════════════════════════════════════════════════════════════════════
  eng:[
    {
      num:1, title:'What is Fiction? Characters, Setting & Plot',
      badge:'Reading Comprehension',
      sections:[
        {title:'Learn the key words', content:'eng_vocab'},
        {title:'Read the story', content:'eng_story'},
        {title:'Fiction or Non-Fiction?', content:'eng_fiction_sort'},
      ]
    },
    {
      num:2, title:'Comprehension Questions',
      badge:'Reading Comprehension',
      sections:[
        {title:'Literal questions — find the answer in the text', content:'eng_literal'},
        {title:'Inferential questions — think about the story', content:'eng_infer'},
        {title:'Your prediction', content:'eng_predict'},
      ]
    },
    {
      num:3, title:'Characters & Feelings',
      badge:'Reading Comprehension',
      sections:[
        {title:'Describe the character', content:'eng_character'},
        {title:'How did the character feel?', content:'eng_feelings'},
        {title:'Retell the story', content:'eng_retell'},
      ]
    }
  ],

  // ══════════════════════════════════════════════════════════════════════════
  maths:[
    {
      num:1, title:'What is Subtraction? Place Value Columns',
      badge:'Subtraction — Column Method',
      sections:[
        {title:'Learn the key words', content:'maths_vocab'},
        {title:'Set up the columns correctly', content:'maths_columns'},
        {title:'No regrouping practice', content:'maths_no_regroup'},
      ]
    },
    {
      num:2, title:'Regrouping (Borrowing)',
      badge:'Subtraction — Column Method',
      sections:[
        {title:'When do we regroup?', content:'maths_when_regroup'},
        {title:'Worked examples — follow the steps', content:'maths_worked'},
        {title:'Your turn — subtract with regrouping', content:'maths_regroup_practice'},
      ]
    },
    {
      num:3, title:'Word Problems',
      badge:'Subtraction — Column Method',
      sections:[
        {title:'Read, underline, solve', content:'maths_word_steps'},
        {title:'Word problems', content:'maths_word_probs'},
        {title:'Check your work with addition', content:'maths_check'},
      ]
    }
  ],

  // ══════════════════════════════════════════════════════════════════════════
  sci:[
    {
      num:1, title:'What Do Plants Need to Grow?',
      badge:'Plants & Living Things',
      sections:[
        {title:'Learn the key words', content:'sci_vocab'},
        {title:'The 4 things plants need', content:'sci_4needs'},
        {title:'Match the need to what happens without it', content:'sci_without'},
      ]
    },
    {
      num:2, title:'Parts of a Plant',
      badge:'Plants & Living Things',
      sections:[
        {title:'Label the plant parts', content:'sci_parts'},
        {title:'What does each part do?', content:'sci_jobs'},
        {title:'Healthy or unhealthy plant?', content:'sci_healthy'},
      ]
    },
    {
      num:3, title:'Planning a Plant Experiment',
      badge:'Plants & Living Things',
      sections:[
        {title:'Write a prediction', content:'sci_predict'},
        {title:'Plan your experiment', content:'sci_plan'},
        {title:'Record your observations', content:'sci_observe'},
      ]
    }
  ],

  // ══════════════════════════════════════════════════════════════════════════
  hum:[
    {
      num:1, title:'The United Kingdom — 4 Countries',
      badge:'Our Country & Its Geography',
      sections:[
        {title:'Learn the key words', content:'hum_vocab'},
        {title:'The 4 countries of the UK', content:'hum_4countries'},
        {title:'Match the capital city', content:'hum_capitals'},
      ]
    },
    {
      num:2, title:'Physical Features of the UK',
      badge:'Our Country & Its Geography',
      sections:[
        {title:'Rivers and mountains', content:'hum_features'},
        {title:'Label and describe', content:'hum_label'},
        {title:'Compare with your home country', content:'hum_compare'},
      ]
    },
    {
      num:3, title:'Maps and Geography Words',
      badge:'Our Country & Its Geography',
      sections:[
        {title:'Geography vocabulary', content:'hum_geowords'},
        {title:'True or false?', content:'hum_trufalse'},
        {title:'My geography fact file', content:'hum_factfile'},
      ]
    }
  ],

  // ══════════════════════════════════════════════════════════════════════════
  bib:[
    {
      num:1, title:'The Story of Noah — What Happened?',
      badge:'Noah — Trusting God',
      sections:[
        {title:'Learn the key words', content:'bib_vocab'},
        {title:'Read the story of Noah', content:'bib_story'},
        {title:'Put the story in order', content:'bib_sequence'},
      ]
    },
    {
      num:2, title:'Understanding the Story',
      badge:'Noah — Trusting God',
      sections:[
        {title:'Comprehension questions', content:'bib_questions'},
        {title:'What does it mean to trust God?', content:'bib_trust'},
        {title:'The Covenant — God\'s Promise', content:'bib_covenant'},
      ]
    },
    {
      num:3, title:'Memory Verse & Life Application',
      badge:'Noah — Trusting God',
      sections:[
        {title:'Learn the memory verse', content:'bib_verse'},
        {title:'Noah\'s character — what kind of person was he?', content:'bib_character'},
        {title:'My rainbow promise', content:'bib_apply'},
      ]

};

// ═══════════════════════════════════════════════════════════════════════════
// CONTENT RENDERER
// ═══════════════════════════════════════════════════════════════════════════
function renderContent(key){
  switch(key){

  // ── ENGLISH ──────────────────────────────────────────────────────────────

  case 'eng_vocab': return `
    <div class="urdu-box"><strong>🌍 Language Bridge:</strong> Fiction = افسانہ / قصة خيالية · Character = کردار / شخصية · Setting = ماحول / البيئة · Plot = کہانی / الحبكة</div>
    ${[
      ['📖 Fiction','A story that is <strong>made up</strong> — it is NOT real. Someone imagined it!','افسانہ / قصة خيالية','"The dragon flew over the castle." — This is fiction!'],
      ['👤 Character','A <strong>person or animal</strong> in the story','کردار / شخصية','"Zara is the main character in our story."'],
      ['🏡 Setting','<strong>WHERE and WHEN</strong> the story happens','ماحول / البيئة','"The story is set in an old forest at night."'],
      ['📋 Plot','<strong>What happens</strong> in the story — the events','کہانی / الحبكة','"The plot begins when Zara enters the forest."'],
      ['🔍 Infer','Work out something the text does <strong>NOT</strong> say directly — use clues','نتیجہ اخذ کرنا / استنتاج','"She was shaking — I infer she was scared."'],
      ['🔮 Predict','<strong>Guess what will happen next</strong> before you read on','پیشگوئی کرنا / تنبؤ','"I predict Zara will find the bridge."'],
    ].map(([w,m,l1,eg])=>`
    <div class="vocab-card">
      <div class="vocab-word">${w}</div>
      <div class="vocab-meaning">${m}</div>
      <div class="vocab-l1">🌍 ${l1}</div>
      <div class="vocab-eg">✏️ ${eg}</div>
    </div>`).join('')}`;

  case 'eng_story': return `
    <div class="tip-box"><strong>📖 How to read:</strong> Read slowly. After each paragraph, stop and ask yourself: Who? Where? What happened?</div>
    <div class="story-box">
      <strong style="font-size:16px;font-family:Nunito,sans-serif;color:var(--teal)">🌲 Zara and the Old Forest</strong><br/><br/>
      Zara was eight years old. She lived in a small village near a very old forest. One morning, she woke up early and walked into the forest alone. The trees were tall and dark. Strange sounds came from the leaves above.<br/><br/>
      Zara felt nervous, but she kept walking. She wanted to find the old stone bridge her grandmother had told her about. <em>"It grants one wish,"</em> her grandmother had said.<br/><br/>
      After a long walk, Zara heard the sound of water. She followed it and — there it was! A beautiful stone bridge covered in green moss. She closed her eyes and made her wish.<br/><br/>
      She wished her sick father would get better.<br/><br/>
      When she opened her eyes, a small blue bird landed on her hand and sang. Zara smiled. Somehow, she felt sure everything would be alright.
    </div>
    <div class="q-block">
      <div class="q-text">After reading, write one word to describe how you felt about the story:</div>
      <input class="ans-line" placeholder="I felt ... because ..."/>
    </div>`;

  case 'eng_fiction_sort': return `
    <div class="tip-box"><strong>Remember:</strong> Fiction = made up story. Non-Fiction = about real things (facts, science, news).</div>
    <p style="font-size:14px;margin-bottom:12px">Read each text. Is it <strong>Fiction</strong> or <strong>Non-Fiction</strong>? Click to choose!</p>
    ${[
      ['A dragon swooped down from the mountains and breathed fire on the castle.','Fiction'],
      ['Lions live in Africa. They eat meat and live in groups called prides.','Non-Fiction'],
      ['The princess locked the door and hid the golden key under her pillow.','Fiction'],
      ['Water is made of two hydrogen atoms and one oxygen atom (H₂O).','Non-Fiction'],
      ['The robot danced until the stars came out and the moon clapped.','Fiction'],
      ['The River Thames flows through London and is 346 km long.','Non-Fiction'],
    ].map(([t,ans],i)=>`
    <div class="q-block">
      <div class="q-text">"${t}"</div>
      <div class="circle-opts">
        <div class="opt" onclick="checkAns(this,'fn${i}','Fiction','${ans}')">📖 Fiction</div>
        <div class="opt" onclick="checkAns(this,'fn${i}','Non-Fiction','${ans}')">📰 Non-Fiction</div>
      </div>
    </div>`).join('')}`;

  case 'eng_literal': return `
    <div class="tip-box"><strong>Literal questions:</strong> The answer is IN the text. Find it and copy or write it in your own words.</div>
    ${[
      ['How old is Zara?','She is _____ years old.'],
      ['Where does Zara live?','She lives _______________________________________.'],
      ['What did her grandmother say about the bridge?','Her grandmother said _____________________________.'],
      ['What did Zara hear before she found the bridge?','She heard _______________________________________.'],
      ['What did Zara wish for?','She wished _______________________________________.'],
    ].map(([q,frame],i)=>`
    <div class="q-block">
      <div class="q-num">Question ${i+1}</div>
      <div class="q-text">${q}</div>
      <div style="font-size:12px;color:var(--teal);margin-top:6px;font-style:italic">Sentence frame: ${frame}</div>
      <input class="ans-line"/>
    </div>`).join('')}`;

  case 'eng_infer': return `
    <div class="tip-box"><strong>Inferential questions:</strong> The answer is NOT in the text. Use clues to THINK and work it out.</div>
    ${[
      'How do you think Zara felt when she heard strange sounds? How do you know?',
      'Why did Zara wish for her father to get better instead of something for herself? What does this tell you about her?',

    <div class="q-block">
      <div class="q-text">Write the verse from memory (without looking!):</div>

  case 'bib_character': return `
    <div class="tip-box"><strong>Character</strong> means what kind of person someone is — their qualities and values.</div>
    <div class="q-block">

// ═══════════════════════════════════════════════════════════════════════════
// ANSWER CHECKER
// ═══════════════════════════════════════════════════════════════════════════
function checkAns(el, group, chosen, correct){
  document.querySelectorAll(`[data-ansgroup="${group}"]`).forEach(o=>{
    o.classList.remove('selected','correct','wrong');
    o.setAttribute('data-ansgroup',group);
  });
  el.setAttribute('data-ansgroup',group);
  const isRight = chosen.toLowerCase()===correct.toLowerCase();
  el.classList.add(isRight?'correct':'wrong');
  if(!isRight){
    const allOpts = el.closest('.circle-opts')||el.closest('.q-block');
    if(allOpts){
      allOpts.querySelectorAll('.opt').forEach(o=>{
        if(o.textContent.trim().toLowerCase().includes(correct.toLowerCase().replace('☀️ no sunlight','sunlight').replace('💧 no water','water').replace('🌍 no nutrients','nutrients').replace('📏 no space','space'))){
          o.classList.add('correct');
        }
      });
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════════════════════
let currentSubject = 'eng';
let currentWS = {};
subjects.forEach(s=>currentWS[s.id]=1);

function renderAll(){
  const stabs = document.getElementById('subjectTabs');
  const navT  = document.getElementById('navTabs');
  const pages = document.getElementById('pages');
  stabs.innerHTML=''; navT.innerHTML=''; pages.innerHTML='';

  subjects.forEach(sub=>{
    const st = document.createElement('div');
    st.className='stab'+(sub.id===currentSubject?' active':'');
    st.textContent=sub.label;
    st.style.borderColor=sub.color;
    st.style.color=sub.id===currentSubject?'var(--white)':sub.color;
    if(sub.id===currentSubject) st.style.background=sub.color;
    st.onclick=()=>{currentSubject=sub.id;renderAll()};
    stabs.appendChild(st);
  });

  const sub    = subjects.find(s=>s.id===currentSubject);
  const wsList = worksheets[currentSubject];

  wsList.forEach((ws,idx)=>{
    const t = document.createElement('div');
    t.className='tab'+(currentWS[currentSubject]===idx+1?' active':'');
    t.textContent=`Lesson ${ws.num}`;
    t.style.borderColor=sub.color;
    t.style.color=currentWS[currentSubject]===idx+1?'var(--white)':sub.color;
    if(currentWS[currentSubject]===idx+1) t.style.background=sub.color;
    t.onclick=()=>{currentWS[currentSubject]=idx+1;renderAll()};
    navT.appendChild(t);
  });

  const ws   = wsList[currentWS[currentSubject]-1];
  const page = document.createElement('div');
  page.className='page active';

  page.innerHTML=`
  <div class="ws-header">
    <div>
      <div class="ws-badge">${ws.badge} · Lesson ${ws.num} of 3</div>
      <div class="ws-title">${ws.title}</div>
      <div class="ws-sub">KS2 Level 3 · Week 3 · ESL Support Included</div>
    </div>
    <div class="name-box">Name: <input class="name-line" placeholder="________________"/></div>
  </div>
  ${ws.sections.map((sec,i)=>`
  <div class="section">
    <div class="section-title"><span class="section-num">${i+1}</span>${sec.title}</div>
    ${renderContent(sec.content)}
  </div>`).join('')}`;

  pages.appendChild(page);
}

renderAll();
</script>
