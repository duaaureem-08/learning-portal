<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 4 · KS2 Level 3 · Interactive Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --gray:#5F5E5A;--gray-light:#F1EFE8;
  --mgray:#CFD8DC;--text:#2C2C2A;--white:#FFFFFF;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh;font-size:15px}
h1,h2,h3,h4{font-family:'Nunito',sans-serif}

/* NAV */
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1;min-width:100px}
.nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:20px;border:2px solid transparent;font-size:12px;font-weight:700;cursor:pointer;transition:.13s;font-family:'Nunito',sans-serif;white-space:nowrap}
.tab:hover{opacity:.82}
.tab.active{color:var(--white)!important}
.print-btn{background:var(--teal);color:var(--white);border:none;border-radius:20px;padding:7px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.print-btn:hover{opacity:.85}

/* SUBJECT TABS */
.subject-tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.stab{padding:9px 18px;border-radius:22px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab:hover{opacity:.8}
.stab.active{color:var(--white)}

/* PAGE */
.page{display:none;padding:14px 18px 50px}
.page.active{display:block}

/* WORKSHEET HEADER */
.ws-header{background:linear-gradient(130deg,var(--amber-light),var(--teal-light));border:2px solid var(--amber-mid);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ws-badge{background:var(--amber);color:var(--white);font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:3px 10px;border-radius:20px;letter-spacing:.4px;display:inline-block;margin-bottom:4px}
.ws-title{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--teal);margin:2px 0}
.ws-sub{font-size:12px;color:var(--gray);font-weight:600}
.name-line{border:none;border-bottom:1.5px solid var(--amber);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:12px;padding:2px 4px;outline:none;width:130px}

/* SECTIONS */
.section{margin-bottom:18px}
.sec-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-num{background:var(--teal);color:var(--white);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}

/* QUESTION BLOCKS */
.q-block{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px}
.q-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65;color:var(--text)}
.ans-line{width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;color:var(--text);margin-top:6px;display:block}
.ans-box{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--radius-sm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;color:var(--text);margin-top:6px;resize:none}
.inline-ans{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;color:var(--text);padding:2px 4px}

/* TIPS & BRIDGES */
.tip-box{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-box{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.6}
.l1-box strong{font-family:'Nunito',sans-serif;font-weight:800}

/* VOCAB CARDS */
.vocab-card{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px;border-left:4px solid var(--teal)}
.vocab-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:var(--teal)}
.vocab-meaning{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.vocab-l1{font-size:12px;color:var(--blue);font-style:italic}
.vocab-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}

/* WORD BANK */
.word-bank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:14px}
.word-bank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.word-tag{display:inline-block;background:var(--purple);color:var(--white);border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}

/* CLICK OPTIONS */
.circle-opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.opt{border:2px solid var(--amber);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;color:var(--amber);transition:.12s;background:var(--white)}
.opt:hover{opacity:.8}
.opt.correct{background:#3B6D11!important;color:var(--white)!important;border-color:#3B6D11!important}
.opt.wrong{background:#B71C1C!important;color:var(--white)!important;border-color:#B71C1C!important}

/* TABLES */
.tbl-wrap{overflow-x:auto}
table.ws-table{width:100%;border-collapse:collapse;font-size:13px}
table.ws-table th{background:var(--teal);color:var(--white);padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.ws-table td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top}
table.ws-table tr:nth-child(even) td{background:var(--amber-light)}
table.ws-table input[type=text]{width:100%;border:none;background:transparent;font-family:'Nunito Sans',sans-serif;font-size:13px;outline:none;border-bottom:1px dashed var(--teal-mid);padding:2px}

/* GRIDS */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four-col{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}

/* SPECIAL BOXES */
.story-box{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.example-box{background:#F0FFF4;border:2px solid var(--teal-mid);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:10px;font-family:'Courier New',monospace}
.highlight-box{background:var(--orange-light);border:2px solid var(--orange);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;line-height:1.8;margin:8px 0}
.remember-box{border-radius:var(--radius-sm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--white);text-align:center;margin-top:12px}
.step-box{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:11px;margin-bottom:8px}
.step-num{background:var(--teal);color:var(--white);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-text{font-size:13px;line-height:1.6}

/* CARD GRIDS */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0}
.info-card{border-radius:var(--radius-sm);padding:12px;text-align:center;border:2px solid}
.card-icon{font-size:30px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}

/* CHECK ROWS */
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--amber-light);font-size:13px;line-height:1.5}
.check-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:2px solid var(--teal);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chk.done{background:var(--teal);color:var(--white)}

/* TIMES TABLE */
.times-table{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}
.tt-cell{background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:6px;padding:6px 4px;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:var(--teal)}
.tt-cell.header{background:var(--teal);color:var(--white);font-size:12px}
.tt-input{width:100%;border:none;background:transparent;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:var(--teal);outline:none}

/* SKELETON */
.bone-card{background:var(--white);border:2px solid;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}

/* CONTINENT CARDS */
.cont-card{border-radius:var(--radius-sm);padding:12px;border:2px solid;margin-bottom:8px}
.cont-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px}
.cont-facts{font-size:12px;margin-top:5px;line-height:1.6}

/* VERSE BOX */
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.verse-ref{font-size:12px;color:var(--gray);margin-top:6px}

@media(max-width:600px){.two-col,.three-col,.four-col{grid-template-columns:1fr}.times-table{grid-template-columns:repeat(3,1fr)}}
@media print{.nav,.subject-tabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>

</div>

<div id="pages"></div>

<script>
const SUBJECTS = [
  {id:'eng',   label:'📖 English',    col:'#185FA5', lt:'#E6F1FB'},
  {id:'maths', label:'🔢 Maths',      col:'#0F6E56', lt:'#E1F5EE'},
  {id:'sci',   label:'🦴 Science',    col:'#C2410C', lt:'#FFF0E6'},
  {id:'hum',   label:'🌍 Humanities', col:'#534AB7', lt:'#EEEDFE'},
  {id:'bib',   label:'✝️ Bible',      col:'#B71C1C', lt:'#FFEBEE'},
];

const WS = {

/* ══════════════════════════════════════════════════════════
   ENGLISH — Nouns, Verbs & Adjectives
══════════════════════════════════════════════════════════ */
eng:[
  { num:1, badge:'Nouns, Verbs & Adjectives', title:'What are Nouns?',
    secs:[
      {t:'Learn the word: NOUN',     c:'eng_noun_vocab'},
      {t:'Find the nouns!',          c:'eng_noun_find'},
      {t:'Common and Proper Nouns',  c:'eng_noun_types'},
    ]},
  { num:2, badge:'Nouns, Verbs & Adjectives', title:'What are Verbs and Adjectives?',
    secs:[

      {t:'Find the verb!',            c:'eng_find_verb'},
      {t:'Choose the best adjective', c:'eng_adj_choose'},
    ]},
  { num:3, badge:'Nouns, Verbs & Adjectives', title:'Use Nouns, Verbs and Adjectives Together',
    secs:[
      {t:'Put it all together',        c:'eng_together'},
      {t:'Write your own sentences',   c:'eng_write'},
      {t:'Sort the words',             c:'eng_sort'},
    ]},
],

/* ══════════════════════════════════════════════════════════
   MATHS — Multiplication 2x 5x 10x
══════════════════════════════════════════════════════════ */
maths:[
  { num:1, badge:'Multiplication Tables', title:'What is Multiplication? The 2× Table',
    secs:[
      {t:'Learn: what is multiplication?', c:'maths_mult_intro'},
      {t:'The 2× table',                   c:'maths_2x'},
      {t:'2× practice',                    c:'maths_2x_practice'},
    ]},
  { num:2, badge:'Multiplication Tables', title:'The 5× and 10× Tables',
    secs:[
      {t:'The 5× table',         c:'maths_5x'},
      {t:'The 10× table',        c:'maths_10x'},
      {t:'5× and 10× practice',  c:'maths_5x_10x_practice'},
    ]},
  { num:3, badge:'Multiplication Tables', title:'Word Problems and Arrays',
    secs:[
      {t:'Arrays — see multiplication!', c:'maths_arrays'},
      {t:'Word problems',                c:'maths_word'},
      {t:'Mixed tables challenge',       c:'maths_mixed'},
    ]},
],

/* ══════════════════════════════════════════════════════════
   SCIENCE — Skeletons
══════════════════════════════════════════════════════════ */
sci:[
  { num:1, badge:'Animals Including Humans', title:'Why Do We Have a Skeleton?',
    secs:[
      {t:'Learn the key words',          c:'sci_skel_vocab'},
      {t:'What does a skeleton do?',     c:'sci_skel_jobs'},
      {t:'Name the bones',               c:'sci_bones_name'},
    ]},
  { num:2, badge:'Animals Including Humans', title:'Bones and Joints',
    secs:[

      {t:'Which joint does this?',       c:'sci_joints_match'},

    ]},
  { num:3, badge:'Animals Including Humans', title:'Exoskeletons and Looking After Bones',
    secs:[
      {t:'What is an exoskeleton?',      c:'sci_exo'},
      {t:'How do we keep bones healthy?',c:'sci_healthy_bones'},
      {t:'Skeleton quiz',                c:'sci_quiz'},
    ]},
],

/* ══════════════════════════════════════════════════════════
   HUMANITIES — 7 Continents & 5 Oceans
══════════════════════════════════════════════════════════ */
hum:[
  { num:1, badge:'The World Around Us', title:'The 7 Continents',
    secs:[
      {t:'Learn the key words',       c:'hum_world_vocab'},
      {t:'The 7 continents',          c:'hum_continents'},
      {t:'Continent facts',           c:'hum_cont_facts'},
    ]},
  { num:2, badge:'The World Around Us', title:'The 5 Oceans',
    secs:[
      {t:'The 5 oceans',              c:'hum_oceans'},
      {t:'Compare sizes',             c:'hum_compare'},
      {t:'Where do you live?',        c:'hum_where'},
    ]},
  { num:3, badge:'The World Around Us', title:'World Map Skills',
    secs:[

/* ══════════════════════════════════════════════════════════
   BIBLE — Abraham — Leaving Home to Follow God
══════════════════════════════════════════════════════════ */
bib:[
  { num:1, badge:'Abraham — Faith & Trust', title:'The Story of Abraham',
    secs:[
      {t:'Learn the key words',        c:'bib_abr_vocab'},
      {t:'Read the story',             c:'bib_abr_story'},

    ]},
  { num:2, badge:'Abraham — Faith & Trust', title:'Understanding Faith',
    secs:[
      {t:'Comprehension questions',    c:'bib_abr_questions'},

/* ══════════════════════════════════════════════════════════
   CONTENT RENDERER
══════════════════════════════════════════════════════════ */
function C(key){switch(key){

/* ─── ENGLISH ──────────────────────────────────────────── */

case 'eng_noun_vocab': return `
<div class="l1-box"><strong>🌍 In your language:</strong> Noun = اسم (ism) in Arabic · اسم (ism) in Urdu. A noun is the NAME of something!</div>
${vc('📛 Noun','The <strong>name</strong> of a person, place, animal or thing.','اسم / اسم','"dog · school · Ali · London · table · happiness"','teal')}
${vc('👤 Person noun','The name of a person.','اسم شخص / شخص کا نام','"Ali, teacher, mother, doctor"','teal')}
${vc('🏙️ Place noun','The name of a place.','جگہ کا نام / اسم مكان','"London, school, park, Pakistan, kitchen"','teal')}
${vc('🐶 Animal / thing noun','The name of an animal or object.','جانور یا چیز کا نام / شيء','"cat, book, chair, water, apple"','teal')}
<div class="q-block"><div class="q-text">A noun is the name of a <input class="inline-ans" style="width:80px" placeholder="?"/>, a <input class="inline-ans" style="width:70px" placeholder="?"/>, an <input class="inline-ans" style="width:70px" placeholder="?"/> or a <input class="inline-ans" style="width:60px" placeholder="?"/>.</div></div>`;

case 'eng_noun_find': return `
<div class="tip-box"><strong>How to find a noun:</strong> Ask yourself — is it a NAME? Can I put "the" or "a" in front of it? ✅ "the dog" · ✅ "a school" · ✅ "the teacher"</div>
<p style="font-size:14px;margin-bottom:10px">Read each sentence. Click on the word that is a <strong>noun</strong>.</p>
${[
  ['The','dog','ran','fast',        'dog'],
  ['Ali','went','to','school',     'Ali'],
  ['She','has','a','red','book',   'book'],
  ['The','cat','sat','on','a','mat','cat'],
  ['My','teacher','is','kind',     'teacher'],
].map(([...words], i) => {
  const sentence = words.slice(0,-1);
  const ans = words[words.length-1];
  return `<div class="q-block"><div class="q-num">Sentence ${i+1}</div>
  <div class="circle-opts">${sentence.map(w=>`<div class="opt" onclick="chk(this,'enf${i}','${w}','${ans}')">${w}</div>`).join('')}</div></div>`;
}).join('')}`;

case 'eng_noun_types': return `
<div class="tip-box"><strong>Two types of nouns:</strong><br/>
🔹 <strong>Common noun</strong> = a general name. Example: city, boy, dog. (No capital letter.)<br/>
🔸 <strong>Proper noun</strong> = the SPECIFIC name of a person, place or brand. Example: London, Ahmed, Monday. (Always starts with a CAPITAL letter!)</div>
${[
  ['London','Proper — it is the name of a specific city.'],
  ['city','Common — it does not name a specific city.'],
  ['Ahmed','Proper — it is the name of a specific person.'],
  ['teacher','Common — there are many teachers!'],
  ['Pakistan','Proper — it is the name of a specific country.'],
  ['dog','Common — it is the general word for a type of animal.'],
].map(([word,exp],i)=>`
<div class="q-block"><div class="q-num">Is <strong>"${word}"</strong> a Common or Proper noun?</div>
<div class="circle-opts">
  <div class="opt" onclick="chk(this,'nt${i}','Common',${exp.startsWith('Common')?'"Common"':'"Proper"'})">Common</div>
  <div class="opt" onclick="chk(this,'nt${i}','Proper',${exp.startsWith('Common')?'"Common"':'"Proper"'})">Proper</div>
</div>
<div style="font-size:12px;color:var(--gray);margin-top:6px;font-style:italic">${exp}</div></div>`).join('')}`;

case 'eng_verb_adj_vocab': return `
<div class="l1-box"><strong>🌍 In your language:</strong> Verb = فعل (fi'l) · Adjective = صفة (sifa) in Arabic. In Urdu: Verb = فعل · Adjective = صفت (sifat).</div>
${vc('🏃 Verb','An <strong>action word</strong> — something you DO or something that HAPPENS.','فعل / فعل','"run · jump · eat · is · think · help · fly"','orange')}
${vc('🎨 Adjective','A word that <strong>describes</strong> a noun — what it looks like, feels like, sounds like.','صفت / صفة','"big · red · happy · cold · loud · beautiful · small"','purple')}
<div class="tip-box" style="margin-top:10px"><strong>Easy trick to remember:</strong><br/>
Noun = the NAME (dog, Ahmed, London)<br/>
Verb = the ACTION (runs, eats, is)<br/>
