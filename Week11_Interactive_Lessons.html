<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 11 · KS2 Level 3 · Interactive Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --pink:#BE185D;--pink-light:#FCE7F3;
  --indigo:#3730A3;--indigo-light:#E0E7FF;
  --cyan:#0E7490;--cyan-light:#CFFAFE;
  --gray:#5F5E5A;--text:#2C2C2A;--white:#FFFFFF;
  --radius:12px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Nunito',sans-serif}
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1}
.nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;transition:.13s}
.tab.active{color:#fff!important}
.print-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.stabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.stab{padding:9px 18px;border-radius:22px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:#fff}
.page{display:none;padding:14px 18px 50px}
.page.active{display:block}
.ws-header{background:linear-gradient(130deg,var(--amber-light),var(--teal-light));border:2px solid var(--amber-mid);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ws-badge{background:var(--amber);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:4px}
.ws-title{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--teal)}
.ws-sub{font-size:12px;color:var(--gray);font-weight:600}
.name-line{border:none;border-bottom:1.5px solid var(--amber);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:12px;padding:2px 4px;outline:none;width:130px}
.section{margin-bottom:18px}
.sec-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-num{background:var(--teal);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.q-block{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65}
.ans-line{width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;margin-top:6px;display:block}
.ans-box{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;margin-top:6px;resize:none}
.inline-ans{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;padding:2px 4px}
.tip{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.7}
.l1 strong{font-family:'Nunito',sans-serif;font-weight:800}
.vocab-card{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px}
.v-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
.v-mean{font-size:13px;line-height:1.5;margin:3px 0}
.v-l1{font-size:12px;color:var(--blue);font-style:italic}
.v-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.wbank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:12px}
.wbank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.wtag{display:inline-block;background:var(--purple);color:#fff;border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
.opt{border:2px solid var(--amber);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;color:var(--amber);transition:.12s;background:#fff;display:inline-block;margin:3px}
.opt.correct{background:#3B6D11!important;color:#fff!important;border-color:#3B6D11!important}
.opt.wrong{background:#B71C1C!important;color:#fff!important;border-color:#B71C1C!important}
.circle-opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
table.t th{background:var(--teal);color:#fff;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.t td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.t tr:nth-child(even) td{background:var(--amber-light)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card{border-radius:var(--rsm);padding:12px;border:2px solid;text-align:center}
.card-ico{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.story{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.step{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:10px;margin-bottom:8px}
.step-n{background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-t{font-size:13px;line-height:1.6}
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--amber-light);font-size:13px;line-height:1.5}
.check-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:2px solid var(--teal);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chk.done{background:var(--teal);color:#fff}
.remember{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#fff;text-align:center;margin:14px 0}
/* Clock face */
.clock-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0}
.clock-face{border-radius:50%;background:#fff;border:4px solid var(--teal);position:relative;display:flex;align-items:center;justify-content:center}
@media(max-width:600px){.two,.three,.four{grid-template-columns:1fr}}
@media print{.nav,.stabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">📚 HOS · KS2 Level 3 · Week 11 · Interactive Lessons</div>
  <div class="nav-tabs" id="navTabs"></div>

</div>
<div class="stabs" id="subjectTabs"></div>
<div id="pages"></div>

<script>
const SUBJECTS=[
  {id:'eng',  label:'✏️ English',    col:'#BE185D', lt:'#FCE7F3'},
  {id:'maths',label:'🔢 Maths',      col:'#0F6E56', lt:'#E1F5EE'},
  {id:'sci',  label:'🧲 Science',    col:'#C2410C', lt:'#FFF0E6'},
  {id:'hum',  label:'🌍 Humanities', col:'#0E7490', lt:'#CFFAFE'},
  {id:'bib',  label:'✝️ Bible',      col:'#B71C1C', lt:'#FFEBEE'},
];

const WS={
eng:[
  {num:1,badge:'Adverbs & Time Connectives',title:'What are Adverbs & Time Connectives?',
   secs:[{t:'Key vocabulary',c:'eng_tc_vocab'},{t:'Adverbs of manner',c:'eng_tc_manner'},{t:'Time connectives',c:'eng_tc_time'}]},
  {num:2,badge:'Adverbs & Time Connectives',title:'Using Time Connectives in Sentences',
   secs:[{t:'Sequencing with connectives',c:'eng_tc_sequence'},{t:'Spot the connective',c:'eng_tc_spot'},{t:'Fix the sentences',c:'eng_tc_fix'}]},
  {num:3,badge:'Adverbs & Time Connectives',title:'Write with Time Connectives',
   secs:[{t:'Plan a sequence',c:'eng_tc_plan'},{t:'Write a how-to guide',c:'eng_tc_write'},{t:'Check your writing',c:'eng_tc_check'}]},
],
maths:[
  {num:1,badge:'Time — Telling the Time & Duration',title:'Reading Clocks',
   secs:[{t:'Key vocabulary',c:'maths_t_vocab'},{t:'Analogue clocks',c:'maths_t_analogue'},{t:'Digital clocks',c:'maths_t_digital'}]},
  {num:2,badge:'Time — Telling the Time & Duration',title:'AM, PM and the 24-Hour Clock',
   secs:[{t:'AM and PM',c:'maths_t_ampm'},{t:'24-hour clock',c:'maths_t_24h'},{t:'Converting 12h ↔ 24h',c:'maths_t_convert'}]},
  {num:3,badge:'Time — Telling the Time & Duration',title:'Duration & Time Intervals',
   secs:[{t:'Calculating duration',c:'maths_t_duration'},{t:'Time word problems',c:'maths_t_word'},{t:'Mixed time challenge',c:'maths_t_mixed'}]},
],
sci:[
  {num:1,badge:'Forces — Magnets',title:'What is a Magnet?',
   secs:[{t:'Key vocabulary',c:'sci_mg_vocab'},{t:'Magnetic & non-magnetic materials',c:'sci_mg_materials'},{t:'Test your knowledge',c:'sci_mg_test'}]},
  {num:2,badge:'Forces — Magnets',title:'Magnetic Poles',
   secs:[{t:'North and south poles',c:'sci_mg_poles'},{t:'Attract and repel',c:'sci_mg_attract'},{t:'True or False?',c:'sci_mg_tf'}]},
  {num:3,badge:'Forces — Magnets',title:'Magnets in Everyday Life',
   secs:[{t:'Everyday uses of magnets',c:'sci_mg_uses'},{t:'Magnet quiz',c:'sci_mg_quiz'},{t:'Design a magnet experiment',c:'sci_mg_design'}]},
],
hum:[
  {num:1,badge:'Climate Zones & World Environments',title:'What is a Climate Zone?',
   secs:[{t:'Key vocabulary',c:'hum_cz_vocab'},{t:'The three main climate zones',c:'hum_cz_zones'},{t:'True or False?',c:'hum_cz_tf'}]},
  {num:2,badge:'Climate Zones & World Environments',title:'How Climate Affects Life',
   secs:[{t:'Hot deserts',c:'hum_cz_desert'},{t:'Cold polar regions',c:'hum_cz_polar'},{t:'Temperate regions',c:'hum_cz_temp'}]},
  {num:3,badge:'Climate Zones & World Environments',title:'Climate Zones Around the World',
   secs:[{t:'Climate and food',c:'hum_cz_food'},{t:'Climate quiz',c:'hum_cz_quiz'},{t:'My climate zone',c:'hum_cz_mine'}]},
],
bib:[
  {num:1,badge:'Ruth — Loyalty and Kindness',title:'The Story of Ruth',
   secs:[{t:'Key vocabulary',c:'bib_ru_vocab'},{t:'Read the story',c:'bib_ru_story'},{t:'Story in order',c:'bib_ru_sequence'}]},
  {num:2,badge:'Ruth — Loyalty and Kindness',title:'Understanding Ruth\'s Choices',
   secs:[{t:'Comprehension questions',c:'bib_ru_questions'},{t:'The memory verse',c:'bib_ru_verse'},{t:'True or False?',c:'bib_ru_tf'}]},
  {num:3,badge:'Ruth — Loyalty and Kindness',title:'Loyalty and Kindness in My Life',
   secs:[{t:'What is loyalty?',c:'bib_ru_loyalty'},{t:'Acts of kindness',c:'bib_ru_kindness'},{t:'My life application',c:'bib_ru_apply'}]},
],
};

function vc(w,m,l1,eg,col){col=col||'teal';return `<div class="vocab-card" style="border-left:4px solid var(--${col})"><div class="v-word" style="color:var(--${col})">${w}</div><div class="v-mean">${m}</div><div class="v-l1">🌍 ${l1}</div><div class="v-eg">✏️ ${eg}</div></div>`;}

function C(key){switch(key){

/* ══════════════════════════════════
   ENGLISH — Adverbs & Time Connectives
   ══════════════════════════════════ */
case 'eng_tc_vocab': return `
<div class="l1"><strong>🌍 In your language:</strong><br/>
Time connective = <strong>وقت کا ربط (waqt ka rabt)</strong> — Urdu · <strong>رابط زمني</strong> — Arabic<br/>
Sequence = <strong>ترتیب (tarteeb)</strong> — Urdu · <strong>تسلسل</strong> — Arabic<br/>
These words tell us WHEN and IN WHAT ORDER things happen!</div>
${vc('⏰ Time connective','A word or phrase that shows WHEN something happens or the ORDER of events.','وقت کا ربط / رابط زمني','"First, wash your hands. Then, dry them." — First and Then are time connectives.','blue')}
${vc('📋 Sequence','The ORDER in which things happen — first to last.','ترتیب / تسلسل','"The sequence of the recipe: first, then, next, finally."','blue')}
${vc('🏃 Adverb of manner','A word that describes HOW an action is done. Usually ends in -ly.','طریقے کا ظرف / ظرف الأسلوب','"She carefully mixed the batter." Carefully = adverb of manner.','blue')}
${vc('🔗 Connective','Any word or phrase that joins ideas, sentences or clauses together.','ربط / رابط','"I went outside because it was sunny." Because = connective.','blue')}
<div class="q-block"><div class="q-text">Fill in: Time connectives show us the <input class="inline-ans" style="width:80px" placeholder="?"/> of events. Adverbs of manner describe <input class="inline-ans" style="width:80px" placeholder="?"/> something is done.</div></div>`;

case 'eng_tc_manner': return `
<div class="tip"><strong>Adverbs of manner</strong> describe HOW an action is done. Most end in <strong>-ly</strong>. They make writing more interesting and precise.</div>
<table class="t"><thead><tr><th>Base word</th><th>Adverb of manner</th><th>Example sentence</th></tr></thead><tbody>
<tr><td>careful</td><td><strong>carefully</strong></td><td>She carefully carried the hot soup.</td></tr>
<tr><td>quiet</td><td><strong>quietly</strong></td><td>The children quietly entered the library.</td></tr>
<tr><td>quick</td><td><strong>quickly</strong></td><td>He quickly packed his bag and ran out.</td></tr>
<tr><td>slow</td><td><strong>slowly</strong></td><td>The old tortoise slowly crossed the road.</td></tr>
<tr><td>gentle</td><td><strong>gently</strong></td><td>She gently placed the egg in the nest.</td></tr>
<tr><td>brave</td><td><strong>bravely</strong></td><td>The firefighter bravely entered the burning building.</td></tr>
</tbody></table>
<p style="font-size:14px;margin-bottom:8px">Turn these into adverbs of manner and write a sentence:</p>
${[['happy','happily'],['silent','silently'],['angry','angrily']].map(([b,a],i)=>`
<div class="q-block"><div class="q-num">Sentence ${i+1} — adverb of "${b}":</div>
<div class="q-text">${b} → <input class="inline-ans" style="width:90px" placeholder="?"/> &nbsp;Now write a sentence using it:</div>
<input class="ans-line" placeholder="…"/></div>`).join('')}`;

case 'eng_tc_time': return `
<div class="tip"><strong>Time connectives</strong> show order, sequence, and when things happen. Use them to make your writing clear and easy to follow.</div>
<div class="four" style="margin-bottom:14px">
${[
  ['1️⃣','First / To begin with','Introduces the very first step or event.'],
  ['2️⃣','Next / Then / After that','Shows the following step(s).'],
  ['3️⃣','Meanwhile / At the same time','Shows two things happening together.'],
  ['4️⃣','Finally / Lastly / In the end','Shows the last step or outcome.'],
].map(([ico,t,d])=>`<div class="card" style="background:var(--blue-light);border-color:var(--blue)"><div class="card-ico">${ico}</div><div class="card-title" style="color:var(--blue)">${t}</div><div class="card-desc">${d}</div></div>`).join('')}
</div>
<div class="q-block"><div class="q-num">Put these steps in order using time connectives:</div>
<div style="font-size:13px;margin-bottom:8px;color:var(--gray)">Steps (not in order): dry your face · turn on the tap · turn off the tap · get a towel · wash your hands</div>
${[1,2,3,4,5].map((n,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><strong style="font-family:'Nunito',sans-serif;font-size:13px;color:var(--teal);min-width:80px">${['First,','Then,','Next,','After that,','Finally,'][i]}</strong><input class="ans-line" style="margin-top:0;flex:1" placeholder="write the step…"/></div>`).join('')}
</div>`;

case 'eng_tc_sequence': return `
<div class="tip"><strong>Time connectives sequence events</strong> — they tell the reader what happens WHEN. Combine them with adverbs of manner to add detail!</div>
<div style="background:var(--pink-light);border:2px solid var(--pink);border-radius:var(--rsm);padding:14px;margin-bottom:14px;font-size:14px;line-height:2.2;font-family:'Nunito',sans-serif">
  <strong>Example — How to make a sandwich:</strong><br/>
  <strong>First</strong>, <em>carefully</em> lay two slices of bread on the plate.<br/>
  <strong>Next</strong>, <em>generously</em> spread butter on each slice.<br/>
  <strong>Then</strong>, <em>neatly</em> place your filling on one side.<br/>
  <strong>Finally</strong>, <em>gently</em> press the two slices together.
</div>
<p style="font-size:14px;margin-bottom:8px">Fill in the missing time connective OR adverb of manner:</p>
${[
  ['_____, pour the milk into the bowl.','First'],
  ['Next, _____ stir the mixture until smooth.','gently'],
  ['After that, _____ place the cake tin in the oven.','carefully'],
  ['_____, remove the cake and let it cool.','Finally'],
  ['Meanwhile, _____ clean up the kitchen.','quickly'],
].map(([s,ans],i)=>`
<div class="q-block"><div class="q-num">Sentence ${i+1}:</div>
<div class="q-text">${s.replace('_____',`<input class="inline-ans" style="width:110px" placeholder="?"/>`)}</div></div>`).join('')}`;

case 'eng_tc_spot': return `
<p style="font-size:14px;margin-bottom:10px">Underline or click the TIME CONNECTIVE in each sentence:</p>
${[
  ['First, boil the water in a large pot.','First'],
  ['She finished her homework, then went outside to play.','then'],
  ['Next, carefully add the pasta to the boiling water.','Next'],
  ['After that, drain the pasta and place it on a plate.','After that'],
  ['Meanwhile, the sauce bubbled gently on the stove.','Meanwhile'],
  ['Finally, serve the pasta with the delicious sauce.','Finally'],
].map(([s,ans],i)=>`
<div class="q-block"><div class="q-num">Sentence ${i+1}</div>
<div class="q-text">${s}</div>
<div class="circle-opts">${s.split(',')[0].trim().split(' ').concat(['then','Next','After that','Meanwhile','Finally']).filter((v,idx,arr)=>arr.indexOf(v)===idx).slice(0,4).map(w=>`<div class="opt" onclick="chk(this,'tc${i}','${w}','${ans}')">${w}</div>`).join('')}<div class="opt" onclick="chk(this,'tc${i}','${ans}','${ans}')">${ans}</div></div>
</div>`).join('')}`;

case 'eng_tc_fix': return `
<div class="tip"><strong>These sentences are missing a time connective OR an adverb of manner.</strong> Choose from the word bank and rewrite each sentence.</div>
<div class="wbank"><strong>Word Bank:</strong>
${['first','then','next','finally','after that','carefully','quickly','slowly','gently','bravely'].map(w=>`<span class="wtag">${w}</span>`).join('')}
</div>
${[
  ['The chef _____ chopped the vegetables.','carefully'],
  ['_____, she put on her coat and left.','Finally'],
  ['He _____ answered the question.','bravely'],
  ['_____, add two eggs to the mixture.','Next'],
  ['She _____ turned the page so as not to tear it.','gently'],
].map(([s,ans],i)=>`
<div class="q-block"><div class="q-num">Sentence ${i+1}:</div>
<div class="q-text" style="margin-bottom:6px">${s}</div>
<input class="ans-line" placeholder="Rewrite the full sentence with the correct word…"/></div>`).join('')}`;

case 'eng_tc_plan': return `
<div class="tip"><strong>Plan a HOW-TO guide</strong> using time connectives and adverbs of manner. Choose a topic below!</div>
<div class="q-block">

let curSubj='eng', curLesson=1;
function chk(el,group,val,ans){
  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  if(val===ans)el.classList.add('correct');
  else{el.classList.add('wrong');el.parentElement.querySelectorAll('.opt').forEach(o=>{if(o.textContent.trim()===ans)o.classList.add('correct');});}
}
function render(){
  const stabs=document.getElementById('subjectTabs');const navTabs=document.getElementById('navTabs');const pages=document.getElementById('pages');
  stabs.innerHTML='';
  SUBJECTS.forEach(s=>{
    const el=document.createElement('div');el.className='stab'+(s.id===curSubj?' active':'');
    el.textContent=s.label;el.style.borderColor=s.col;el.style.color=s.id===curSubj?'#fff':s.col;
    if(s.id===curSubj)el.style.background=s.col;
    el.onclick=()=>{curSubj=s.id;curLesson=1;render();};stabs.appendChild(el);
  });
  const subj=SUBJECTS.find(s=>s.id===curSubj);const lessons=WS[curSubj];
  navTabs.innerHTML='';
  lessons.forEach(l=>{
    const el=document.createElement('div');el.className='tab'+(l.num===curLesson?' active':'');
    el.textContent='Lesson '+l.num;el.style.borderColor=subj.col;el.style.color=l.num===curLesson?'#fff':subj.col;
    if(l.num===curLesson)el.style.background=subj.col;
    el.onclick=()=>{curLesson=l.num;render();};navTabs.appendChild(el);
  });
  const lesson=lessons.find(l=>l.num===curLesson);
  pages.innerHTML=`<div class="page active">
    <div class="ws-header">
      <div><div class="ws-badge">${lesson.badge}</div>
      <div class="ws-title">${lesson.title}</div>
      <div class="ws-sub">Lesson ${lesson.num} of ${lessons.length} · ${subj.label} · Week 11</div></div>
      <div>Name: <input class="name-line" placeholder="________________"/></div>
    </div>
    ${lesson.secs.map((sec,i)=>`<div class="section"><div class="sec-title"><span class="sec-num">${i+1}</span>${sec.t}</div>${C(sec.c)}</div>`).join('')}
  </div>`;
}
render();
