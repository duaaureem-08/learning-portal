<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 9 · Student Lesson Notes · KS2 Level 3</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --gray:#5F5E5A;--mgray:#CFD8DC;
  --text:#2C2C2A;--white:#FFFFFF;
  --radius:14px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Nunito',sans-serif}
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-logo{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1}
.stabs{display:flex;gap:7px;flex-wrap:wrap}
.stab{padding:7px 14px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:#fff}
.print-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 15px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.page{display:none;padding:16px 18px 50px}
.page.active{display:block}
.banner{border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;color:#fff}
.banner-label{font-size:10px;font-weight:800;letter-spacing:.8px;opacity:.85;margin-bottom:4px}
.banner-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;line-height:1.2}
.banner-sub{font-size:13px;opacity:.85;margin-top:4px}
.name-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;opacity:.9}
.name-input{border:none;border-bottom:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:160px;font-family:'Nunito Sans',sans-serif}
.sec-head{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin:18px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--amber-mid)}
.sec-num{background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.vocab-card{border-left:4px solid var(--teal);background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px}
.v-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
.v-mean{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.v-l1{font-size:12px;color:var(--blue);font-style:italic}
.v-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.tip{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-bridge{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.7}
.l1-bridge strong{font-family:'Nunito',sans-serif;font-weight:800}
.remember{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#fff;text-align:center;margin:14px 0}
.tbl-wrap{overflow-x:auto;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--teal);color:#fff;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.t td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.t tr:nth-child(even) td{background:var(--amber-light)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card{border-radius:var(--rsm);padding:12px;border:2px solid;text-align:center}
.card-ico{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.dline{border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;width:100%;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;display:block;margin-bottom:6px}
.tarea{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;resize:none;margin-top:6px}
.inline{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;padding:2px 4px}
.q-box{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65}
.story{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.frame{border-radius:var(--rsm);padding:11px 14px;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;text-align:center;margin-bottom:8px;border:2px solid}
.wbank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:12px}
.wbank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.wtag{display:inline-block;background:var(--purple);color:#fff;border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
.step{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:10px;margin-bottom:8px}
.step-n{background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-t{font-size:13px;line-height:1.6}
.example-box{background:#F0FFF4;border:2px solid var(--teal-mid);border-radius:var(--rsm);padding:12px 16px;margin-bottom:10px;font-size:14px;line-height:1.8}
.highlight{background:#FEF3C7;border:2px solid var(--amber);border-radius:var(--rsm);padding:12px 14px;font-size:14px;line-height:1.8;margin:8px 0}
@media(max-width:600px){.two,.three,.four{grid-template-columns:1fr}}
@media print{.nav,.stabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>

  {id:'bib',    label:'✝️ Bible',     col:'#B71C1C'},
];

const PAGES={

cover:`
<div style="background:linear-gradient(150deg,#0F6E56,#185FA5);min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center">
  <div style="font-size:52px;margin-bottom:10px">📒</div>
  <div style="font-family:Nunito,sans-serif;font-size:11px;font-weight:800;color:#FDE68A;letter-spacing:1.5px;margin-bottom:8px">HOS INTERNATIONAL · KS2 LEVEL 3</div>
  <div style="font-family:Nunito,sans-serif;font-size:30px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:8px">MY LESSON NOTES</div>

    <div style="font-size:12px;color:#FDE68A;margin-bottom:10px;font-weight:700">📝 My Details</div>

      Class: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px">

eng:`
<div class="banner" style="background:linear-gradient(135deg,#185FA5,#1E40AF)">
  <div class="banner-label">SUBJECT 1 OF 5 · WEEK 9</div>
  <div class="banner-title">📖 English — Descriptive Writing: Settings</div>
  <div class="banner-sub">KS2 Level 3 · Elementary ESL</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Setting = <strong>منظر (manzar)</strong> — Urdu · <strong>مشهد</strong> — Arabic<br/>
Adjective = <strong>صفت (sift)</strong> — Urdu · <strong>صفة</strong> — Arabic<br/>
Adverb = <strong>متعلق فعل</strong> — Urdu · <strong>ظرف</strong> — Arabic<br/>
Descriptive writing uses special words to help the reader SEE, HEAR and FEEL a place!</div>

<div class="sec-head"><span class="sec-num">1</span>WHAT IS A SETTING?</div>
<div class="two" style="margin-bottom:14px">
<div class="card" style="background:#DBEAFE;border-color:#185FA5;text-align:left">
  <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:14px;color:#185FA5;margin-bottom:8px">🏞️ Setting</div>
  <div style="font-size:13px;line-height:1.8">The PLACE and TIME where a story happens. Example: a dark forest, a busy market, a quiet beach at sunset.</div>
</div>
<div class="card" style="background:#D1FAE5;border-color:#0F6E56;text-align:left">
  <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:14px;color:#0F6E56;margin-bottom:8px">✏️ Descriptive Writing</div>
  <div style="font-size:13px;line-height:1.8">Writing that uses adjectives, adverbs and the five senses to paint a picture with words.</div>
</div>
</div>

<div class="tip"><strong>Easy trick! 🧠</strong> Use your FIVE SENSES to describe a setting: What can you SEE? HEAR? SMELL? FEEL (touch)? TASTE?</div>

<div class="sec-head"><span class="sec-num">2</span>WORD BANK</div>
${[
  ['🏞️ Setting','The place and time where a story happens.','منظر / مشهد','"The setting of the story is a dark, old castle."','#185FA5'],
  ['🎨 Adjective','A word that describes a noun. Example: dark, tall, ancient.','صفت / صفة','"The dark forest was silent."','#185FA5'],
  ['⚡ Adverb','A word that describes a verb — HOW something happens. Often ends in -ly.','متعلق فعل / ظرف','"The wind blew gently across the field."','#185FA5'],
  ['👃 Senses','Sight, sound, smell, touch and taste. Use them to bring writing to life.','حواس / حواس','"I used my senses to describe the smell of fresh bread."','#185FA5'],
  ['🔤 Word choice','Choosing the BEST and most powerful word, not just any word.','الفاظ کا انتخاب / اختيار الكلمات','"Instead of \\'big\\', I chose \\'enormous\\' for better word choice."','#185FA5'],
].map(([w,m,l1,eg,col])=>`
<div class="vocab-card" style="border-left-color:${col}">
  <div class="v-word" style="color:${col}">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ e.g. ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">3</span>ADJECTIVES vs ADVERBS — WHAT'S THE DIFFERENCE?</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Type</th><th>Describes</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>Adjective</strong></td><td>A NOUN (person, place, thing)</td><td>The <strong>dark</strong> forest, the <strong>old</strong> house</td></tr>
<tr><td><strong>Adverb</strong></td><td>A VERB (an action — HOW it happens)</td><td>She walked <strong>quietly</strong>. The rain fell <strong>heavily</strong>.</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">4</span>EXAMPLE — DESCRIBING A SETTING</div>
<div class="story">
<strong>Weak sentence:</strong> The forest was dark. There were trees.<br/><br/>
<strong>Improved with adjectives and adverbs:</strong> The <em>ancient</em>, <em>shadowy</em> forest stretched endlessly. Tall trees creaked <em>slowly</em> in the wind, and the air smelled of <em>damp</em> moss.
</div>

<div class="sec-head"><span class="sec-num">5</span>WORD BANK — POWERFUL ADJECTIVES &amp; ADVERBS</div>
<div class="wbank"><strong>Powerful adjectives:</strong>
${['ancient','shadowy','glistening','crumbling','vast','silent','golden','misty'].map(w=>`<span class="wtag">${w}</span>`).join('')}
</div>
<div class="wbank"><strong>Powerful adverbs:</strong>
${['quietly','suddenly','gently','slowly','brightly','softly','carefully','eerily'].map(w=>`<span class="wtag">${w}</span>`).join('')}
</div>

<div class="sec-head"><span class="sec-num">6</span>USE YOUR FIVE SENSES</div>
<div class="q-box">
  <div class="q-label">Plan a setting description using your senses (a beach, a forest, a market — your choice)</div>
  <div style="line-height:2.8;font-size:14px;margin-top:6px">
    My setting is: <input class="inline" style="width:180px" placeholder="..."/><br/>
    👀 I can SEE: <input class="inline" style="width:200px" placeholder="..."/><br/>
    👂 I can HEAR: <input class="inline" style="width:200px" placeholder="..."/><br/>
    👃 I can SMELL: <input class="inline" style="width:200px" placeholder="..."/><br/>
    ✋ I can FEEL: <input class="inline" style="width:200px" placeholder="..."/>
  </div>
</div>

<div class="sec-head"><span class="sec-num">7</span>SENTENCE FRAMES — USE THESE!</div>
${[
  ['#185FA5','#DBEAFE','The ___, ___ [place] stretched before me.'],
  ['#0F6E56','#D1FAE5','I could hear the ___ sound of ___.'],
  ['#C2410C','#FFEDD5','The air smelled ___ and ___.'],
].map(([col,bg,f])=>`<div class="frame" style="background:${bg};border-color:${col};color:${col}">${f}</div>`).join('')}

<div class="sec-head"><span class="sec-num">8</span>WRITE YOUR SETTING DESCRIPTION</div>
${[
  ['Opening','What is the setting? Use ONE strong adjective to introduce it.'],
  ['Sights &amp; sounds','What can you see and hear? Use adjectives and adverbs.'],
  ['Feelings &amp; atmosphere','How does the setting make you feel? What is the mood?'],
].map(([t,q],i)=>`
<div class="q-box">

  <div class="q-text" style="font-size:12px;color:var(--gray)">${q}</div>
  <textarea class="tarea" placeholder="Write your sentences here..."></textarea>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">9</span>CHECKLIST — CHECK AND IMPROVE</div>
<div class="q-box">
${[
  'I used at least 3 adjectives to describe the setting.',
  'I used at least 2 adverbs to describe actions.',
  'I described what I can see, hear, smell or feel.',
  'I chose powerful words, not boring ones.',
  'My setting description has a clear mood or atmosphere.',
].map(item=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px"><span style="width:18px;height:18px;border:2px solid var(--blue);border-radius:4px;flex-shrink:0;display:inline-block"></span>${item}</div>`).join('')}
</div>

<div class="remember" style="background:#185FA5">⭐ REMEMBER: Use your 5 senses + powerful adjectives + adverbs to bring a setting to life!</div>`,

maths:`
<div class="banner" style="background:linear-gradient(135deg,#0F6E56,#065F46)">
  <div class="banner-label">SUBJECT 2 OF 5 · WEEK 9</div>
  <div class="banner-title">🔢 Maths — Measurement: Length &amp; Perimeter</div>
  <div class="banner-sub">Centimetres · Metres · Perimeter of 2D Shapes · KS2 Level 3</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="l1-bridge"><strong>🌍 In your language:</strong><br/>
Length = <strong>لمبائی (lambai)</strong> — Urdu · <strong>طول</strong> — Arabic<br/>
Perimeter = <strong>محیط (muheet)</strong> — Urdu &amp; Arabic<br/>
Centimetre (cm) and metre (m) are units we use to measure length!</div>

<div class="sec-head"><span class="sec-num">1</span>UNITS OF LENGTH</div>
<div class="tip"><strong>Important rule:</strong> 100 centimetres (cm) = 1 metre (m). A metre is a BIGGER unit than a centimetre!</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Unit</th><th>Used for</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>cm (centimetre)</strong></td><td>Small things</td><td>A pencil is about 15 cm long.</td></tr>
<tr><td><strong>m (metre)</strong></td><td>Bigger things</td><td>A door is about 2 m tall.</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">2</span>WORD BANK</div>
${[
  ['📏 Length','How long something is — measured in cm or m.','لمبائی / طول','"The length of the table is 120 cm."'],
  ['🟦 Perimeter','The total distance all the way around a shape.','محیط / محيط','"The perimeter of the square is 20 cm."'],
  ['📐 Width','How wide something is — side to side.','چوڑائی / عرض','"The width of the room is 4 metres."'],
  ['📊 Centimetre (cm)','A small unit of length. 100 cm = 1 m.','سینٹی میٹر / سنتيمتر','"My pencil is 15 cm long."'],
  ['📈 Metre (m)','A bigger unit of length. 1 m = 100 cm.','میٹر / متر','"The classroom is 8 metres long."'],
].map(([w,m,l1,eg])=>`
<div class="vocab-card">
  <div class="v-word" style="color:#0F6E56">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">3</span>CONVERTING CM AND M</div>
<div class="tip"><strong>Trick:</strong> To turn m into cm — multiply by 100. To turn cm into m — divide by 100!</div>
<div class="example-box">
2 m = 2 × 100 = <strong>200 cm</strong><br/>
350 cm = 350 ÷ 100 = <strong>3.5 m</strong>
</div>

<div class="sec-head"><span class="sec-num">4</span>WHAT IS PERIMETER?</div>
<div class="tip"><strong>Perimeter</strong> = the distance all the way AROUND the outside of a shape. Add up all the sides!</div>

  <textarea class="tarea" style="min-height:55px" placeholder="...for the Lord your God ..."></textarea>
</div>

<div class="sec-head"><span class="sec-num">6</span>LIFE APPLICATION — COURAGE TO DO WHAT IS RIGHT</div>
<div class="tip"><strong>Rahab had courage</strong> even though she was scared and it was risky. Real courage isn't about NOT feeling scared — it's doing the right thing ANYWAY.</div>
${[
  ['#EF5350','❤️ A time I had to be brave to do the right thing:'],
  ['#F97316','🧡 One way I can show courage at school this week:'],
  ['#EAB308','💛 Someone I know who has shown great courage:'],
  ['#22C55E','💚 How I can help or protect someone, like Rahab helped the spies:'],
  ['#3B82F6','💙 A risky choice that could still be the RIGHT choice:'],
  ['#A855F7','💜 My prayer or thought about courage this week:'],
].map(([col,label])=>`
<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">
  <div style="width:5px;height:30px;background:${col};border-radius:4px;margin-top:2px"></div>
  <div style="flex:1">
    <div style="font-size:12px;font-weight:700;font-family:Nunito,sans-serif;color:${col}">${label}</div>
    <input class="dline" style="border-bottom-color:${col}"/>
  </div>
</div>`).join('')}

<div class="remember" style="background:#B71C1C">⭐ REMEMBER: Rahab risked her own safety to do the right thing — and God protected her and her family. Real courage means doing what is right, even when it's hard! 🦁</div>`,

};

let cur='cover';
function render(){
  const stabs=document.getElementById('stabs');
  const pages=document.getElementById('pages');
  stabs.innerHTML=''; pages.innerHTML='';
  SUBJS.forEach(s=>{
    const el=document.createElement('div');
    el.className='stab'+(s.id===cur?' active':'');
    el.textContent=s.label;
    el.style.borderColor=s.col;
    el.style.color=s.id===cur?'#fff':s.col;
    if(s.id===cur) el.style.background=s.col;
    el.onclick=()=>{cur=s.id;render()};
    stabs.appendChild(el);
  });
  const pg=document.createElement('div');
  pg.className='page active';
  pg.innerHTML=PAGES[cur]||'<p style="padding:30px;color:var(--gray)">Loading...</p>';
  pages.appendChild(pg);
}
render();
</script>
