<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 12 · Student Lesson Notes · KS2 Level 3 — Term 1 Review</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --gray:#5F5E5A;--mgray:#CFD8DC;
  --text:#2C2C2A;--white:#FFFFFF;
  --radius:14px;--rsm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Nunito',sans-serif}

.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-logo{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1}
.stabs{display:flex;gap:7px;flex-wrap:wrap}
.stab{padding:7px 14px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab.active{color:#fff}
.print-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 15px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}

.page{display:none;padding:16px 18px 50px}
.page.active{display:block}

.banner{border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;color:#fff}
.banner-label{font-size:10px;font-weight:800;letter-spacing:.8px;opacity:.85;margin-bottom:4px}
.banner-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;line-height:1.2}
.banner-sub{font-size:13px;opacity:.85;margin-top:4px}
.name-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;opacity:.9}
.name-input{border:none;border-bottom:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:160px;font-family:'Nunito Sans',sans-serif}

.sec-head{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin:18px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--amber-mid)}
.sec-num{background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}

.vocab-card{border-left:4px solid var(--teal);background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:11px 13px;margin-bottom:8px}
.v-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
.v-mean{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.v-l1{font-size:12px;color:var(--blue);font-style:italic}
.v-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.v-wk{display:inline-block;background:var(--amber);color:#fff;font-size:9px;font-weight:900;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}

.tip{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-bridge{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--rsm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.7}
.l1-bridge strong{font-family:'Nunito',sans-serif;font-weight:800}
.review-tip{background:linear-gradient(120deg,#FFF3D6,#E1F5EE);border:2px solid var(--amber);border-radius:var(--rsm);padding:10px 14px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.6;font-weight:700}
.remember{border-radius:var(--rsm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#fff;text-align:center;margin:14px 0}

.tbl-wrap{overflow-x:auto;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--teal);color:#fff;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.t td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top;line-height:1.5}
table.t tr:nth-child(even) td{background:var(--amber-light)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}

.card{border-radius:var(--rsm);padding:12px;border:2px solid;text-align:center}
.card-ico{font-size:28px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}

.write-label{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:4px;font-family:'Nunito',sans-serif}
.dline{border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;width:100%;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;display:block;margin-bottom:6px}
.tarea{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--rsm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;resize:none;margin-top:6px}
.inline{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;padding:2px 4px}
.q-box{background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:12px 14px;margin-bottom:10px}
.q-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65}

.tt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}
.tt-cell{background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:6px;padding:6px 3px;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;color:var(--teal)}
.tt-cell input{width:100%;border:none;background:transparent;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;color:var(--teal);outline:none}

.story{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}

.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}

.frame{border-radius:var(--rsm);padding:11px 14px;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;text-align:center;margin-bottom:8px;border:2px solid}

.wbank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--rsm);padding:10px 13px;margin-bottom:12px}
.wbank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.wtag{display:inline-block;background:var(--purple);color:#fff;border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}

.step{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--amber-mid);border-radius:var(--rsm);padding:10px;margin-bottom:8px}
.step-n{background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-t{font-size:13px;line-height:1.6}

.rbow-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rbow-bar{width:12px;height:30px;border-radius:4px;flex-shrink:0}

@media(max-width:600px){.two,.three,.four{grid-template-columns:1fr}.tt{grid-template-columns:repeat(3,1fr)}}
@media print{.nav,.stabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">📒 HOS · KS2 Level 3 · Week 12 · Term 1 Review Notes</div>
  <div class="stabs" id="stabs"></div>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
</div>
<div id="pages"></div>

<script>
const SUBJS=[
  {id:'cover',  label:'🏠 Cover',     col:'#0F6E56'},
  {id:'eng',    label:'📖 English',   col:'#185FA5'},
  {id:'maths',  label:'🔢 Maths',     col:'#0F6E56'},
  {id:'sci',    label:'💪 Science',   col:'#C2410C'},
  {id:'hum',    label:'🌍 Humanities',col:'#534AB7'},
  {id:'bib',    label:'✝️ Bible',     col:'#B71C1C'},
];

const PAGES={

/* ── COVER ─────────────────────────────────────────────── */
cover:`
<div style="background:linear-gradient(150deg,#0F6E56,#185FA5);min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center">
  <div style="font-size:52px;margin-bottom:10px">📒</div>
  <div style="font-family:Nunito,sans-serif;font-size:11px;font-weight:800;color:#FDE68A;letter-spacing:1.5px;margin-bottom:8px">HOS INTERNATIONAL · KS2 LEVEL 3</div>
  <div style="font-family:Nunito,sans-serif;font-size:30px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:8px">TERM 1 REVIEW NOTES</div>
  <div style="font-family:Nunito,sans-serif;font-size:15px;color:#FDE68A;margin-bottom:6px">Week 12 · Covering Weeks 1–11</div>
  <div style="font-size:12px;color:rgba(255,255,255,.85);margin-bottom:24px;max-width:340px">Spelling test · number skills test · science quiz · map skills quiz · memory verse recitation</div>
  <div style="background:rgba(255,255,255,.12);border-radius:12px;padding:18px 24px;margin-bottom:24px;width:100%;max-width:360px">
    <div style="font-size:12px;color:#FDE68A;margin-bottom:10px;font-weight:700">📝 My Details</div>
    <div style="text-align:left;font-size:13px;color:#fff;line-height:2.4">
      Name: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/><br/>
      Class: <input style="border:none;border-bottom:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;padding:2px 6px;outline:none;width:170px;font-family:'Nunito Sans',sans-serif" placeholder="________________"/>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px">
    ${[
      ['📖','English','Grammar · Reading · Writing · Spelling — Wks 1–11','#1E40AF','#DBEAFE'],
      ['🔢','Maths','Number · Tables · Fractions · Measurement — Wks 1–11','#065F46','#D1FAE5'],
      ['💪','Science','Plants · Body · Rocks · Light · Magnets — Wks 1–11','#9A3412','#FFEDD5'],
      ['🌍','Humanities','Maps · Geography · Ancient Egypt · Romans · Civics','#3730A3','#E0E7FF'],
      ['✝️','Bible','10 Bible stories &amp; memory verses — Wks 1–11','#991B1B','#FEE2E2'],
    ].map(([ico,sub,topic,col,bg])=>`
    <div style="background:${bg};border:1.5px solid ${col};border-radius:10px;padding:10px;text-align:left">
      <div style="font-size:18px">${ico}</div>
      <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:12px;color:${col}">${sub}</div>
      <div style="font-size:11px;color:#5F5E5A;margin-top:2px">${topic}</div>
    </div>`).join('')}
  </div>
  <div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,.6)">Use this booklet to revise everything we've learned this term before the assessments! 🌍</div>
</div>`,

/* ── ENGLISH ────────────────────────────────────────────── */
eng:`
<div class="banner" style="background:linear-gradient(135deg,#185FA5,#1E40AF)">
  <div class="banner-label">SUBJECT 1 OF 5 · WEEK 12 · TERM 1 REVIEW</div>
  <div class="banner-title">📖 English — Term 1 Review (Weeks 1–11)</div>
  <div class="banner-sub">Grammar · Reading · Writing · Spelling · KS2 Level 3</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="review-tip">🔁 This week reviews EVERYTHING from Term 1 English before your spelling test, reading comprehension and writing sample review.</div>

<div class="sec-head"><span class="sec-num">1</span>SENTENCE TYPES &amp; PUNCTUATION (WEEK 2)</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Type</th><th>Ends with</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>Statement</strong></td><td>. full stop</td><td>The sun was shining.</td></tr>
<tr><td><strong>Question</strong></td><td>? question mark</td><td>Where is my book?</td></tr>
<tr><td><strong>Exclamation</strong></td><td>! exclamation mark</td><td>What a surprise!</td></tr>
<tr><td><strong>Command</strong></td><td>. or !</td><td>Close the door.</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">2</span>NOUNS, VERBS &amp; ADJECTIVES (WEEK 4)</div>
${[
  ['📦 Noun','A person, place, animal or thing.','اسم / اسم','"dog, London, teacher, happiness"','#185FA5'],
  ['🏃 Verb','An action or doing word.','فعل / فعل','"run, jump, think, shout"','#185FA5'],
  ['🎨 Adjective','A word that describes a noun.','صفت / صفة','"tall, red, happy, ancient"','#185FA5'],
].map(([w,m,l1,eg,col])=>`
<div class="vocab-card" style="border-left-color:${col}">
  <div class="v-word" style="color:${col}">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ e.g. ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">3</span>CONJUNCTIONS &amp; TIME CONNECTIVES (WEEKS 8 &amp; 11)</div>
<div class="wbank"><strong>Conjunctions:</strong> ${['and','but','so','because','when'].map(w=>`<span class="wtag">${w}</span>`).join('')}</div>
<div class="wbank"><strong>Time connectives:</strong> ${['First','Next','Then','After that','Finally'].map(w=>`<span class="wtag">${w}</span>`).join('')}</div>

<div class="sec-head"><span class="sec-num">4</span>READING COMPREHENSION — FICTION &amp; NON-FICTION (WEEKS 3 &amp; 7)</div>
<div class="two">
<div class="card" style="background:#DBEAFE;border-color:#185FA5;text-align:left">
  <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:14px;color:#185FA5;margin-bottom:8px">📖 Fiction</div>
  <div style="font-size:13px;line-height:1.8">Look for: characters, setting, plot. Ask: who, where, what happened, how did they feel?</div>
</div>
<div class="card" style="background:#D1FAE5;border-color:#0F6E56;text-align:left">
  <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:14px;color:#0F6E56;margin-bottom:8px">📰 Non-fiction</div>
  <div style="font-size:13px;line-height:1.8">Look for: the main idea, headings and subheadings, key facts.</div>
</div>
</div>

<div class="sec-head"><span class="sec-num">5</span>POETRY — RHYME &amp; RHYTHM (WEEK 10)</div>
${[
  ['🎵 Rhyme','Words that end with the same sound.','ہم قافیہ / قافية','"cat and hat rhyme."'],
  ['🥁 Rhythm','The beat or pattern in a poem.','تال / إيقاع','"Clap the rhythm as you read."'],
].map(([w,m,l1,eg])=>`
<div class="vocab-card" style="border-left-color:#534AB7">
  <div class="v-word" style="color:#534AB7">${w}</div>
  <div class="v-mean">${m}</div>
  <div class="v-l1">🌍 ${l1}</div>
  <div class="v-eg">✏️ e.g. ${eg}</div>
</div>`).join('')}

<div class="sec-head"><span class="sec-num">6</span>PERSONAL NARRATIVE &amp; DESCRIPTIVE WRITING (WEEKS 5 &amp; 9)</div>
<div class="tip"><strong>Personal narrative</strong> = a TRUE story about YOU, told in order, with your real feelings.<br/><strong>Descriptive writing</strong> = using adjectives and adverbs so the reader can imagine a place.</div>
${[
  ['#185FA5','#DBEAFE','One day, I will never forget _______.'],
  ['#0F6E56','#D1FAE5','I remember the time when _______.'],
].map(([col,bg,f])=>`<div class="frame" style="background:${bg};border-color:${col};color:${col}">${f}</div>`).join('')}

<div class="sec-head"><span class="sec-num">7</span>SPELLING RULES — YEAR 3/4 WORD LIST PART 1 (WEEK 6)</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Rule</th><th>Example</th></tr></thead><tbody>
<tr><td>Double the last letter before -ing/-ed (short vowel)</td><td>run → running</td></tr>
<tr><td>Drop the silent e before -ing</td><td>hope → hoping</td></tr>
<tr><td>Change y to i before -er/-est (after a consonant)</td><td>happy → happier</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">8</span>SPELLING TEST PRACTICE</div>
<div class="q-box">
  <div class="q-label">Write each word as your teacher reads it aloud</div>
  <div class="two" style="margin-top:8px">${Array(6).fill(0).map((_,i)=>`<input class="dline" placeholder="Word ${i+1}"/>`).join('')}</div>
</div>

<div class="remember" style="background:#185FA5">⭐ REMEMBER: Great writing uses correct sentence types, strong word choices, time-order words, and careful spelling!</div>`,

/* ── MATHS ──────────────────────────────────────────────── */
maths:`
<div class="banner" style="background:linear-gradient(135deg,#0F6E56,#065F46)">
  <div class="banner-label">SUBJECT 2 OF 5 · WEEK 12 · TERM 1 REVIEW</div>
  <div class="banner-title">🔢 Maths — Term 1 Review (Weeks 1–11)</div>
  <div class="banner-sub">Number · Tables · Fractions · Measurement · KS2 Level 3</div>
  <div class="name-row">Name: <input class="name-input" placeholder="________________"/></div>
</div>

<div class="review-tip">🔁 This week reviews EVERYTHING from Term 1 Maths before your number and operations skills test and mental arithmetic check.</div>

<div class="sec-head"><span class="sec-num">1</span>PLACE VALUE (WEEK 1)</div>
<div class="tip"><strong>Remember:</strong> Every digit's value depends on its position — Hundreds, Tens, Ones.</div>
<div class="tt">
${['H','T','O'].map(h=>`<div class="tt-cell" style="background:var(--teal);color:#fff">${h}</div>`).join('')}
${['4','8','2'].map(d=>`<div class="tt-cell"><input value="${d}" readonly/></div>`).join('')}
</div>

<div class="sec-head"><span class="sec-num">2</span>ADDITION &amp; SUBTRACTION — COLUMN METHOD (WEEKS 2–3)</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Operation</th><th>Rule</th></tr></thead><tbody>
<tr><td><strong>➕ Addition</strong></td><td>Start from ONES. CARRY when a column totals 10 or more.</td></tr>
<tr><td><strong>➖ Subtraction</strong></td><td>Start from ONES. BORROW when the top digit is too small.</td></tr>
<tr><td><strong>✅ Check</strong></td><td>Addition and subtraction are INVERSES — use one to check the other.</td></tr>
</tbody></table></div>

<div class="sec-head"><span class="sec-num">3</span>MULTIPLICATION TABLES (WEEKS 4–5)</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Table</th><th>Trick</th></tr></thead><tbody>
<tr><td><strong>2×, 5×, 10×</strong></td><td>10× just adds a zero. 5× ends in 0 or 5. 2× is doubling.</td></tr>
<tr><td><strong>3×</strong></td><td>Count in 3s: 3, 6, 9, 12, 15...</td></tr>
<tr><td><strong>4×</strong></td><td>Double the 2× table.</td></tr>
<tr><td><strong>8×</strong></td><td>Double the 4× table.</td></tr>
</tbody></table></div>
<div class="tt">
${['2×6','5×7','10×8','3×9','4×6','8×5'].map(f=>`<div class="tt-cell">${f}=<input placeholder="?"/></div>`).join('')}
</div>

<div class="sec-head"><span class="sec-num">4</span>DIVISION — SHARING &amp; GROUPING (WEEK 6)</div>
<div class="vocab-card">
  <div class="v-word" style="color:#0F6E56">➗ Divide</div>
  <div class="v-mean">To share a number into equal groups. Division is the INVERSE of multiplication.</div>
  <div class="v-l1">🌍 تقسیم / قسمة</div>
  <div class="v-eg">✏️ 20 ÷ 5 = 4, because 5 × 4 = 20</div>
</div>

<div class="sec-head"><span class="sec-num">5</span>FRACTIONS (WEEKS 7–8)</div>
<div class="tip"><strong>Fraction</strong> = part of a whole. Top number = parts you have, bottom number = total equal parts. To compare fractions with the same bottom number, the bigger top number is the bigger fraction.</div>

/* ── Render engine ──────────────────────────────────────── */
let cur='cover';
function render(){
  const stabs=document.getElementById('stabs');
  const pages=document.getElementById('pages');
  stabs.innerHTML=''; pages.innerHTML='';
  SUBJS.forEach(s=>{
    const el=document.createElement('div');
    el.className='stab'+(s.id===cur?' active':'');
    el.textContent=s.label;
    el.style.borderColor=s.col;
    el.style.color=s.id===cur?'#fff':s.col;
    if(s.id===cur) el.style.background=s.col;
    el.onclick=()=>{cur=s.id;render()};
    stabs.appendChild(el);
  });
  const pg=document.createElement('div');
  pg.className='page active';
  pg.innerHTML=PAGES[cur]||'<p style="padding:30px;color:var(--gray)">Loading...</p>';
  pages.appendChild(pg);
}
render();
</script>
