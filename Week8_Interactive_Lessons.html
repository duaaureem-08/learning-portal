<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 8 · KS2 Level 3 · Interactive Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --purple:#534AB7;--purple-light:#EEEDFE;
  --orange:#C2410C;--orange-light:#FFF0E6;
  --red:#B71C1C;--red-light:#FFEBEE;
  --green:#3B6D11;--green-light:#EAF3DE;
  --gray:#5F5E5A;--gray-light:#F1EFE8;
  --mgray:#CFD8DC;--text:#2C2C2A;--white:#FFFFFF;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Nunito Sans',sans-serif;background:#FFFBF0;color:var(--text);min-height:100vh;font-size:15px}
h1,h2,h3,h4{font-family:'Nunito',sans-serif}
.nav{background:var(--white);border-bottom:3px solid var(--amber-mid);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--teal);flex:1;min-width:100px}
.nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:20px;border:2px solid transparent;font-size:12px;font-weight:700;cursor:pointer;transition:.13s;font-family:'Nunito',sans-serif;white-space:nowrap}
.tab:hover{opacity:.82}
.tab.active{color:var(--white)!important}
.print-btn{background:var(--teal);color:var(--white);border:none;border-radius:20px;padding:7px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.print-btn:hover{opacity:.85}
.subject-tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.stab{padding:9px 18px;border-radius:22px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.stab:hover{opacity:.8}
.stab.active{color:var(--white)}
.page{display:none;padding:14px 18px 50px}
.page.active{display:block}
.ws-header{background:linear-gradient(130deg,var(--amber-light),var(--teal-light));border:2px solid var(--amber-mid);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ws-badge{background:var(--amber);color:var(--white);font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:3px 10px;border-radius:20px;letter-spacing:.4px;display:inline-block;margin-bottom:4px}
.ws-title{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--teal);margin:2px 0}
.ws-sub{font-size:12px;color:var(--gray);font-weight:600}
.name-line{border:none;border-bottom:1.5px solid var(--amber);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:12px;padding:2px 4px;outline:none;width:130px}
.section{margin-bottom:18px}
.sec-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-num{background:var(--teal);color:var(--white);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.q-block{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px}
.q-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--amber);margin-bottom:5px}
.q-text{font-size:14px;line-height:1.65;color:var(--text)}
.ans-line{width:100%;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;padding:6px 2px;outline:none;color:var(--text);margin-top:6px;display:block}
.ans-box{width:100%;min-height:50px;border:1.5px dashed var(--teal-mid);border-radius:var(--radius-sm);background:var(--teal-light);font-family:'Nunito Sans',sans-serif;font-size:14px;padding:8px;outline:none;color:var(--text);margin-top:6px;resize:none}
.inline-ans{display:inline-block;min-width:70px;border:none;border-bottom:1.5px dashed var(--teal-mid);background:transparent;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;color:var(--text);padding:2px 4px}
.tip-box{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:var(--blue);line-height:1.6}
.tip-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.l1-box{background:#FFF8E1;border-left:4px solid var(--amber);border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;margin-bottom:14px;color:#7B5B00;line-height:1.6}
.l1-box strong{font-family:'Nunito',sans-serif;font-weight:800}
.vocab-card{background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px;border-left:4px solid var(--teal)}
.vocab-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:var(--teal)}
.vocab-meaning{font-size:13px;color:var(--text);margin:3px 0;line-height:1.5}
.vocab-l1{font-size:12px;color:var(--blue);font-style:italic}
.vocab-eg{font-size:12px;color:var(--green);font-style:italic;margin-top:3px}
.word-bank{background:var(--purple-light);border:1.5px solid var(--purple);border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:14px}
.word-bank strong{font-family:'Nunito',sans-serif;font-weight:800;color:var(--purple);display:block;margin-bottom:6px;font-size:13px}
.word-tag{display:inline-block;background:var(--purple);color:var(--white);border-radius:20px;padding:2px 10px;margin:3px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif}
.circle-opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.opt{border:2px solid var(--amber);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;color:var(--amber);transition:.12s;background:var(--white)}
.opt:hover{opacity:.8}
.opt.correct{background:#3B6D11!important;color:var(--white)!important;border-color:#3B6D11!important}
.opt.wrong{background:#B71C1C!important;color:var(--white)!important;border-color:#B71C1C!important}
.tbl-wrap{overflow-x:auto}
table.ws-table{width:100%;border-collapse:collapse;font-size:13px}
table.ws-table th{background:var(--teal);color:var(--white);padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;text-align:left}
table.ws-table td{border-bottom:1px solid var(--amber-mid);padding:8px 10px;vertical-align:top}
table.ws-table tr:nth-child(even) td{background:var(--amber-light)}
table.ws-table input[type=text]{width:100%;border:none;background:transparent;font-family:'Nunito Sans',sans-serif;font-size:13px;outline:none;border-bottom:1px dashed var(--teal-mid);padding:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four-col{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.story-box{background:var(--teal-light);border:2px solid var(--teal-mid);border-radius:var(--radius);padding:15px 17px;font-size:14px;line-height:1.9;margin:8px 0}
.example-box{background:#F0FFF4;border:2px solid var(--teal-mid);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:10px;font-family:'Courier New',monospace}
.highlight-box{background:var(--orange-light);border:2px solid var(--orange);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;line-height:1.8;margin:8px 0}
.remember-box{border-radius:var(--radius-sm);padding:11px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--white);text-align:center;margin-top:12px}
.step-box{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--amber-mid);border-radius:var(--radius-sm);padding:11px;margin-bottom:8px}
.step-num{background:var(--teal);color:var(--white);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.step-text{font-size:13px;line-height:1.6}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0}
.info-card{border-radius:var(--radius-sm);padding:12px;text-align:center;border:2px solid}
.card-icon{font-size:30px;margin-bottom:5px}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px}
.card-desc{font-size:12px;margin-top:4px;line-height:1.5}
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--amber-light);font-size:13px;line-height:1.5}
.check-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:2px solid var(--teal);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chk.done{background:var(--teal);color:var(--white)}
.verse-box{background:#FFF8E1;border:3px solid var(--amber);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.verse-text{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);line-height:1.8}
.verse-ref{font-size:12px;color:var(--gray);margin-top:6px}
@media(max-width:600px){.two-col,.three-col,.four-col{grid-template-columns:1fr}}
@media print{.nav,.subject-tabs,.print-btn{display:none!important}.page{display:block!important}body{background:white}}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">📚 HOS · KS2 Level 3 · Week 8</div>
  <div class="nav-tabs" id="navTabs"></div>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
</div>
<div class="subject-tabs" id="subjectTabs"></div>
<div id="pages"></div>

<script>
const SUBJECTS = [
  {id:'eng',   label:'📖 English',    col:'#185FA5', lt:'#E6F1FB'},
  {id:'maths', label:'🔢 Maths',      col:'#0F6E56', lt:'#E1F5EE'},
  {id:'sci',   label:'🪨 Science',    col:'#C2410C', lt:'#FFF0E6'},
  {id:'hum',   label:'🌍 Humanities', col:'#534AB7', lt:'#EEEDFE'},
  {id:'bib',   label:'✝️ Bible',      col:'#B71C1C', lt:'#FFEBEE'},
];

const WS = {

eng:[
  { num:1, badge:'Conjunctions & Compound Sentences', title:'What is a Conjunction?',
    secs:[
      {t:'Learn the key words',          c:'eng_cj_vocab'},
      {t:'Spot the conjunction',         c:'eng_cj_spot'},
      {t:'Which conjunction fits?',      c:'eng_cj_choose'},
    ]},
  { num:2, badge:'Conjunctions & Compound Sentences', title:'Joining Sentences',
    secs:[
      {t:'Two sentences become one',     c:'eng_cj_join'},
      {t:'Practise joining',             c:'eng_cj_join_practice'},
      {t:'Fill in the conjunction',      c:'eng_cj_fill'},
    ]},
  { num:3, badge:'Conjunctions & Compound Sentences', title:'Writing With Conjunctions',
    secs:[
      {t:'Sentence frames',              c:'eng_cj_frames'},
      {t:'Write your own sentences',     c:'eng_cj_write'},
      {t:'Check and improve',            c:'eng_cj_edit'},
    ]},
],

maths:[
  { num:1, badge:'Fractions', title:'Comparing Fractions',
    secs:[
      {t:'Learn: numerator and denominator', c:'maths_fr_intro'},
      {t:'Same denominator — compare tops',  c:'maths_fr_samedenom'},
      {t:'Same numerator — compare bottoms', c:'maths_fr_samenum'},
    ]},
  { num:2, badge:'Fractions', title:'Equivalent Fractions',
    secs:[
      {t:'What are equivalent fractions?', c:'maths_fr_equiv'},
      {t:'Find the equivalent fraction',   c:'maths_fr_equiv_practice'},
      {t:'Fractions on a number line',     c:'maths_fr_numline'},
    ]},
  { num:3, badge:'Fractions', title:'Ordering Fractions',
    secs:[
      {t:'Order fractions — same denominator', c:'maths_fr_order1'},
      {t:'Word problems',                      c:'maths_fr_word'},
      {t:'Mixed fractions challenge',          c:'maths_fr_mixed'},
    ]},
],

sci:[
  { num:1, badge:'Fossils & Soil', title:'How Do Fossils Form?',
    secs:[
      {t:'Learn the key words',     c:'sci_fos_vocab'},
      {t:'The fossil story',        c:'sci_fos_story'},
      {t:'Put the stages in order', c:'sci_fos_sequence'},
    ]},
  { num:2, badge:'Fossils & Soil', title:'What Can Fossils Tell Us?',
    secs:[
      {t:'What fossils teach scientists', c:'sci_fos_teach'},
      {t:'True or False?',                c:'sci_fos_tf'},
      {t:'Fossil quiz',                   c:'sci_fos_quiz'},
    ]},
  { num:3, badge:'Fossils & Soil', title:'All About Soil',
    secs:[
      {t:'What is soil made of?',     c:'sci_soil_made'},
      {t:'Types of soil',             c:'sci_soil_types'},
      {t:'Why soil is important',     c:'sci_soil_important'},
    ]},
],

hum:[
  { num:1, badge:'The Romans in Britain', title:'Who Were the Romans?',
    secs:[
      {t:'Learn the key words',  c:'hum_rom_vocab'},
      {t:'The Roman Empire',     c:'hum_rom_empire'},
      {t:'True or False?',       c:'hum_rom_tf'},
    ]},
  { num:2, badge:'The Romans in Britain', title:'The Roman Invasion',
    secs:[
      {t:'Timeline of the invasion',  c:'hum_rom_timeline'},
      {t:'Put the events in order',   c:'hum_rom_sequence'},
      {t:'Comprehension questions',   c:'hum_rom_questions'},
    ]},
  { num:3, badge:'The Romans in Britain', title:'Roman Roads, Towns &amp; Legacy',
    secs:[
      {t:'What did the Romans build?',     c:'hum_rom_build'},
      {t:'The Roman legacy today',         c:'hum_rom_legacy'},
      {t:'My Romans fact file',            c:'hum_rom_factfile'},
    ]},
],

bib:[
  { num:1, badge:'The Ten Commandments', title:'God Gives the Commandments',
    secs:[
      {t:'Learn the key words',     c:'bib_tc_vocab'},
      {t:'Read the story',          c:'bib_tc_story'},
      {t:'Put the story in order',  c:'bib_tc_sequence'},
    ]},
  { num:2, badge:'The Ten Commandments', title:'The Ten Commandments Explained',
    secs:[
      {t:'Comprehension questions',                  c:'bib_tc_questions'},
      {t:'Loving God or loving people?',             c:'bib_tc_categorize'},
      {t:'The memory verse',                         c:'bib_tc_verse'},
    ]},
  { num:3, badge:'The Ten Commandments', title:'Rules Are a Gift — My Life Application',
    secs:[
      {t:'Why rules are a gift, not a punishment', c:'bib_tc_gift'},
      {t:'How can I keep God\'s rules this week?', c:'bib_tc_apply'},
      {t:'Draw and write',                          c:'bib_tc_draw'},
    ]},
],
};

function vc(word,meaning,l1,eg,color){
  color = color || 'teal';
  return `<div class="vocab-card" style="border-left-color:var(--${color})">
  <div class="vocab-word" style="color:var(--${color})">${word}</div>
  <div class="vocab-meaning">${meaning}</div>
  <div class="vocab-l1">🌍 ${l1}</div>
  <div class="vocab-eg">✏️ e.g. ${eg}</div>
</div>`;
}

function C(key){switch(key){

/* ─── ENGLISH ──────────────────────────────────────────── */

case 'eng_cj_vocab': return `
<div class="l1-box"><strong>🌍 In your language:</strong> Conjunction = حرف ربط (Urdu) · حرف عطف (Arabic). A conjunction is a JOINING word — it connects two sentences into one!</div>
${vc('🔗 Conjunction','A word that joins two sentences or ideas together.','حرف ربط / حرف عطف','"And, but, so, because and when are all conjunctions."','blue')}
${vc('📝 Compound sentence','Two simple sentences joined by a conjunction.','مرکب جملہ / جملة مركبة','"I was tired but I kept reading" is a compound sentence.','blue')}
${vc('➕ And','Adds one idea to another.','اور / و','"I like apples and I like oranges."','blue')}
${vc('↔️ But','Shows a difference or surprise.','لیکن / لكن','"I was tired but I kept going."','blue')}
${vc('❓ Because','Gives a reason — answers WHY.','کیونکہ / لأن','"I was happy because it was my birthday."','blue')}
<div class="q-block"><div class="q-text">A conjunction is a <input class="inline-ans" style="width:70px" placeholder="?"/> word that connects two <input class="inline-ans" style="width:80px" placeholder="?"/>.</div></div>`;

case 'eng_cj_spot': return `
<div class="tip-box"><strong>Find the conjunction</strong> in each sentence below. Click the joining word.</div>
${[
  ['I','was','hungry','and','I','ate','my','lunch.','and'],
  ['She','was','cold','but','she','did','not','wear','a','coat.','but'],
  ['He','studied','hard','so','he','passed','the','test.','so'],
  ['I','felt','happy','because','it','was','my','birthday.','because'],
  ['We','laughed','when','the','dog','jumped','in','the','pool.','when'],
].map((words,i)=>{
  const ans=words[words.length-1];const sentence=words.slice(0,-1);
  return `<div class="q-block"><div class="q-num">Sentence ${i+1}</div><div class="circle-opts">${sentence.map(w=>`<div class="opt" onclick="chk(this,'sp${i}','${w}','${ans}')">${w}</div>`).join('')}</div></div>`;
}).join('')}`;

case 'eng_cj_choose': return `
<div class="tip-box"><strong>Choose the BEST conjunction</strong> to complete each sentence.</div>
${[
  ['I was tired ___ I went to bed.',['and','so','but'],'so'],
  ['I like football ___ I like swimming.',['and','because','but'],'and'],
  ['She wanted to play outside ___ it was raining.',['so','but','because'],'but'],
  ['He smiled ___ he saw his friend.',['when','because','and'],'when'],
  ['I was scared ___ the room was dark.',['and','because','so'],'because'],
].map(([q,opts,ans],i)=>`
<div class="q-block"><div class="q-num">Sentence ${i+1}</div><div class="q-text">${q}</div>
<div class="circle-opts">${opts.map(o=>`<div class="opt" onclick="chk(this,'ch${i}','${o}','${ans}')">${o}</div>`).join('')}</div></div>`).join('')}`;

case 'eng_cj_join': return `
<div class="tip-box"><strong>Two simple sentences can become ONE compound sentence</strong> when you add a conjunction!</div>
${[
  ['I was hungry.','I ate my lunch.','and'],
  ['She studied hard.','She passed the test.','so'],
  ['He wanted to play.','It was raining.','but'],
].map(([s1,s2,conj])=>`
<div class="q-block">
  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:13px;margin-bottom:8px">
    <div style="background:#FEF3C7;border-radius:6px;padding:6px;text-align:center">${s1}</div>
    <div style="background:#185FA5;color:#fff;border-radius:20px;padding:3px 10px;font-weight:800;font-size:12px">${conj}</div>
    <div style="background:#FEF3C7;border-radius:6px;padding:6px;text-align:center">${s2}</div>
  </div>
  <div class="q-text">Write the new compound sentence:</div>
  <input class="ans-line" placeholder="Write your compound sentence here..."/>
</div>`).join('')}`;

case 'eng_cj_join_practice': return `
<div class="tip-box"><strong>Now you try!</strong> Join each pair using a good conjunction.</div>
${[
  ['I brushed my teeth.','I went to bed.'],
  ['It was sunny.','We went to the park.'],
  ['She was nervous.','She gave the best speech.'],
  ['The dog barked loudly.','It saw a cat.'],
].map(([s1,s2],i)=>`
<div class="q-block"><div class="q-num">Pair ${i+1}</div>
<div class="q-text">${s1} ___ ${s2}</div>
<input class="ans-line" placeholder="Write your joined sentence using and/but/so/because/when..."/>
</div>`).join('')}`;

case 'eng_cj_fill': return `
<div class="word-bank"><strong>Conjunction word bank:</strong>
${['and','but','so','because','when'].map(w=>`<span class="word-tag">${w}</span>`).join('')}
</div>
<p style="font-size:14px;margin-bottom:10px">Fill in the best conjunction from the word bank.</p>
${[
  'I was cold ___ I put on my coat.',
  'I like dogs ___ I like cats too.',
  'She wanted to swim ___ the pool was closed.',
  'He cried ___ he was happy.',
  'We ran inside ___ it started to rain.',
].map((q,i)=>`
<div class="q-block"><div class="q-num">Sentence ${i+1}</div><div class="q-text">${q}</div>
<input class="ans-line" placeholder="Type the conjunction..."/>
</div>`).join('')}`;

case 'eng_cj_frames': return `
<div class="word-bank"><strong>Conjunction word bank:</strong>
${['and','but','so','because','when'].map(w=>`<span class="word-tag">${w}</span>`).join('')}
</div>
<div class="tip-box"><strong>Use a sentence frame to practise:</strong></div>
${[
  ['#185FA5','#E6F1FB','I like ___ and I also like ___.'],
  ['#0F6E56','#E1F5EE','I wanted to ___ but ___.'],
  ['#C2410C','#FFF0E6','I felt happy because ___.'],
].map(([col,bg,f])=>`<div style="background:${bg};border:2px solid ${col};border-radius:var(--radius-sm);padding:11px 14px;font-family:Nunito,sans-serif;font-weight:700;font-size:13px;text-align:center;margin-bottom:8px;color:${col}">${f}</div>`).join('')}
<div class="q-block" style="margin-top:8px"><div class="q-text">Choose ONE sentence frame above and complete it:</div>
<input class="ans-line" placeholder="Write your sentence..."/></div>`;

case 'eng_cj_write': return `
<div class="tip-box"><strong>Remember:</strong> Use a different conjunction for each sentence. Make sure both halves of your sentence make sense together!</div>
${[

let curSubj = 'eng';
let curLesson = 1;

function chk(el, group, val, ans){
  const opts = el.parentElement.querySelectorAll('.opt');
  opts.forEach(o=>o.classList.remove('correct','wrong'));
  if(val === ans){
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    opts.forEach(o=>{ if(o.textContent.trim() === ans) o.classList.add('correct'); });
  }
}

function toggleChk(el){
  el.classList.toggle('done');
  el.textContent = el.classList.contains('done') ? '✓' : '';
}

function render(){
  const subjectTabs = document.getElementById('subjectTabs');
  const navTabs = document.getElementById('navTabs');
  const pages = document.getElementById('pages');

  subjectTabs.innerHTML = '';
  SUBJECTS.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'stab' + (s.id === curSubj ? ' active' : '');
    el.textContent = s.label;
    el.style.borderColor = s.col;
    el.style.color = s.id === curSubj ? '#fff' : s.col;
    if(s.id === curSubj) el.style.background = s.col;
    el.onclick = () => { curSubj = s.id; curLesson = 1; render(); };
    subjectTabs.appendChild(el);
  });

  const subj = SUBJECTS.find(s=>s.id === curSubj);
  const lessons = WS[curSubj];

  navTabs.innerHTML = '';
  lessons.forEach(l=>{
    const el = document.createElement('div');
    el.className = 'tab' + (l.num === curLesson ? ' active' : '');
    el.textContent = 'Lesson ' + l.num;
    el.style.borderColor = subj.col;
    el.style.color = l.num === curLesson ? '#fff' : subj.col;
    if(l.num === curLesson) el.style.background = subj.col;
    el.onclick = () => { curLesson = l.num; render(); };
    navTabs.appendChild(el);
  });

  const lesson = lessons.find(l=>l.num === curLesson);
  pages.innerHTML = `
  <div class="page active">
    <div class="ws-header">
      <div>
        <div class="ws-badge">${lesson.badge}</div>
        <div class="ws-title">${lesson.title}</div>
        <div class="ws-sub">Lesson ${lesson.num} of ${lessons.length} · ${subj.label} · Week 8</div>
      </div>
      <div>Name: <input class="name-line"/></div>
    </div>
    ${lesson.secs.map((sec,i)=>`
    <div class="section">
      <div class="sec-title"><span class="sec-num">${i+1}</span>${sec.t}</div>
      ${C(sec.c)}
    </div>`).join('')}
  </div>`;
}

render();
